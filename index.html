/* Public access screen */
body:has(#app > .access-page) { padding-bottom: 0; background: #f5f4ef; }
.access-page {
  --access-paper: #f5f4ef;
  --access-ink: #202b24;
  --access-muted: #526057;
  --access-green: #214c3b;
  --access-line: #d7ddd5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  color: var(--access-ink);
  background: var(--access-paper);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) max(24px, env(safe-area-inset-right))
    env(safe-area-inset-bottom) max(24px, env(safe-area-inset-left));
}
.access-header, .access-main, .access-footer { width: min(1120px, 100%); margin-inline: auto; }
.access-header { min-height: 84px; display: flex; align-items: center; }
.access-brand { display: flex; align-items: center; gap: 11px; }
.access-mark {
  width: 36px; height: 36px; border-radius: 7px; background: var(--access-green);
  display: grid; grid-template-columns: repeat(3, 3px); gap: 3px;
  align-content: center; justify-content: center; align-items: end;
}
.access-mark i { display: block; height: 11px; background: #eee3c9; }
.access-mark i:nth-child(2) { height: 17px; }
.access-mark i:nth-child(3) { height: 14px; }
.access-brand strong { font-size: 15px; letter-spacing: .15em; }
.access-main {
  margin-block: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 580px;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--access-line);
  border-radius: 20px;
  box-shadow: 0 16px 40px rgb(32 43 36 / .06);
}
.access-property {
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
  min-width: 0; padding: clamp(34px, 5vw, 69px);
  background: #193c30; color: #f7f1e2;
}
.access-property::before, .access-property::after {
  content: ""; position: absolute; pointer-events: none; z-index: -1;
}
.access-property::before {

  if(focused&&(/^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName)||focused.isContentEditable))return;
  revisionPollBusy=true;
  try{
    const probe=await authCall('staff_get_revision',{building_id:CONFIG.buildingId},true);
    if(probe?.updated_at&&probe.updated_at!==cloudRevision){
      await cloudLoadState();
      if(!syncBlocked){render();notify('Diğer cihazdaki yeni kayıtlar alındı.')}
    }
  }catch(e){console.warn('Cloud revision check failed',e)}
  finally{revisionPollBusy=false}
}

async function flushCloudSave(){
  if(cloudSavePromise)return cloudSavePromise;
  if(!cloudLoaded||syncBlocked||!authSession||!session||!['manager','caretaker'].includes(session.role))return false;
  const snapshot=persistPendingSnapshot();
  const expected=cloudRevision;
  const staffSession=session;
  setSyncStatus('Sunucuya kaydediliyor...');
  cloudSaveRunning++;
  cloudSavePromise=(async()=>{
    try{
      let response;
      try{
        response=await authCall('staff_save_state',{building_id:CONFIG.buildingId,payload:JSON.parse(snapshot),expected_updated_at:expected},true);
      }catch(saveError){
        // Network response may be lost AFTER the server committed. Read-back determines truth.
        const probe=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
        if(!probe?.state||stableSnapshot(probe.state)!==stableSnapshot(JSON.parse(snapshot)))throw saveError;
        response={updated_at:probe.updated_at};
      }
      const verified=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
      if(!verified?.state||verified.updated_at!==response.updated_at||stableSnapshot(verified.state)!==stableSnapshot(JSON.parse(snapshot))){
        const conflict=new Error('Sunucu doğrulaması başarısız; kayıt değişmiş olabilir.');
        conflict.syncConflict=true;
        throw conflict;
      }
      if(session!==staffSession)return false;
      cloudRevision=verified.updated_at;
      session.lastCloudSync=verified.updated_at;
      localStorage.setItem(LAST_CONFIRMED_REV_KEY,cloudRevision);
      localStorage.setItem(SESSION_KEY,JSON.stringify(session));
      localStorage.removeItem(LOCAL_SAVE_VERSION_KEY);
      saveRetryCount=0;
      if(JSON.stringify(state)===snapshot){
        localStorage.removeItem(PENDING_SYNC_KEY);
        setSyncStatus('Doğrulandı · '+new Date().toLocaleTimeString('tr-TR'));
      }else{
        persistPendingSnapshot();
        setSyncStatus('Yeni değişiklik bekliyor...');
      }
      return true;
    }catch(e){
      console.error('Supabase kayıt/doğrulama hatası:',e);
      const conflict=e.syncConflict||e.code==='SYNC_CONFLICT'||e.code==='REVISION_REQUIRED'||/daha yeni veri|sürümü eksik|doğrulaması başarısız/i.test(e.message||'');
      if(conflict){syncBlocked=true;setSyncStatus('Çakışma — yerel kopya korundu');notify('Başka cihazda yeni veri olabilir. İşlemler korunuyor; üzerine yazma engellendi.');}
      else{
        setSyncStatus('Bağlantı sorunu — yeniden denenecek');
        if(saveRetryCount<5){
          const delays=[3000,10000,20000,40000,60000];
          clearTimeout(saveRetryTimer);
          saveRetryTimer=setTimeout(()=>{saveRetryTimer=null;void flushCloudSave()},delays[saveRetryCount++]);
        }else notify('5 kayıt denemesi başarısız. Veriler yalnızca tarayıcıda korunuyor; JSON yedeği alın.');
      }
      return false;
    }finally{
      cloudSaveRunning--;
      cloudSavePromise=null;
      if(!syncBlocked&&localStorage.getItem(PENDING_SYNC_KEY)&&!saveRetryTimer&&saveRetryCount===0){
        clearTimeout(cloudTimer);
        cloudTimer=setTimeout(()=>{cloudTimer=null;void flushCloudSave()},350);
      }
    }
  })();
  return cloudSavePromise;
}
async function syncNow(){
  if(!session||!['manager','caretaker'].includes(session.role))return;
  if(cloudSavePromise){await cloudSavePromise;return}
  if(localRecoveryAvailable){openRecoverySync();return}
  if(syncBlocked){
    // A failed HTTP response might actually have been saved. Verify before remaining blocked.
    try{
      const remote=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
      if(remote?.state&&stableSnapshot(remote.state)===stableSnapshot(state)){
        cloudRevision=remote.updated_at;syncBlocked=false;cloudLoaded=true;saveRetryCount=0;
        localStorage.setItem(LAST_CONFIRMED_REV_KEY,cloudRevision);
        localStorage.removeItem(PENDING_SYNC_KEY);
        localStorage.setItem(LOCAL_SAVE_VERSION_KEY,JSON.stringify(state));
        setSyncStatus('Doğrulandı · '+new Date().toLocaleTimeString('tr-TR'));
        notify('Sunucudaki veriler doğrulandı.');
        return;
      }
    }catch(e){console.warn('Manual sync verification failed',e)}
    notify('Sunucu ile yerel veri farklı veya bağlantı yok. Mevcut JSON yedeğini koruyun; otomatik üzerine yazma engellendi.');
    return;
  }
  if(!cloudLoaded){await cloudLoadState();return}
  clearTimeout(cloudTimer);cloudTimer=null;
  clearTimeout(saveRetryTimer);saveRetryTimer=null;saveRetryCount=0;
  if(!localStorage.getItem(PENDING_SYNC_KEY)){
    const remote=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
    if(remote?.state&&remote.updated_at===cloudRevision&&stableSnapshot(remote.state)===stableSnapshot(state)){
      setSyncStatus('Doğrulandı · '+new Date().toLocaleTimeString('tr-TR'));
      notify('Sunucudaki kayıtlar doğrulandı. Yeni veri yok.');
      return;
    }
    syncBlocked=true;setSyncStatus('Sunucu farklı — yerel kopya korundu');
    notify('Sunucu kaydı değişmiş. Herhangi bir veri üzerine yazılmadı.');
    return;
  }
  const ok=await flushCloudSave();
  if(ok)notify('Sunucu kaydı geri okunarak doğrulandı.');
}

async function retryPendingImport(){
  if(session?.role!=='manager')return notify('Bu işlem yalnızca yönetici tarafından yapılabilir.');
  const metaRaw=localStorage.getItem(PENDING_SYNC_KEY);
  const raw=localStorage.getItem(STORE_KEY);
  if(!metaRaw||!raw)return notify('Bekleyen aktarım kaydı bulunamadı.');
  if(cloudSavePromise||cloudSaveRunning||spreadsheetCommitPending)return notify('Başka bir kayıt işlemi devam ediyor.');
  let pending,localData;
  try{pending=JSON.parse(metaRaw);localData=JSON.parse(raw)}catch(e){return notify('Bekleyen veri okunamıyor. JSON dosyasını indirin.');}
  if(!Array.isArray(localData?.units)||localData.units.length<30)return notify('Bekleyen verinin bütünlüğü doğrulanamadı.');
  try{
    const remote=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
    if(!remote?.state)return notify('Sunucudaki kayıt okunamadı.');
    if(stableSnapshot(remote.state)===stableSnapshot(localData)){
      state=normalizeState(remote.state);
      cloudRevision=remote.updated_at;cloudLoaded=true;syncBlocked=false;localRecoveryAvailable=false;remotePendingState=null;
      localStorage.setItem(STORE_KEY,JSON.stringify(state));
      localStorage.setItem(LAST_CONFIRMED_REV_KEY,cloudRevision);
      localStorage.removeItem(PENDING_SYNC_KEY);
      setSyncStatus('Doğrulandı · '+new Date().toLocaleTimeString('tr-TR'));
      closeModal();render();notify('Bekleyen aktarımın sunucuda zaten bulunduğu doğrulandı.');
      return;
    }
    if(remote.updated_at!==pending.base_revision){
      syncBlocked=true;remotePendingState=remote.state;localRecoveryAvailable=true;
      setSyncStatus('Çakışma: sunucu değişmiş');
      notify('Bu işlem başlatıldıktan sonra sunucu değişmiş. Otomatik aktarım durduruldu; iki kopyayı karşılaştırın.');
      return;
    }
    if((localData.bankTransactions||[]).length<(remote.state.bankTransactions||[]).length||
       (localData.payments||[]).length<(remote.state.payments||[]).length){
      notify('Bekleyen kopyada banka hareketi veya ödeme kaybı tespit edildi. Aktarım yapılmadı.');
      return;
    }
    const summary='Yerel: '+syncCount(localData)+'\\nSunucu: '+syncCount(remote.state);
    if(!confirm('Bekleyen yerel çalışmaları sunucuya yazmak istiyor musunuz? Önce Yerel JSON İndir ile yedek alın.\\n'+summary))return;
    const saved=await authCall('staff_save_state',{building_id:CONFIG.buildingId,payload:JSON.parse(JSON.stringify(localData)),expected_updated_at:remote.updated_at},true);
    const verified=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
    if(verified.updated_at!==saved.updated_at||stableSnapshot(verified.state)!==stableSnapshot(localData))
      throw new Error('Sunucudan geri okuma eşleşmedi. Tarayıcı verisi korundu.');
    state=normalizeState(verified.state);cloudRevision=verified.updated_at;cloudLoaded=true;syncBlocked=false;localRecoveryAvailable=false;remotePendingState=null;
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    localStorage.setItem(LAST_CONFIRMED_REV_KEY,cloudRevision);
    localStorage.removeItem(PENDING_SYNC_KEY);localStorage.removeItem(LOCAL_SAVE_VERSION_KEY);
    setSyncStatus('Doğrulandı · '+new Date().toLocaleTimeString('tr-TR'));
    closeModal();render();notify('Bekleyen aktarım Supabase\'e kaydedildi ve geri okunarak doğrulandı.');
  }catch(e){
    console.warn('Bekleyen aktarım hatası',e);
    setSyncStatus('Aktarım doğrulanamadı — yerel veri korundu');
    notify('Aktarım tamamlanamadı: '+e.message);
  }
}

async function authToken(){
  if(!authSession?.access_token)return '';
  const exp=Number(authSession.expires_at||0);
  if(exp && exp*1000>Date.now()+60000)return authSession.access_token;
  try{
    const {data,error}=await publicSb.auth.setSession({access_token:authSession.access_token,refresh_token:authSession.refresh_token});
    if(!error&&data?.session){
      authSession={access_token:data.session.access_token,refresh_token:data.session.refresh_token,expires_at:data.session.expires_at};
      localStorage.setItem(AUTH_SESSION_KEY,JSON.stringify(authSession));
      return authSession.access_token;
    }
  }catch(e){}
  return authSession.access_token;
}
async function authCall(action,body={},withAuth=false){
  const headers={'Content-Type':'application/json','apikey':CONFIG.supabaseAnonKey};
  if(withAuth){const t=await authToken();if(t)headers.Authorization='Bearer '+t}
  let res;
  try {
    res = await fetch(CONFIG.supabaseUrl+'/functions/v1/ibra-auth',{method:'POST',headers,body:JSON.stringify({action,...body})});
  } catch (cause) {
    throw Object.assign(new Error('Giriş servisine ulaşılamıyor.', {cause}), {authFailure: 'unavailable'});
  }
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok) {
    const failure = new Error(data.error||'İşlem başarısız');
    if (res.status >= 500 || res.status === 404) failure.authFailure = 'unavailable';
    else if (res.status === 401 || res.status === 403) failure.authFailure = 'credentials';
    throw failure;
  }
  return data;
}

function personSuggestedUnitsFromState(st,desc,unitId=null){
  const t=normTR(desc),hits=[];
  for(const r of (st.responsibilities||[])){
    if(!r.active || (unitId&&r.unitId!==unitId))continue;
    const p=(st.people||[]).find(x=>x.id===r.personId); if(!p)continue;
    const n=normTR(p.name||''); if(n&&n.length>=4&&t.includes(n))hits.push({unitId:r.unitId,personId:p.id,name:p.name});
  }
  const seen=new Set();return hits.filter(h=>{const k=h.unitId+'|'+h.personId;if(seen.has(k))return false;seen.add(k);return true});
}

function normalizeState(s){
  s.bankTransactions ||= []; s.payments ||= []; s.charges ||= []; s.people ||= []; s.responsibilities ||= []; s.expenses ||= []; s.settings ||= {}; s.settings.expenseCategories ||= [...DEFAULT_EXPENSE_CATEGORIES]; s.settings.overdueReminderDays ||= [1,3,7]; s.settings.bankBalances ||= {isbank:{balance:null,asOf:'',source:''},ziraat:{balance:null,asOf:'',source:''}};
  s.library ||= {}; s.library.decisions ||= []; s.library.contacts ||= []; s.library.documents ||= [];
  if(s.settings.lateFeeEnabled==null)s.settings.lateFeeEnabled=false;
  if(s.settings.lateFeeRate==null)s.settings.lateFeeRate=0;
  s.settings.lateFeeMode ||= 'daily';
  s.settings.lateFeeOverrides ||= [];
  s.bankTransactions.forEach(x=>{ if(!x.bankId)x.bankId='unknown'; if(x.allocatedAmount==null)x.allocatedAmount=Number(x.unitId?x.amount:0)||0; });
  s.responsibilities.forEach(r=>{ if(r.loginEnabled==null) r.loginEnabled=!!r.active; if(r.primaryResponsible==null) r.primaryResponsible=false; });
  s.people.forEach(p=>{ p.emails=Array.isArray(p.emails)?p.emails.filter(Boolean):[]; if(p.email&&!p.emails.includes(p.email))p.emails.unshift(p.email); p.emails=[...new Set(p.emails.map(x=>String(x).trim()).filter(Boolean))]; p.email=p.emails[0]||p.email||''; });
  s.units.forEach(u=>{ u.notificationEmails=Array.isArray(u.notificationEmails)?[...new Set(u.notificationEmails.map(x=>String(x).trim()).filter(Boolean))]:[]; });
  // Do not silently reassign historical payments during normalization.
  return s;
}
function saveState(){
  // Spreadsheet changes use their own single verified transaction; never queue an intermediate write.
  if(spreadsheetCommitPending)return;
  localStorage.setItem(STORE_KEY,JSON.stringify(state));
  if(session && ['manager','caretaker'].includes(session.role)){
    persistPendingSnapshot();
    if(!cloudLoaded||syncBlocked){
      setSyncStatus('Yerel kayıt bekliyor — buluta kaydedilmedi');
      return;
    }
    setSyncStatus('Değişiklik bekliyor...');
    clearTimeout(cloudTimer);
    if(!saveRetryTimer)cloudTimer=setTimeout(()=>{cloudTimer=null;void flushCloudSave()},350);
  }
}
let spreadsheetCommitPending=false;
async function commitSpreadsheetChange(change,action,detail){
  if(session?.role!=='manager')throw new Error('Bu işlemi yalnızca yönetici yapabilir.');
  if(spreadsheetCommitPending||cloudTimer||cloudSaveRunning)throw new Error('Devam eden kayıt tamamlanınca tekrar deneyin.');
  const previous=state,staffSession=session;
  const online=!!(authSession&&CONFIG.mode==='supabase');
  spreadsheetCommitPending=true;
  try{
    let working,sourceRevision=cloudRevision;
    if(online){
      const data=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
      if(!data?.state||session!==staffSession||cloudTimer||cloudSaveRunning)throw new Error('Güncel kayıtlar doğrulanamadı. Sayfayı yenileyip tekrar deneyin.');
      if(data.updated_at!==cloudRevision)throw new Error('Sunucuda daha güncel veri var. Önce diğer cihazdaki değişiklikleri kontrol edin.');
      sourceRevision=data.updated_at;
      working=normalizeState(data.state);
    }else{
      working=JSON.parse(JSON.stringify(previous));
    }
    let result;
    try{
      state=working;
      result=change();
      if(result.changed){
        working.audit||=[];
        working.audit.unshift({id:uid('a'),at:new Date().toISOString(),actor:staffSession.label||'Yönetici',action,detail:detail(result)});
        working.audit=working.audit.slice(0,300);
      }
    }finally{
      state=previous;
    }
    if(online&&result.changed){
      localStorage.setItem(STORE_KEY,JSON.stringify(working));
      localStorage.setItem(PENDING_SYNC_KEY,JSON.stringify({at:new Date().toISOString(),base_revision:sourceRevision,dirty:true}));
      if(!cloudLoaded||syncBlocked)throw new Error('Senkronizasyon doğrulanamadı. Önce senkronizasyon sorununu çözün.');
      const response=await authCall('staff_save_state',{building_id:CONFIG.buildingId,payload:JSON.parse(JSON.stringify(working)),expected_updated_at:sourceRevision},true);
      const verify=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
      if(verify.updated_at!==response.updated_at||stableSnapshot(verify.state)!==stableSnapshot(working))throw new Error('Yazım sonrası sunucu verisi doğrulanamadı.');
      cloudRevision=response.updated_at;
      session.lastCloudSync=cloudRevision;
      localStorage.setItem(LAST_CONFIRMED_REV_KEY,cloudRevision);
      localStorage.setItem(SESSION_KEY,JSON.stringify(session));
      localStorage.removeItem(LOCAL_SAVE_VERSION_KEY);
      localStorage.removeItem(PENDING_SYNC_KEY);
      setSyncStatus('Doğrulandı · '+new Date().toLocaleTimeString('tr-TR'));
    }
    if(session!==staffSession)throw new Error('Oturum değişti. Güncel kayıtları görmek için yeniden giriş yapın.');
    state=working;
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    if(online&&result.changed)cloudActivity(action,detail(result),{kind:'state_change'});
    return result;
  }finally{
    spreadsheetCommitPending=false;
  }
}
async function cloudLoadState(){
  if(!session || !['manager','caretaker'].includes(session.role) || !authSession) return;
  try{
    setSyncStatus('Buluttan okunuyor...');
    const data=await authCall('staff_get_state',{building_id:CONFIG.buildingId},true);
    if(!data?.state){
      cloudLoaded=false;syncBlocked=true;
      setSyncStatus('Sunucuda ana veri yok — hiçbir kayıt gönderilmiyor');
      notify('Supabase ana kaydı bulunamadı. İşlemler yalnızca tarayıcıda korunuyor.');
      return;
    }
    const existingRaw=localStorage.getItem(STORE_KEY);
    const pendingRaw=localStorage.getItem(PENDING_SYNC_KEY);
    const pending=(()=>{try{return pendingRaw?JSON.parse(pendingRaw):null}catch(e){return {dirty:true}}})();
    // A prior save may have reached the server even when its acknowledgement was lost.
    if(pending){
      let pendingState=null;
      try{pendingState=existingRaw?JSON.parse(existingRaw):null}catch(e){}
      if(!pendingState&&pending.payload)pendingState=pending.payload;
      // The current browser state may be newer than an old interrupted upload.
      // Never replace it with an older pending payload.
      if(!pendingState||!Array.isArray(pendingState.units)){
        syncBlocked=true;cloudLoaded=false;
        setSyncStatus('Bekleyen kayıt okunamıyor — manuel kurtarma gerekli');
        notify('Bekleyen kayıt okunamadı. Site verilerini temizlemeyin.');
        return;
      }
      if(stableSnapshot(pendingState)!==stableSnapshot(data.state)){
        state=normalizeState(pendingState);
        cloudRevision=data.updated_at;cloudLoaded=true;syncBlocked=true;
        localRecoveryAvailable=true;remotePendingState=data.state;
        // NEVER overwrite the last local copy when it contains unsent changes.
        localStorage.setItem(STORE_KEY,JSON.stringify(state));
        setSyncStatus('Bekleyen yerel çalışmalar — aktarım gerekli');
        notify('Bilgisayarda henüz aktarılmamış veriler var. Kurtarma Kontrolü ekranından iki kopyayı indirin.');
        return;
      }
      localStorage.removeItem(PENDING_SYNC_KEY);
    }
    if(existingRaw&&!pending){
      let candidate=null;
      try{candidate=JSON.parse(existingRaw)}catch(e){}
      if(candidate&&Array.isArray(candidate.units)&&!localStorage.getItem(LAST_CONFIRMED_REV_KEY)&&stableSnapshot(candidate)!==stableSnapshot(data.state)){
        // Legacy V1.35-V1.37 unsynced data: stop rather than erase it.
        state=normalizeState(candidate);
        cloudRevision=data.updated_at;cloudLoaded=true;syncBlocked=true;
        localRecoveryAvailable=true;remotePendingState=data.state;
        localStorage.setItem(PENDING_SYNC_KEY,JSON.stringify({at:new Date().toISOString(),dirty:true,reason:'legacy_mismatch'}));
        setSyncStatus('Yerel ve bulut verisi farklı — güvenli inceleme gerekli');
        notify('Tarayıcıdaki eski çalışmalar korundu. Önce JSON kopyalarını indirin.');
        return;
      }
    }
    state=normalizeState(data.state);
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    cloudRevision=data.updated_at;cloudLoaded=true;syncBlocked=false;
    remotePendingState=null;
    activePeriodId=state.periods.find(p=>p.status==='draft')?.id||state.periods[0]?.id;
    session.lastCloudSync=data.updated_at;
    localStorage.setItem(LAST_CONFIRMED_REV_KEY,cloudRevision);
    localStorage.setItem(SESSION_KEY,JSON.stringify(session));
    localStorage.removeItem(LOCAL_SAVE_VERSION_KEY);
    localRecoveryAvailable=!!localStorage.getItem(RECOVERY_KEY);
    setSyncStatus(localRecoveryAvailable?'Eski yerel kopya kontrol bekliyor':'Bulutla eşitlendi');
  }catch(e){
    console.warn('Cloud load failed',e);
    cloudLoaded=false;syncBlocked=true;
    setSyncStatus('Bulut okunamadı — veri tarayıcıda korunuyor');
    notify('Supabase bağlantısı başarısız. Bu cihazda kayıtlar korunuyor.');
  }
}

function ownerRelationAt(unitId,date=todayISO()){
  const rels=ownerRelations(unitId); const dated=rels.filter(x=>(!x.r.startDate||x.r.startDate<=date)&&(!x.r.endDate||x.r.endDate>=date));
  return dated.sort((a,b)=>(Number(b.r.primaryResponsible)-Number(a.r.primaryResponsible))||(Number(b.r.active)-Number(a.r.active)))[0]||rels.find(x=>x.r.active)||rels[rels.length-1]||null;
}
function ownerOf(unitId,date=todayISO()){const x=ownerRelationAt(unitId,date);return x?x.p:null}
function occupantOf(unitId,date=todayISO()){return activeTenant(unitId,date)||ownerOf(unitId,date)}
function responsiblePersonForDate(unitId,date=todayISO()){
  const tenant=activeRelations(unitId,'tenant',date)[0]; if(tenant)return person(tenant.personId); return ownerOf(unitId,date);
}
function activateOwnerResponsibility(unitId,startDate,preferredPersonId=''){
  const owners=ownerRelations(unitId); if(!owners.length) return null;
  let x=preferredPersonId?owners.find(o=>o.p.id===preferredPersonId):null;
  if(!x) x=owners.find(o=>o.r.active)||owners[owners.length-1]||owners[0];
  owners.forEach(o=>{ if(o!==x&&o.r.active){o.r.active=false;o.r.endDate=startDate;} });
  x.r.active=true; x.r.loginEnabled=true; x.r.startDate=startDate; x.r.endDate=null;
  return x;
}

  const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2400);
}
function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function normalizeResidentPortalState(x){
  const s=x&&typeof x==='object'?x:{};
  s.units ||= [];s.people ||= [];s.responsibilities ||= [];s.periods ||= [];s.meterReadings ||= [];
  s.charges ||= [];s.payments ||= [];s.invoices ||= [];s.expenses ||= [];s.assessments ||= [];
  s.notifications ||= [];s.bankTransactions ||= [];s.audit ||= [];s.settings ||= {};
  s.settings.expenseCategories ||= [];s.settings.overdueReminderDays ||= [1,3,7];s.settings.lateFeeOverrides ||= [];
  s.settings.bankBalances ||= {isbank:{balance:null,asOf:'',source:''},ziraat:{balance:null,asOf:'',source:''}};
  s.library ||= {decisions:[],contacts:[],documents:[]};
  s.library.decisions ||= [];s.library.contacts ||= [];s.library.documents ||= [];
  s.people.forEach(p=>{p.emails=Array.isArray(p.emails)?p.emails.filter(Boolean):[];if(p.email&&!p.emails.includes(p.email))p.emails.unshift(p.email)});
  return s;
}
async function login(code,password){
  code=String(code||'').trim();
  try{
    const data=await authCall('login',{username:code,password},false);
    authSession=data.session;
    localStorage.setItem(AUTH_SESSION_KEY,JSON.stringify(authSession));
    try{await publicSb.auth.setSession({access_token:authSession.access_token,refresh_token:authSession.refresh_token})}catch(e){}
    const a=data.account||{};
    const role=a.role==='manager'?'manager':a.role==='caretaker'?'caretaker':a.role==='owner'?'owner':'tenant';
    const unitId=localUnitIdForCode(a.username);
    const label=role==='manager'?'Admin':role==='caretaker'?'Engin':unitId?((unit(unitId)?.label||a.username)+' '+(role==='owner'?'Malik':'Kiracı')):(a.display_name||a.username);
    session={role,label,unitId,authAccountId:a.id,authUsername:a.username,mustChangePassword:!!a.must_change_password,recoveryEmail:a.recovery_email||null};
    localStorage.setItem(SESSION_KEY,JSON.stringify(session));
    if(['manager','caretaker'].includes(role)){await cloudLoadState();startOtherDeviceUpdates();}
    else {
      const {data:residentState,error:residentStateError}=await publicSb.rpc('resident_portal_state');
      if(residentStateError)throw residentStateError;
      state=normalizeResidentPortalState(residentState);
      localStorage.setItem(STORE_KEY,JSON.stringify(state));
    }
    route='home';render();
    if(role==='manager'&&!session.mustChangePassword)void syncGoogleMeterRows(true);
    cloudActivity('Giriş yaptı','Sisteme başarılı giriş',{kind:'login'});
    if(session.mustChangePassword)setTimeout(()=>openChangePassword(true),200);
    return null;
  }catch(e){
    console.warn(e);
    session=null;authSession=null;
    localStorage.removeItem(SESSION_KEY);localStorage.removeItem(AUTH_SESSION_KEY);
    try{await publicSb?.auth?.signOut()}catch(_e){}
    return e?.authFailure || 'other';
  }
}
async function logout(){
  if(cloudTimer){clearTimeout(cloudTimer);cloudTimer=null}
  if(cloudSavePromise)await cloudSavePromise;
  if(localStorage.getItem(PENDING_SYNC_KEY)&&!syncBlocked)await flushCloudSave();
  if(localStorage.getItem(PENDING_SYNC_KEY)||cloudSaveRunning||syncBlocked||(!cloudLoaded&&['manager','caretaker'].includes(session?.role))){
    notify('Bulut kaydı doğrulanmadı. Önce JSON yedek indirip senkronizasyonu kontrol edin.');return;
  }
  try{await cloudActivity('Çıkış yaptı','Oturumu kapattı',{kind:'logout'})}catch(e){}
  clearInterval(revisionPollHandle);revisionPollHandle=null;
  session=null;cloudAccess=null;authSession=null;cloudLoaded=false;cloudRevision=null;
  localStorage.removeItem(SESSION_KEY);localStorage.removeItem(AUTH_SESSION_KEY);
  try{await publicSb.auth.signOut()}catch(e){}
  route='home';render();
}

}

function toggleLoginPassword(button){
  const input = document.getElementById('loginPassword');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  button.textContent = show ? 'Şifreyi gizle' : 'Şifreyi göster';
}

async function doLogin(form){
  const button = form.querySelector('button[type=submit]');
  const error = form.querySelector('#loginErr');
  if (button.disabled) return;

  button.disabled = true;
  button.textContent = 'Giriş yapılıyor…';
  error.textContent = '';
  try {
    const failure = await login(form.elements.username.value, form.elements.password.value);
    if (!failure) return;

    const messages = {
      credentials: 'Kullanıcı adı, daire numarası veya şifreyi kontrol edip tekrar deneyin.',
      unavailable: 'Giriş servisine şu anda ulaşılamıyor. Biraz sonra tekrar deneyin.',
    };
    error.textContent = messages[failure] || 'Giriş tamamlanamadı. Lütfen tekrar deneyin.';
  } catch (e) {
    console.warn('Giriş ekranı hatası', e);
    error.textContent = 'Giriş tamamlanamadı. Lütfen tekrar deneyin.';
  } finally {
    button.disabled = false;
    button.textContent = 'Giriş yap';
  }
}

async function copyBuildingValue(value,label='Bilgi'){
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(value);
    }else{
      const ta=document.createElement('textarea');
      ta.value=value;
      ta.style.position='fixed';
      ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    notify(label+' kopyalandı.');
  }catch(e){
    notify(label+' kopyalanamadı.');
  }
}

let monthlyUnitReportPeriod=null;
let monthlyUnitReportMode='debt';
function unitMonthlyReport(){
  const periods=[...state.periods].sort((a,b)=>b.month.localeCompare(a.month));
  const p=periods.find(p=>p.id===monthlyUnitReportPeriod)||period()||periods[0];
  const title='Aylık Borç ve Tüketim';
  if(!p)return shell('<h2>'+title+'</h2><p>Henüz dönem kaydı yok.</p>',adminMainNav());
  const debtMode=monthlyUnitReportMode==='debt';
  const units=meterUnits().sort((a,b)=>a.code.localeCompare(b.code,'tr',{numeric:true}));
  const headings=debtMode?
    ['Soğuk su','Sıcak su','Su (birleşik)','Doğalgaz','Elektrik','Tüketim toplamı','Sabit aidat','Diğer / gecikme','Aylık toplam borç']:
    ['Doğalgaz','Sıcak su','Soğuk su'];
  const categories=['cold_water','hot_water','water','gas','electric','dues'];
  const totals=Array(headings.length).fill(0);
  const chargesByUnit=new Map(), metersByUnit=new Map();
  for(const c of state.charges){
    if(c.periodId!==p.id)continue;
    if(!chargesByUnit.has(c.unitId))chargesByUnit.set(c.unitId,[]);
    chargesByUnit.get(c.unitId).push(c);
  }
  for(const r of state.meterReadings){
    if(r.periodId!==p.id)continue;
    if(!metersByUnit.has(r.unitId))metersByUnit.set(r.unitId,new Map());
    metersByUnit.get(r.unitId).set(r.type,r);
  }
  const rows=units.map(u=>{
    let cells;
    if(debtMode){
      const charges=chargesByUnit.get(u.id)||[];
      const amounts=new Map();
      for(const c of charges){
        const key=categories.includes(c.type)?c.type:'other';
        amounts.set(key,(amounts.get(key)||0)+debtCents(c.amount));
      }
      const usage=categories.slice(0,5).reduce((sum,type)=>sum+(amounts.get(type)||0),0);
      const grand=usage+(amounts.get('dues')||0)+(amounts.get('other')||0);
      const values=[...categories.slice(0,5).map(key=>amounts.get(key)),amounts.size?usage:null,
        amounts.get('dues'),amounts.get('other'),amounts.size?grand:null];
      values.forEach((value,i)=>{totals[i]+=value||0;});
      cells=values.map(value=>value==null?'—':trMoney2(value/100));
    }else{
      cells=['gas','hot','cold'].flatMap(type=>{
        const r=metersByUnit.get(u.id)?.get(type);
        return [r?.previous,r?.current,r?.consumption].map((value,i)=>value==null?'—':trNum(value,i===2?3:0));
      });
    }
    return '<tr><th scope="row">'+esc(u.label)+'</th>'+cells.map(value=>'<td>'+value+'</td>').join('')+'</tr>';
  }).join('');
  const cols=headings.map(label=>'<th '+(debtMode?'scope="col"':'scope="colgroup" colspan="3"')+'>'+label+'</th>').join('');
  const sub=debtMode?'':'<tr>'+headings.map(()=>'<th scope="col">Önceki</th><th scope="col">Yeni</th><th scope="col">Tüketim (m³)</th>').join('')+'</tr>';
  const footer=debtMode?'<tfoot><tr><th scope="row">Apartman toplamı</th>'+totals.map(total=>'<td>'+trMoney2(total/100)+'</td>').join('')+'</tr></tfoot>':'';
  const debtDates=[...new Set(units.flatMap(u=>(chargesByUnit.get(u.id)||[])
    .filter(c=>c.type!=='late_fee'&&c.dueDate).map(c=>c.dueDate)))].sort();
  const due=(debtDates.length?debtDates:p.dueDate?[p.dueDate]:[])
    .map(date=>esc(date.split('-').reverse().join('.'))).join(', ')||'—';
  return shell(`<div class="monthlyPaymentReport">
    <h2 class="noPrint">${title}</h2>
    <div class="card stack noPrint" style="margin-top:10px">
      <label>Dönem<select id="monthlyUnitPeriod" onchange="monthlyUnitReportPeriod=this.value;render()">
        ${periods.map(item=>`<option value="${esc(item.id)}" ${item.id===p.id?'selected':''}>${esc(isoMonthLabel(item.month))}</option>`).join('')}
      </select></label>
      <div class="actions">
        <button aria-pressed="${debtMode}" class="${debtMode?'primary':''}" onclick="monthlyUnitReportMode='debt';render()">Borçlar</button>
        <button aria-pressed="${!debtMode}" class="${!debtMode?'primary':''}" onclick="monthlyUnitReportMode='meter';render()">Tüketimler</button>
        <button onclick="printAll()">Yazdır / PDF</button>
      </div>
    </div>
    <article class="card unitMonthlyReport" style="margin-top:10px">
      <h3>${esc(isoMonthLabel(p.month))} · ${debtMode?'Aylık Daire Borçları':'Aylık Daire Tüketimleri'}</h3>
      <p class="small">${debtMode?'Son ödeme tarihi: '+due+' · Borçlar tahakkuk tutarlarıdır.':'Endeksler ham sayaç değeri, tüketimler metreküp olarak gösterilir.'} “—” bu kalem için kayıt olmadığını gösterir.</p>
      <div class="tableWrap"><table aria-label="${debtMode?'Aylık daire borçları':'Aylık daire tüketimleri'}">
        <thead><tr><th scope="col" rowspan="${debtMode?1:2}">Daire</th>${cols}</tr>${sub}</thead>
        <tbody>${rows}</tbody>${footer}
      </table></div>
    </article></div>`,adminMainNav());
}

function unitOpenBalance(unitId){
  const ch=(state.charges||[]).filter(c=>c.unitId===unitId).reduce((a,c)=>a+Number(c.amount||0),0);
  const pay=(state.payments||[]).filter(x=>x.unitId===unitId).reduce((a,x)=>a+Number(x.amount||0),0);
  return ch-pay;
}
function overdueUnits(){
  const today=new Date(todayISO()+'T00:00:00');
  return state.units.map(u=>{
    const dueCharges=(state.charges||[]).filter(c=>c.unitId===u.id && c.dueDate && Number(c.amount||0)>0);
    if(!dueCharges.length)return null;
    const oldest=dueCharges.map(c=>c.dueDate).sort()[0];
    const d=new Date(oldest+'T00:00:00');
    const days=Math.floor((today-d)/86400000);
    const balance=unitOpenBalance(u.id);
    return days>0 && balance>0.01?{u,days,balance,dueDate:oldest}:null;
  }).filter(Boolean);
}
function reminderStage(days){
  if(days>=7)return 7;if(days>=3)return 3;if(days>=1)return 1;return 0;
}

  <div class="calcRule"><b>4. Sıcak su</b><br><span class="small">Dairenin sıcak su m³'ü hem su bedelini hem de sıcak suyun ısıtılmasından gelen gaz payını içerir. Kazan sıcaklığı dönemsel olarak saklanır (varsayılan ${state.settings.defaultBoilerTemp||44} °C).</span></div>
  <div class="calcRule"><b>5. Doğalgaz</b><br><span class="small">Gazın %${state.settings.gasConsumptionPct||70}'i tüketim, %${state.settings.gasSqmPct||30}'u m² oranıyla dağıtılır. Kombi aktifse %${state.settings.gasConsumptionPct||70} gerçek sayaç tüketimine göre; kombi kapalıysa bu bölüm 33 daireye eşit kabul edilerek dağıtılır. %${state.settings.gasSqmPct||30} m² payı her durumda uygulanır.</span></div>
  <div class="calcRule"><b>6. Elektrik ve aidat</b><br><span class="small">Ortak elektrik faturalarının toplamı 33 daireye eşit dağıtılır. Aidat dönem açılırken tanımlanır (varsayılan ${trMoney(state.settings.defaultDues||2000)}). Apartman yöneticisinin dairesi dönem bazında seçilerek yalnız sabit aidattan muaf tutulabilir; o dönemde sabit aidatı 0 TL olur, tüketim ve ek tahakkukları normal hesaplanır. Malik/kiracı değişiminde gerektiğinde aidat 30 gün üzerinden gün bazında, tüketim ise devir sayaç değeri üzerinden ayrılır. Kiracı çıktığında yeni kiracı başlayana kadar dairenin sorumluluğu otomatik olarak güncel malike geçer; bu boşluk dönemindeki sabit aidat ve yeni tahakkuklar malikin cari hesabına yazılır.</span></div>
  <div class="calcRule"><b>7. Sayaç ve fatura kontrolü</b><br><span class="small">Yeni sayaç endeksi önceki endeksten küçük olamaz. OCR/AI ile okunan fatura ve sayaç değerleri kesin kabul edilmez; Kat Görevlisi kontrol edip düzeltir ve onaylar.</span></div>
  <div class="calcRule"><b>8. Finansal kayıt</b><br><span class="small">Tahakkuk ile tahsilat ayrıdır. Banka girişi ödeme/tahsilattır; banka çıkışı gider ödemesidir. Gider/fatura kaydı banka çıkışıyla eşleştirilir. Manuel ödemeler kişi ve daire hesabına ayrıca girilebilir.</span></div>
  <div class="notice" style="margin-top:10px"><b>Aktif dönem:</b> ${isoMonthLabel(p.month)} · Son ödeme ${p.dueDate||'belirlenmedi'}.</div></div>`;
}

  const periods=[...state.periods].filter(p=>p.status!=='locked'&&!p.legacyOnly).sort((a,b)=>String(b.month).localeCompare(String(a.month)));
  if(periods.length<2)return notify('Birlikte hesaplamak için iki ayrı taslak dönem açılmalı.');

  openModal('<h2>İki Ayı Birlikte Hesapla</h2>'
    +'<div class="notice">İki ay tek işlemde hesaplanır ancak ayrı dönemler olarak kaydedilir. Her ayın vadesi, tüketimi, aidatı ve kişi sorumluluğu farklı kalır.</div>'
    +'<div class="grid2"><label>İlk ay<select id="twoPeriodFirst">'+options+'</select></label><label>İkinci ay<select id="twoPeriodSecond">'+options+'</select></label></div>'
    +'<div class="notice warn">Hesaplamadan önce iki dönemin sayaçları, faturaları ve son ödeme tarihleri tamamlanmış olmalı. Ödemeye bağlanmış veya paylaştırılmış mevcut borçlar değiştirilmez.</div>'
    +'<div class="actions"><button onclick="closeModal()">Vazgeç</button><button class="primary" id="twoPeriodSave" onclick="calculateTwoMonths()">İki Ayı Hesapla ve Doğrula</button></div>');
  const second=$('#twoPeriodSecond');if(second?.options.length>1)second.selectedIndex=1;
}
function calculationBlockReason(p){
  if(!p||p.status==='locked'||p.legacyOnly)return 'Dönem taslak hesaplamaya uygun değil.';
  if(state.charges.some(c=>c.periodId===p.id&&c.splitBatchId))return 'Dönemde paylaştırılmış borç var.';
  if(state.charges.some(c=>c.periodId===p.id&&['dues','cold_water','hot_water','gas','electric','late_fee'].includes(c.type)&&state.payments.some(pay=>pay.chargeId===c.id)))return 'Dönemin borçlarına ödeme bağlanmış.';
  if(state.charges.some(c=>c.periodId===p.id&&c.source==='legacy_manual'&&c.type!=='legacy_debt'))return 'Dönemde geçmişten aktarılmış borç var.';
  return '';
}
async function calculateTwoMonths(){
  const ids=[$('#twoPeriodFirst')?.value,$('#twoPeriodSecond')?.value];
  if(!ids[0]||ids[0]===ids[1])return notify('İki farklı ay seçin.');
  const periods=ids.map(id=>state.periods.find(p=>p.id===id));
  for(const p of periods){const reason=calculationBlockReason(p);if(reason)return notify((p?.month||'Dönem')+' · '+reason)}
  if(!confirm(periods.map(p=>periodListLabel(p.month)).join(' ve ')+' dönemleri birlikte hesaplansın mı?'))return;
  const button=$('#twoPeriodSave');if(button)button.disabled=true;
  try{
    const result=await commitSpreadsheetChange(()=>{
      for(const id of ids){
        const p=state.periods.find(x=>x.id===id),reason=calculationBlockReason(p);
        if(reason)throw Error(p?.month+' · '+reason);
        if(!calculatePeriod(id,{quiet:true}))throw Error(p?.month+' hesaplanamadı.');
      }
      return {changed:true,months:ids.map(id=>state.periods.find(p=>p.id===id).month)};
    },'İki dönem toplu hesaplandı',r=>r.months.join(' + '));
    closeModal();render();notify(result.months.map(periodListLabel).join(' ve ')+' hesaplandı; sunucuda doğrulandı.');
  }catch(e){notify('İki aylık hesaplama başarısız: '+e.message)}
  finally{if(button&&button.isConnected)button.disabled=false}
}

function createPeriod(){
  const month=$('#npMonth').value;if(!month)return; if(state.periods.some(p=>p.month===month)){notify('Bu dönem zaten var.');return}
  const managerUnit=$('#npManagerUnit')?.value||state.settings.defaultManagerDuesExemptUnitId||'';
  const p={id:uid('p'),month,status:'draft',boilerActive:$('#npBoiler').value==='1',dues:Number($('#npDues').value),dueDate:$('#npDue').value,boilerTemp:Number($('#npTemp').value),gasConsumptionPct:state.settings.gasConsumptionPct,gasSqmPct:state.settings.gasSqmPct,waterLossDivisor:state.settings.waterLossDivisor,lateFeeEnabled:state.settings.lateFeeEnabled,lateFeeRate:state.settings.lateFeeRate,lateFeeMode:state.settings.lateFeeMode,managerDuesExemptUnitId:managerUnit||null};
  state.periods.unshift(p);activePeriodId=p.id;saveState();logAudit('Dönem açıldı',month);closeModal();go('periodDetail');
}
function lockPeriod(){const p=period();p.status='locked';saveState();logAudit('Dönem kesinleştirildi',p.month);render();notify('Dönem kesinleştirildi ve kilitlendi.')}

function managerDuesExemptionText(p){

  const u=unit(p.managerDuesExemptUnitId);return `Yönetici aidat muafiyeti: ${u?.label||'Seçili daire'} · sabit aidat 0 TL`;
}
function managerDuesExemptionEditor(p){
  const options=state.units.filter(u=>u.type==='apartment'&&u.active).map(u=>`<option value="${u.id}" ${p.managerDuesExemptUnitId===u.id?'selected':''}>${u.label}</option>`).join('');
  return `<div class="card" style="margin-top:10px;border-left:5px solid #0f766e"><div class="sectionHead"><div><h3>Yönetici Aidat Muafiyeti</h3><div class="small muted">Bu ay apartman yöneticisinin yalnız sabit aidatı sıfırlanır. Tüketim, elektrik, gaz, su ve ek tahakkuklar etkilenmez.</div></div><span class="pill ${p.managerDuesExemptUnitId?'ok':''}">${p.managerDuesExemptUnitId?'MUAF':'MUAFİYET YOK'}</span></div><div class="grid2" style="margin-top:10px"><label>Yönetici dairesi<select id="mgrDuesUnit"><option value="">Muafiyet yok</option>${options}</select></label><div class="notice"><b>${managerDuesExemptionText(p)}</b><br><span class="small">Dönem: ${isoMonthLabel(p.month)} · Normal aidat: ${trMoney(p.dues)}</span></div></div><div class="actions" style="margin-top:10px"><button class="primary" onclick="saveManagerDuesExemption('${p.id}')">Muafiyeti Kaydet / Uygula</button></div></div>`;

function saveManagerDuesExemption(periodId){
  const p=state.periods.find(x=>x.id===periodId);if(!p)return;
  const previous=p.managerDuesExemptUnitId||null;const selected=$('#mgrDuesUnit')?.value||null;p.managerDuesExemptUnitId=selected;
  applyManagerDuesExemption(periodId,previous);saveState();syncLateFees(true);
  logAudit('Yönetici aidat muafiyeti güncellendi',`${isoMonthLabel(p.month)} · ${selected?(unit(selected)?.label||selected)+' sabit aidat 0 TL':'Muafiyet kaldırıldı'}`);
  render();notify(selected?'Seçilen yönetici dairesinin bu dönem sabit aidatı 0 TL yapıldı.':'Yönetici aidat muafiyeti kaldırıldı.');
}
function applyManagerDuesExemption(periodId,previousUnitId=null){
  const p=state.periods.find(x=>x.id===periodId);if(!p)return;
  state.charges.filter(c=>c.periodId===periodId&&c.type==='dues').forEach(c=>{
    const u=unit(c.unitId);if(!u)return;
    const exempt=!!p.managerDuesExemptUnitId&&c.unitId===p.managerDuesExemptUnitId;
    c.rawAmount=exempt?0:Number(p.dues||0)*Number(u.duesMultiplier||1);c.amount=exempt?0:roundTL(c.rawAmount);c.label=exempt?'Sabit Aidat (Yönetici Muaf)':'Sabit Aidat';c.dueDate=p.dueDate;c.managerExempt=exempt;
  });
}

function unitRelationships(unitId){return state.responsibilities.filter(r=>r.unitId===unitId).map(r=>({r,p:person(r.personId)})).filter(x=>x.p).sort((a,b)=>(b.r.active-a.r.active)||relRoleLabel(a.r.role).localeCompare(relRoleLabel(b.r.role),'tr'))}
function unitFinancialSummary(unitId){
  const charges=(state.charges||[]).filter(c=>c.unitId===unitId),payments=(state.payments||[]).filter(p=>p.unitId===unitId);
  const total=charges.reduce((a,c)=>a+Number(c.amount||0),0),paid=payments.reduce((a,p)=>a+Number(p.amount||0),0);
  return {charges,payments,total,paid,balance:total-paid,late:charges.filter(c=>c.type==='late_fee').reduce((a,c)=>a+Number(c.amount||0),0)};

function unitPeriodConsumption(unitId){

function ledgerResponsibilityBounds(unitId,personId){
  return state.responsibilities.filter(r=>r.unitId===unitId&&r.personId===personId);
}
function ledgerChargePeriodDate(charge){
  const month=state.periods.find(p=>p.id===charge.periodId)?.month;
  return /^\d{4}-\d{2}$/.test(month||'')?month+'-01':null;
}
function chargeAccountPersonId(c){
  if(c.personId)return c.personId;
  if(c.assignmentReviewed||c.source==='legacy_manual'||c.source==='historical_pdf')return null;
  const month=state.periods.find(p=>p.id===c.periodId)?.month;
  return month?debtPersonForMonth(c.unitId,month):null;
}
function personLedgerEntries(unitId,personId){
  const rels=ledgerResponsibilityBounds(unitId,personId);
  const allowed=date=>!date||rels.some(r=>(!r.startDate||r.startDate<=date)&&(!r.endDate||r.endDate>=date));
  return {
    charges:state.charges.filter(c=>c.unitId===unitId&&chargeAccountPersonId(c)===personId&&(c.splitBatchId||c.assignmentReviewed||c.manualTransferAt||allowed(ledgerChargePeriodDate(c)))),
    payments:state.payments.filter(p=>p.unitId===unitId&&p.personId===personId&&allowed(p.date||null))
  };
}
function bankNameForPayment(p){
  const tx=state.bankTransactions.find(x=>x.id===p.bankTransactionId);
  const id=p.bankId||tx?.bankId;
  return p.bankName||BANK_PROFILES[id]?.name||id||p.paymentMethod||'Banka belirtilmemiş';
}
function chargePeriodName(c){
  const month=state.periods.find(p=>p.id===c.periodId)?.month;
  return month?periodListLabel(month):(c.dueDate?c.dueDate.slice(0,7):'Dönem belirsiz');
}
function ledgerDebtGroups(charges){
  const map=new Map();
  charges.forEach(c=>{
    const key=(c.periodId||'none')+'|'+(c.dueDate||'');
    if(!map.has(key))map.set(key,{periodId:c.periodId||null,periodName:chargePeriodName(c),due:c.dueDate||'—',items:[],amount:0,sort:c.dueDate||ledgerChargePeriodDate(c)||''});
    const row=map.get(key);row.items.push(c);row.amount+=Number(c.amount||0);
  });
  return [...map.values()].sort((a,b)=>b.sort.localeCompare(a.sort));
}
function ledgerRowsHTML(unitId,charges,payments,personId=''){
  const money=n=>trMoney(n);
  const debts=ledgerDebtGroups(charges).map(g=>{
    const id=String(g.periodId||'').replace(/[^a-zA-Z0-9_:-]/g,'');
    const due=String(g.due||'').replace(/[^0-9-]/g,'');
    const names=[...new Set(g.items.map(c=>person(chargeAccountPersonId(c))?.name||'Atanmamış'))];
    return '<tr><td>Borç</td><td>'+esc(g.periodName)+'</td><td>'+esc(g.due)+'</td><td title="'+esc(names.join(', '))+'">'+esc(names.join(', '))+'</td><td class="num"><b>'+money(g.amount)+'</b></td><td class="ledgerAct"><button onclick="showDebtComponents(\''+unitId+'\',\''+id+'\',\''+due+'\',\''+personId+'\')">Kalemler</button>'+(personId?'':'<button onclick="openChargeOwnerEditor(\''+unitId+'\',\''+id+'\',\''+due+'\')">Sorumlu değiştir</button>')+'</td></tr>';
  });
  const incomes=[...payments].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(p=>
    '<tr><td>Ödeme</td><td>'+esc(p.date||'—')+'</td><td>—</td><td>'+esc(bankNameForPayment(p))+'</td><td class="num ok"><b>'+money(p.amount)+'</b></td><td class="ledgerAct">'+(personId?esc(p.description||'Ödeme'):'<button onclick="openPaymentOwnerEditor(\''+unitId+'\',\''+p.id+'\')">Kişi değiştir</button>')+'</td></tr>');
  const joined=[...debts,...incomes];
  const totalDebt=charges.reduce((n,c)=>n+Number(c.amount||0),0);
  const totalPaid=payments.reduce((n,p)=>n+Number(p.amount||0),0);
  return '<div class="tableWrap"><table class="compactLedger"><thead><tr><th>İşlem</th><th>Dönem / Tarih</th><th>Son Ödeme</th><th>Banka</th><th>Tutar</th><th>Ayrıntı</th></tr></thead><tbody>'
    +(joined.join('')||'<tr><td colspan="6">Bu hesaba bağlı işlem bulunmuyor.</td></tr>')+
    '</tbody><tfoot><tr><th colspan="4">Toplam ödenen</th><th colspan="2">'+money(totalPaid)+'</th></tr>'+
    '<tr><th colspan="4">Toplam borç</th><th colspan="2">'+money(totalDebt)+'</th></tr>'+
    '<tr><th colspan="4">Denge (borç − ödeme)</th><th colspan="2">'+money(totalDebt-totalPaid)+'</th></tr></tfoot></table></div>';
}

    .map(x=>'<option value="'+x.p.id+'" '+(selected===x.p.id?'selected':'')+'>'+esc(x.p.name)+' · '+(x.r.active?'Aktif':'Eski')+' ('+esc(x.r.startDate||'?')+'–'+esc(x.r.endDate||'...')+')</option>').join('');

    +'<div class="actions"><button onclick="openUnitCenter(\''+unitId+'\')">← Geri</button><button class="primary" onclick="saveChargeOwnerTransfer(\''+unitId+'\',\''+periodId+'\',\''+dueDate+'\')">Sorumluluğu Kaydet</button></div>');
}
function refreshChargeOwnerScope(){}
async function saveChargeOwnerTransfer(unitId,periodId,dueDate){
  const selection=$('#ownerScope')?.value,target=$('#ownerTarget')?.value||null;
  if(!selection)return;
  const rows=chargeOwnerPeriodItems(unitId,periodId,dueDate).filter(c=>selection==='all'||c.id===selection);
  if(!rows.length)return notify('Aktarılacak borç kalemi yok.');
  if(target&&!state.responsibilities.some(r=>r.unitId===unitId&&r.personId===target))return notify('Seçilen kişi bu daireye bağlı değil.');
  if(rows.some(c=>state.payments.some(p=>p.chargeId===c.id)))return notify('Ödemeye bağlı borç kalemi aktarılamaz. Önce ilgili ödemeleri kontrol et.');
  const next=target?(person(target)?.name||''):'Atanmamış';
  if(!confirm(rows.length+' borç kalemi '+next+' hesabına aktarılsın mı? Toplam tutar değişmeyecek.'))return;
  try{
    const result=await commitSpreadsheetChange(()=>{
      const records=chargeOwnerPeriodItems(unitId,periodId,dueDate).filter(c=>selection==='all'||c.id===selection);
      if(records.length!==rows.length||records.some(c=>state.payments.some(p=>p.chargeId===c.id)))throw Error('Borçlar değişmiş veya ödemeye bağlanmış.');
      if(target&&!state.responsibilities.some(r=>r.unitId===unitId&&r.personId===target))throw Error('Kişi ilişkisi bulunamadı.');
      records.forEach(c=>{c.personId=target;c.assignmentReviewed=true;c.manualTransferAt=new Date().toISOString()});
      return {changed:true,count:records.length};
    },'Borç sorumlusu yönetici tarafından değiştirildi',x=>unit(unitId).label+' · '+periodListLabel(state.periods.find(p=>p.id===periodId)?.month||'')+' · '+next+' · '+x.count+' kalem');
    closeModal();render();openUnitCenter(unitId);notify(result.count+' borç kaleminin kişi hesabı doğrulandı.');
  }catch(e){notify('Borç devri kaydedilemedi: '+e.message)}
}
function openPaymentOwnerEditor(unitId,paymentId){
  const p=state.payments.find(x=>x.id===paymentId&&x.unitId===unitId);if(!p)return;
  openModal('<h2>Ödeme Sorumlusunu Düzenle</h2>'
    +'<div class="notice">'+esc(p.date||'')+' · '+esc(bankNameForPayment(p))+' · '+trMoney(p.amount)+'</div>'
    +'<label>Hesaba işlenecek kişi<select id="paymentOwnerTarget">'+personOptionsForTransfer(unitId,p.personId||'')+'</select></label>'
    +'<div class="notice warn">Ödeme bir borç kalemine bağlıysa, yalnızca o borçtaki kişiye yönlendirilebilir. Borç/ödeme bağlantıları korunur.</div>'
    +'<div class="actions"><button onclick="openUnitCenter(\''+unitId+'\')">← Geri</button><button class="primary" onclick="savePaymentOwnerTransfer(\''+unitId+'\',\''+paymentId+'\')">Kaydet</button></div>');
}
async function savePaymentOwnerTransfer(unitId,paymentId){
  const personId=$('#paymentOwnerTarget')?.value||null;
  const orig=state.payments.find(p=>p.id===paymentId&&p.unitId===unitId);
  if(!orig)return;
  if(orig.chargeId){
    const debt=state.charges.find(c=>c.id===orig.chargeId);
    if(debt&&chargeAccountPersonId(debt)!==personId)return notify('Bu ödeme farklı bir kişinin borcuna bağlı. Önce bağlantıyı kontrol et.');
  }
  try{
    const result=await commitSpreadsheetChange(()=>{
      const p=state.payments.find(x=>x.id===paymentId&&x.unitId===unitId);
      if(!p)throw Error('Ödeme kaydı bulunamadı.');
      if(personId&&!state.responsibilities.some(r=>r.unitId===unitId&&r.personId===personId))throw Error('Kişi ilişkisi yok.');
      const debt=state.charges.find(c=>c.id===p.chargeId);
      if(debt&&chargeAccountPersonId(debt)!==personId)throw Error('Ödeme bağlı olduğu borcun kişisiyle uyuşmuyor.');
      if(p.personId===personId)return {changed:false};
      p.personId=personId;p.manualTransferAt=new Date().toISOString();
      return {changed:true};
    },'Ödeme kişi hesabı düzeltildi',()=>unit(unitId).label+' · '+trMoney(orig.amount));
    closeModal();render();openUnitCenter(unitId);notify(result.changed?'Ödeme hesabı doğrulandı.':'Değişiklik yok.');
  }catch(e){notify('Ödeme değişikliği kaydedilemedi: '+e.message)}
}

function showDebtComponents(unitId,periodId,dueDate,personId=''){
  const all=personId?personLedgerEntries(unitId,personId).charges:state.charges.filter(c=>c.unitId===unitId);

function canRemovePersonFromUnit(unitId,personId){
  const r=state.responsibilities.filter(x=>x.unitId===unitId&&x.personId===personId);
  const c=state.charges.filter(x=>x.personId===personId),p=state.payments.filter(x=>x.personId===personId),
        b=state.bankTransactions.filter(x=>x.personId===personId);
  const other=state.responsibilities.filter(x=>x.personId===personId&&x.unitId!==unitId);
  const problems=[];
  if(!r.length)problems.push('Bu dairede kişi ilişkisi yok.');
  if(c.length||p.length||b.length)problems.push((c.length+p.length+b.length)+' finansal hareket bağlı.');
  if(r.some(x=>x.loginEnabled))problems.push('Giriş yetkisi açık. Önce giriş yetkisini kapat.');
  if(other.length)problems.push('Başka daire bağlantısı da var; yalnızca bu daire ilişkisi kaldırılabilir.');
  return {allowed:!problems.some(x=>x.includes('finansal')||x.includes('Giriş')||x.includes('yok')),problems,shared:!!other.length};
}
async function removePersonFromUnit(unitId,personId){
  const p=person(personId),u=unit(unitId),check=canRemovePersonFromUnit(unitId,personId);
  if(!p||!u)return;
  if(!check.allowed){notify('Silinemiyor: '+check.problems.join(' '));return}
  if(!confirm(u.label+' · '+p.name+' kaydı silinsin mi? Bu işlem kişi ve daire ilişkisini kaldırır; geri almak için yedek gerekir.'))return;
  try{
    const result=await commitSpreadsheetChange(()=>{
      const serverCheck=canRemovePersonFromUnit(unitId,personId);
      if(!serverCheck.allowed)throw new Error(serverCheck.problems.join(' '));
      state.responsibilities=state.responsibilities.filter(r=>!(r.unitId===unitId&&r.personId===personId));
      const stillUsed=state.responsibilities.some(r=>r.personId===personId);
      if(!stillUsed)state.people=state.people.filter(x=>x.id!==personId);
      return {changed:true,name:p.name};
    },'Hatalı kişi kaydı silindi',x=>u.label+' · '+x.name);
    closeModal();render();openUnitCenter(unitId);notify(result.name+' kaydı silindi ve Supabase üzerinde doğrulandı.');
  }catch(e){notify('Kişi silme başarısız: '+e.message)}
}

async function assignDebtOwner(unitId,periodId,due){
  const personId=$('#assignDebtPerson')?.value;
  if(!personId)return notify('Sorumlu kişi seçin.');
  const periodForMatch=state.periods.find(p=>p.id===periodId)?.month;
  const asAt=periodForMatch?periodForMatch+'-01':null;
  const candidate=state.responsibilities.find(r=>r.unitId===unitId&&r.personId===personId);
  if(!candidate)return notify('Seçilen kişi bu daireye bağlı değil.');
  if(asAt&&candidate.startDate&&candidate.startDate>asAt)return notify('Kişinin başlangıç tarihi bu borç döneminden sonra. Borç ona devredilemez.');
  if(!confirm('Bu dönemdeki atanmamış borç kalemleri '+person(personId)?.name+' hesabına yazılsın mı?'))return;
  try{
    const res=await commitSpreadsheetChange(()=>{
      const rel=state.responsibilities.find(r=>r.unitId===unitId&&r.personId===personId);
      if(!rel||asAt&&rel.startDate&&rel.startDate>asAt)throw new Error('Sorumluluk tarihleri uygun değil.');
      let assigned=0;
      state.charges.forEach(c=>{
        if(c.unitId===unitId&&!chargeAccountPersonId(c)&&String(c.periodId||'')===periodId&&String(c.dueDate||'')===due){c.personId=personId;assigned++}
      });
      return {changed:assigned>0,assigned};
    },'Geçmiş borç sorumlusu atandı',r=>unit(unitId).label+' · '+person(personId)?.name+' · '+r.assigned+' kalem');
    closeModal();render();openUnassignedLedger(unitId);notify(res.assigned+' borç kalemi kişiye bağlandı ve doğrulandı.');
  }catch(e){notify('Atama kaydedilemedi: '+e.message)}
}

    .map(p=>'<option value="'+esc(p.id)+'">'+esc(periodListLabel(p.month))+'</option>').join('');

function debtSplitPersonOptions(unitId){

function splitMoneyToCents(n){return Math.round(Number(n||0)*100)}
function splitPreviewData(){
  const unitId=$('#splitUnit')?.value,periodId=$('#splitPeriod')?.value;
  const per=state.periods.find(p=>p.id===periodId),entries=splitPeriodCharges(unitId,periodId);
  const first=$('#splitFirst')?.value,second=$('#splitSecond')?.value,mode=$('#splitMode')?.value;
  if(!per||!first||!second||first===second)throw Error('İki farklı kişi seçmelisiniz.');
  if(!entries.length)throw Error('Seçilen ayda borç kaydı yok.');
  if(entries.some(c=>state.payments.some(p=>p.chargeId===c.id)))throw Error('Bu ayın bazı borçlarına ödeme bağlanmış. Paylaştırmadan önce ödemelerin ilişkisi kontrol edilmeli.');
  if(entries.some(c=>c.splitBatchId))throw Error('Bu dönemde önceden bölünmüş borç kalemleri var; çift bölme engellendi.');
  const totalCents=entries.reduce((n,c)=>n+splitMoneyToCents(c.amount),0);
  let firstCents=0,ratio=0,details='';
  if(mode==='days'){
    const cut=$('#splitChangeDate')?.value;
    if(!cut||cut.slice(0,7)!==per.month)throw Error('Geçiş tarihi seçilen dönemin içinde olmalı.');
    const [year,month]=per.month.split('-').map(Number);
    const length=new Date(year,month,0).getDate(),firstDays=Number(cut.slice(8))-1;
    ratio=firstDays/length;
    firstCents=Math.round(totalCents*ratio);
    details=firstDays+' gün / '+(length-firstDays)+' gün';
  }else{
    const input=String($('#splitFirstAmount')?.value||'').replace(',','.');
    if(!/^\d+(\.\d{1,2})?$/.test(input))throw Error('İlk kişinin tutarını TL olarak girin (en fazla 2 ondalık).');
    firstCents=splitMoneyToCents(Number(input));ratio=totalCents?firstCents/totalCents:0;
    details='Elle belirlenen toplam tutar';
  }
  if(firstCents<0||firstCents>totalCents)throw Error('Pay toplam borç tutarının dışında olamaz.');
  // Allocating each line proportionally with controlled remainder ensures exact cents.
  const results=[];let allocated=0;
  entries.forEach((c,index)=>{
    const cents=splitMoneyToCents(c.amount);
    let firstPart=index===entries.length-1?firstCents-allocated:Math.round(cents*ratio);
    firstPart=Math.min(cents,Math.max(0,firstPart));
    results.push({original:c,firstCents:firstPart,secondCents:cents-firstPart});
    allocated+=firstPart;
  });
  // Correct rounding drift deterministically, respecting each charge's bounds.
  let drift=firstCents-allocated;
  for(const row of results){
    if(!drift)break;
    const possible=drift>0?row.secondCents:row.firstCents;
    const step=Math.sign(drift)*Math.min(Math.abs(drift),possible);
    row.firstCents+=step;row.secondCents-=step;drift-=step;
  }
  if(drift||results.reduce((n,r)=>n+r.firstCents,0)!==firstCents)throw Error('Kuruş dağılımı doğrulanamadı.');
  return {unitId,periodId,first,second,totalCents,firstCents,secondCents:totalCents-firstCents,details,results,mode};
}

      +'<div class="tableWrap"><table><thead><tr><th>Borç kalemi</th><th>'+esc(first)+'</th><th>'+esc(second)+'</th></tr></thead><tbody>'

}

async function saveDebtSplit(){
  let preview;
  try{preview=splitPreviewData()}catch(e){return notify(e.message)}
  if(!confirm(periodListLabel(state.periods.find(p=>p.id===preview.periodId)?.month||'')+' borçları '+person(preview.first).name+' ve '+person(preview.second).name+' arasında paylaştırılacak. Toplam borç korunacak. Onaylıyor musunuz?'))return;
  const button=$('#splitSave');if(button)button.disabled=true;
  try{
    const r=await commitSpreadsheetChange(()=>{
      if(!state.responsibilities.some(x=>x.unitId===preview.unitId&&x.personId===preview.first)||!state.responsibilities.some(x=>x.unitId===preview.unitId&&x.personId===preview.second))throw Error('Kişi ilişkisi değişmiş.');
      const rows=splitPeriodCharges(preview.unitId,preview.periodId);
      if(rows.length!==preview.results.length||rows.some((c,i)=>c.id!==preview.results[i].original.id||splitMoneyToCents(c.amount)!==splitMoneyToCents(preview.results[i].original.amount))||rows.some(c=>c.splitBatchId||state.payments.some(p=>p.chargeId===c.id)))
        throw Error('Borçlar değişmiş veya ödemeye bağlanmış. Önizlemeyi yeniden oluşturun.');
      const batch=uid('split');
      const keep=state.charges.filter(c=>!(c.unitId===preview.unitId&&c.periodId===preview.periodId));
      const parts=[];
      for(const row of preview.results){
        const c=row.original;
        if(row.firstCents)parts.push({...c,id:uid('c'),amount:row.firstCents/100,rawAmount:row.firstCents/100,personId:preview.first,splitBatchId:batch,splitSourceId:c.id,splitMode:preview.mode});
        if(row.secondCents)parts.push({...c,id:uid('c'),amount:row.secondCents/100,rawAmount:row.secondCents/100,personId:preview.second,splitBatchId:batch,splitSourceId:c.id,splitMode:preview.mode});
      }
      const before=rows.reduce((n,x)=>n+splitMoneyToCents(x.amount),0),after=parts.reduce((n,x)=>n+splitMoneyToCents(x.amount),0);
      if(before!==after)throw Error('Toplam korunamadı.');
      state.charges=[...keep,...parts];
      return {changed:true,count:parts.length,total:before/100};
    },'Aylık borç iki kişiye paylaştırıldı',r=>unit(preview.unitId).label+' · '+person(preview.first).name+' / '+person(preview.second).name+' · '+trMoney(r.total));
    closeModal();render();openUnitCenter(preview.unitId);
    notify(r.count+' kişisel borç kaydı doğrulandı. Toplam tutar: '+trMoney(r.total));
  }catch(e){notify('Paylaştırma kaydedilemedi: '+e.message)}finally{if(button&&button.isConnected)button.disabled=false}
}


async function saveUnitManagerExemption(unitId){
  const u=unit(unitId),on=!!$('#unitManagerExempt')?.checked;
  if(!u||u.type!=='apartment')return;
  if(!confirm(on?u.label+' yöneticinin dairesi olarak kaydedilsin ve bundan sonraki dönemlerde normal aidattan muaf olsun mu?':'Bu dairenin gelecekteki aidat muafiyeti kaldırılsın mı?'))return;
  try{
    const result=await commitSpreadsheetChange(()=>{
      const current=unit(unitId);if(!current)throw Error('Daire bulunamadı.');
      state.settings.defaultManagerDuesExemptUnitId=on?unitId:null;
      state.units.forEach(x=>{x.managerDuesExemptDefault=!!on&&x.id===unitId});
      let draftUpdated=0;
      state.periods.filter(p=>p.status!=='locked'&&!p.legacyOnly).forEach(p=>{
        // Preserve any already calculated financial entries. Recalculation is explicitly required.
        const existing=state.charges.some(c=>c.periodId===p.id&&c.type==='dues');
        if(!existing){p.managerDuesExemptUnitId=on?unitId:null;draftUpdated++}
      });
      return {changed:true,draftUpdated};
    },'Yönetici dairesi varsayılan aidat muafiyeti',r=>u.label+' · '+(on?'Muaf':'Muafiyet kapalı')+' · '+r.draftUpdated+' hesaplanmamış taslak');
    closeModal();render();openUnitCenter(unitId);
    notify('Gelecek dönem muafiyet tercihi doğrulandı. '+result.draftUpdated+' henüz hesaplanmamış taslağa uygulandı. Hesaplanmış/kapalı dönemler değiştirilmedi.');
  }catch(e){notify('Yönetici muafiyeti kaydedilemedi: '+e.message)}
}

function personStatusFieldChanged(){

  if(primary){if(passive)primary.checked=false;primary.disabled=passive}

async function savePersonProfile(unitId,personId){
  const name=$('#peName')?.value.trim(),phone=$('#pePhone')?.value.trim()||'',
    emails=parseEmailLines($('#peEmails')?.value||''),role=$('#peRole')?.value,
    active=$('#peStatus')?.value==='active',
    start=$('#peStart')?.value||'',
    end=active?null:($('#peEnd')?.value||todayISO()),
    primary=active&&!!$('#pePrimary')?.checked,
    login=active&&!!$('#peLogin')?.checked,
    button=$('#personSaveBtn'),msg=$('#personSaveMsg');
  if(!name){if(msg)msg.textContent='Ad soyad boş olamaz.';return}
  if(start&&end&&end<start){if(msg)msg.textContent='Bitiş tarihi başlangıç tarihinden önce olamaz.';return}
  if(button)button.disabled=true;
  try{
    const result=await commitSpreadsheetChange(()=>{
      const p=person(personId),r=state.responsibilities.find(x=>x.unitId===unitId&&x.personId===personId);
      if(!p||!r)throw new Error('Kişi ilişkisi sunucu üzerinde bulunamadı.');
      const before=stableSnapshot({p,r});
      p.name=name;p.phone=phone;p.emails=emails;p.email=emails[0]||'';
      if(primary)state.responsibilities.filter(x=>x.unitId===unitId&&x.role===role&&x.id!==r.id).forEach(x=>x.primaryResponsible=false);
      r.role=role;r.active=active;r.startDate=start||null;r.endDate=end;
      r.primaryResponsible=primary;r.loginEnabled=login;
      if(!active)r.loginEnabled=false;
      return {changed:before!==stableSnapshot({p,r}),name,active};
    },'Kişi kartı güncellendi',r=>unit(unitId).label+' · '+r.name+' · '+(r.active?'Aktif':'Pasif'));
    closeModal();render();openUnitCenter(unitId);
    notify(result.changed?'Kişi değişiklikleri sunucuya kaydedilip doğrulandı.':'Değişiklik yok.');
  }catch(e){
    if(msg)msg.textContent='Kaydedilemedi: '+(e.message||e)+' · Yerel kopya korunur.';
    notify('Kişi güncellemesi doğrulanamadı: '+(e.message||e));
  }finally{if(button&&button.isConnected)button.disabled=false}
}

async function saveHouseholdPerson(unitId){
  const name=$('#hpName')?.value.trim(),role=$('#hpRole')?.value,start=$('#hpStart')?.value||todayISO(),
    phone=$('#hpPhone')?.value.trim()||'',emails=parseEmailLines($('#hpEmails')?.value||''),
    primary=!!$('#hpPrimary')?.checked,login=!!$('#hpLogin')?.checked,
    button=$('#hpSaveBtn'),msg=$('#hpSaveMsg');
  if(!name)return;
  const normalized=normTR(name).replace(/\s+/g,' ').trim();
  const existing=unitRelationships(unitId).find(x=>normTR(x.p.name).replace(/\s+/g,' ').trim()===normalized);
  if(existing){
    if(msg)msg.textContent='Bu isim bu dairede zaten kayıtlı. Yeni kayıt yerine mevcut kişiyi düzenleyin.';
    notify('Mükerrer kayıt engellendi. Kişiler / Hane bölümündeki mevcut kişiyi düzenleyin.');
    return;
  }
  if(button)button.disabled=true;
  try{
    const result=await commitSpreadsheetChange(()=>{
      const duplicate=unitRelationships(unitId).find(x=>normTR(x.p.name).replace(/\s+/g,' ').trim()===normalized);
      if(duplicate)throw new Error('Bu kişi daireye zaten bağlı. Mevcut kaydı düzenleyin.');
      const p={id:uid('person'),name,phone,emails,email:emails[0]||'',kind:role};
      state.people.push(p);
      if(primary)state.responsibilities.filter(r=>r.unitId===unitId&&r.role===role&&r.active).forEach(r=>r.primaryResponsible=false);
      state.responsibilities.push({id:uid('r'),unitId,personId:p.id,role,startDate:start,endDate:null,active:true,loginEnabled:login,primaryResponsible:primary,source:'manual_household'});
      return {changed:true,name,personId:p.id};
    },'Daireye kişi eklendi',r=>unit(unitId).label+' · '+r.name);
    closeModal();render();openUnitCenter(unitId);
    notify(result.name+' kaydı sunucuya kaydedildi ve doğrulandı.');
  }catch(e){
    if(msg)msg.textContent='Kişi kaydedilemedi: '+(e.message||e);
    notify('Kişi ekleme doğrulanamadı: '+(e.message||e));
  }finally{if(button&&button.isConnected)button.disabled=false}
}

function generatedTemporaryPassword(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ',b='abcdefghijkmnopqrstuvwxyz',n='23456789';
  const pick=x=>x[Math.floor(Math.random()*x.length)];
  return pick(a)+pick(b)+pick(b)+pick(n)+pick(n)+pick(a)+pick(b)+'!';
}
async function approveResidentApplication(id){
  const a=residentApprovalCache.find(x=>x.id===id);if(!a)return;
  if(!a.email){notify('E-posta adresi olmadan giriş hesabı açılamaz.');return}
  const code=applicationUnitCode(a.unit_id);if(code==='—'){notify('Daire eşleşmesi bulunamadı.');return}
  if(!confirm(`${a.full_name} · ${code} kaydı onaylansın ve giriş hesabı açılsın mı?`))return;
  const temp=generatedTemporaryPassword();
  try{
    const list=await authCall('admin_list',{},true);
    const existing=(list.accounts||[]).find(x=>
      String(x.username||'').toUpperCase()===code &&
      String(x.recovery_email||'').toLowerCase()===String(a.email||'').toLowerCase() &&
      x.account_role===a.relationship_type
    );
    if(existing){
      if(!existing.active)await authCall('admin_set_active',{account_id:existing.id,active:true},true);
      await authCall('admin_reset_password',{account_id:existing.id,password:temp},true);
    }else{
      await authCall('admin_create',{username:code,display_name:a.full_name,recovery_email:a.email,role:a.relationship_type,password:temp},true);
    }
    const {error}=await publicSb.rpc('manager_review_resident_application',{p_application_id:id,p_decision:'approved',p_manager_note:null});
    if(error)throw error;
    const u=state.units.find(x=>x.code===code);
    if(u){
      let p=state.people.find(x=>String(x.email||'').toLowerCase()===String(a.email).toLowerCase());
      if(!p){p={id:uid('person'),name:a.full_name,email:a.email,phone:a.phone,kind:a.relationship_type,source:'approved_application'};state.people.push(p)}
      else Object.assign(p,{name:a.full_name,email:a.email,phone:a.phone,kind:a.relationship_type});
      if(a.relationship_type==='tenant')state.responsibilities.filter(x=>x.unitId===u.id&&x.role==='tenant'&&x.active).forEach(x=>{x.active=false;x.loginEnabled=false;x.endDate=a.responsibility_start});
      const relExists=state.responsibilities.some(x=>x.unitId===u.id&&x.personId===p.id&&x.role===a.relationship_type&&x.active);
      if(!relExists)state.responsibilities.push({id:uid('r'),unitId:u.id,personId:p.id,role:a.relationship_type,startDate:a.responsibility_start,endDate:null,active:true,loginEnabled:true,source:'approved_application'});

function spreadsheetAmount(value){
  if(typeof value==='number')return Number.isFinite(value)?value:null;
  let text=String(value??'').trim().replace(/\b(?:TRY|TL)\b|₺|\s/gi,'').replace('−','-');
  if(!text)return null;
  if(/^\(.+\)$/.test(text))text='-'+text.slice(1,-1);
  if(/^[+-]?\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(text))text=text.replace(/\./g,'').replace(',','.');
  else if(/^[+-]?\d{1,3}(?:,\d{3})+\.\d+$/.test(text))text=text.replace(/,/g,'');
  else text=text.replace(',','.');
  return /^[+-]?\d+(?:\.\d+)?$/.test(text)&&Number.isFinite(Number(text))?Number(text):null;
}
function spreadsheetDateKey(value, separateTime){
  if(value instanceof Date||typeof value==='number'){
    if(typeof value==='number'){
      const d=window.XLSX?.SSF?.parse_date_code(value);
      if(!d)return '';
      const pad=n=>String(n).padStart(2,'0');
      return spreadsheetDateKey(d.y+'-'+pad(d.m)+'-'+pad(d.d),separateTime||[d.H,d.M,d.S].map(pad).join(':'));
    }
    return Number.isFinite(value.getTime())?spreadsheetDateKey(value.toISOString().slice(0,10),separateTime||value.toISOString().slice(11,19)):'';
  }
  const text=String(value??'').trim();
  const iso=text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?=$|[T\s-])/);
  const tr=text.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})(?=$|[T\s-])/);
  const digits=iso?iso.slice(1):tr?[tr[3],tr[2],tr[1]]:null;
  if(!digits)return '';
  const date=digits.map((part,index)=>part.padStart(index===0?4:2,'0')).join('-');
  if(!Number.isFinite(Date.parse(date))||new Date(date).toISOString().slice(0,10)!==date)return '';
  const timeText=typeof separateTime==='number'
    ? new Date(Math.round((separateTime%1)*86400)*1000).toISOString().slice(11,19)
    : String(separateTime??'')+' '+text;
  const time=timeText.match(/(?:^|[T\s-])(\d{1,2}):([0-5]\d)(?::([0-5]\d))?/);
  return date+(time&&Number(time[1])<24?'T'+time[1].padStart(2,'0')+':'+time[2]+':'+(time[3]||'00'):'');
}
function bankAmountColumn(headers){
  const choices=['ISLEM SONRASI BAKIYE','ISLEM SONU BAKIYE','HESAP BAKIYESI','BAKIYE','KALAN BAKIYE'];
  const keys=headers.map(h=>normTR(h).trim().replace(/\s*\(?\s*(?:TL|TRY|₺)\s*\)?$/,''));
  const column=choices.map(name=>keys.indexOf(name)).find(index=>index>=0);
  return column??-1;
}
function latestBankBalance(rows){
  const withBalance=rows.filter(row=>row.balance!==null);
  if(!withBalance.length)return null;
  const latestKey=withBalance.map(row=>row.key).sort().at(-1);
  const latest=withBalance.filter(row=>row.key===latestKey);
  if(latest.every(row=>row.balance===latest[0].balance))return latest[0];
  const order=new Set(rows.slice(1).map((row,index)=>row.key.localeCompare(rows[index].key)).filter(Boolean).map(Math.sign));
  const chronological=order.size===1?order.has(1):null;
  const fits=(before,after)=>after.amount!==null&&Math.abs(before.balance+after.amount-after.balance)<0.005;
  const forward=latest.slice(1).every((row,index)=>fits(latest[index],row));
  const backward=latest.slice(1).every((row,index)=>fits(row,latest[index]));
  if(forward!==backward)return forward?latest.at(-1):latest[0];
  if(chronological!==null)return chronological?latest.at(-1):latest[0];
  throw new Error('Aynı tarih ve saatte birden fazla bakiye var. İşlem sırası belirlenemedi.');
}

function unitIdFromNumber(n){n=Number(n);return n>=1&&n<=33?`apt${n}`:null}
function matchWords(v){return ' '+normTR(v).replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim()+' ';}
function extractSuggestedUnits(desc){
  const t=matchWords(desc),found=new Set();
  const pats=[/\bDAIRE\s*(?:NO\s*)?0?([1-9]|[12]\d|3[0-3])\b/g,/\bD\s*0?([1-9]|[12]\d|3[0-3])\b/g,/\b([1-9]|[12]\d|3[0-3])\s*NOLU\s*DAIRE\b/g];
  pats.forEach(re=>{let m;while((m=re.exec(t)))found.add(Number(m[1]))});
  return [...found].map(unitIdFromNumber).filter(Boolean);
}
function personSuggestedUnitsFromState(st,desc,unitId=null,date=''){
  const text=matchWords(desc),hits=[],candidate=[];
  const all=(st.responsibilities||[]).filter(r=>r.active&&(!unitId||r.unitId===unitId)
    &&(!date||(!r.startDate||r.startDate<=date)&&(!r.endDate||date<=r.endDate)));
  const uniq=new Set();
  for(const r of all){
    const p=(st.people||[]).find(x=>x.id===r.personId);if(!p)continue;
    const words=normTR(p.name||'').replace(/[^A-Z0-9]+/g,' ').trim().split(/\s+/).filter(x=>x.length>=4);
    const full=words.join(' ');
    if(!words.length)continue;
    const fullHit=full.length>=6&&text.includes(' '+full+' ');
    const matched=words.filter(w=>text.includes(' '+w+' '));
    if(!fullHit&&!matched.length)continue;
    const key=r.unitId+'|'+p.id;if(uniq.has(key))continue;uniq.add(key);
    candidate.push({unitId:r.unitId,personId:p.id,name:p.name,full:fullHit,matched:matched.length,words:words.length});
  }
  // Prefer full-name matches. A single given or family name can be enough only
  // when it uniquely identifies one currently responsible person.
  const full=candidate.filter(x=>x.full),pool=full.length?full:candidate;
  if(pool.length===1)return [{...pool[0],matchKind:pool[0].full?'full':'unique_name'}];
  return pool.map(h=>({...h,matchKind:'ambiguous'}));
}
function personSuggestedUnits(desc,date=''){

function personSuggestedUnit(desc,date=''){const hits=personSuggestedUnits(desc,date);return hits.length===1?hits[0].unitId:null}
function bankMatchFor(desc,date=''){
  const explicit=extractSuggestedUnits(desc),people=personSuggestedUnits(desc,date);
  const personUnits=[...new Set(people.map(x=>x.unitId))];
  if(explicit.length===1){
    const conflicting=personUnits.some(id=>id!==explicit[0]);
    return {suggested:conflicting?[]:explicit,confidence:conflicting?'low':'high',reason:conflicting?'Daire numarası ve kişi ismi çelişiyor; yönetici kontrolü gerekli.':'Daire numarası açıkça belirtildi.',personId:people.length===1&&people[0].unitId===explicit[0]?people[0].personId:null};
  }
  if(explicit.length>1)return {suggested:explicit,confidence:'low',reason:'Birden fazla daire numarası var; kontrol gerekli.',personId:null};
  if(people.length===1)return {suggested:[people[0].unitId],confidence:'high',reason:(people[0].full?'Tam ad':'Tekil ad/soyad')+' eşleşmesi: '+people[0].name+'.',personId:people[0].personId};
  if(people.length>1)return {suggested:personUnits,confidence:'low',reason:'Birden fazla aktif kişi eşleşiyor; kontrol gerekli.',personId:null};
  return {suggested:[],confidence:'none',reason:'Kişi veya daire anahtar kelimesi bulunamadı.',personId:null};
}
function effectiveBankMatch(tx){
