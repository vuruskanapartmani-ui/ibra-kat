function localUnitIdForCode(code){
  const c=String(code||'').toUpperCase();
  if(/^D\d{2}$/.test(c)) return 'apt'+Number(c.slice(1));
  if(c==='S01') return 'shop1';
  if(c==='S02') return 'shop2';
  return null;
}
async function authToken(){
  if(!authSession?.access_token)return '';
  const exp=Number(authSession.expires_at||0);
  if(exp && exp*1000>Date.now()+60000)return authSession.access_token;
  try{
    const {data,error}=await publicSb.auth.setSession({access_token:authSession.access_token,refresh_token:authSession.refresh_token});
    if(!error&&data?.session){
      authSession={access_token:data.session.access_token,refresh_token:data.session.refresh_token,expires_at:data.session.expires_at};
      localStorage.setItem(AUTH_SESSION_KEY,JSON.stringify(authSession));
      return authSession.access_token;
    }
  }catch(e){}
  return authSession.access_token;
}
async function authCall(action,body={},withAuth=false){
  const headers={'Content-Type':'application/json','apikey':CONFIG.supabaseAnonKey};
  if(withAuth){const t=await authToken();if(t)headers.Authorization='Bearer '+t}
  const res=await fetch(CONFIG.supabaseUrl+'/functions/v1/ibra-auth',{method:'POST',headers,body:JSON.stringify({action,...body})});
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(data.error||'İşlem başarısız');
  return data;
}

  });
}

function suggestExpenseCategory(desc=''){

  if(t.includes('KOMISYON')||t.includes('BSMV')||t.includes('EFT UCRETI')||t.includes('HAVALE UCRETI')) return 'Banka Komisyonları';
  if(t.includes('IZSU')) return 'İZSU';
  if(t.includes('GEDIZ')) return 'Gediz';
  if(t.includes('IZMIRGAZ')||t.includes('DOGALGAZ')) return 'İzmirgaz';
  if(t.includes('ASANSOR')&&/(TAMIR|PARCA|ARIZA)/.test(t)) return 'Asansör Tamiri';

  if(t.includes('ELEKTRIK')) return 'Elektrik';
  return 'Diğer';
}

function residentPersonId(name){return 'person_'+normTR(name).replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase()}
function personSuggestedUnitsFromState(st,desc,unitId=null){
  const t=normTR(desc),hits=[];
  for(const r of (st.responsibilities||[])){
    if(!r.active || (unitId&&r.unitId!==unitId))continue;
    const p=(st.people||[]).find(x=>x.id===r.personId); if(!p)continue;
    const n=normTR(p.name||''); if(n&&n.length>=4&&t.includes(n))hits.push({unitId:r.unitId,personId:p.id,name:p.name});
  }
  const seen=new Set();return hits.filter(h=>{const k=h.unitId+'|'+h.personId;if(seen.has(k))return false;seen.add(k);return true});
}
function seedPeopleAndResponsibilities(units){
  const people=[]; const responsibilities=[]; const pmap=new Map();
  RESIDENT_HISTORY.forEach((x,i)=>{
    const u=units.find(z=>z.code===x.code); if(!u)return;
    const key=normTR(x.name); let p=pmap.get(key);
    if(!p){p={id:residentPersonId(x.name),name:x.name,email:'',phone:'',kind:x.role};pmap.set(key,p);people.push(p)}
    responsibilities.push({id:`r_hist_${x.code}_${i}`,unitId:u.id,personId:p.id,role:x.role,startDate:null,endDate:x.active?null:null,active:!!x.active,loginEnabled:!!x.active,source:'resident_history'});
  });
  return {people,responsibilities};
}
function mergeResidentHistory(s){
  // Remove only old demo placeholders; preserve real edits and financial records.
  const demoIds=new Set((s.people||[]).filter(p=>/^Malik (DAİRE|D1|D2)/.test(p.name||'')||['Ayşe Demir','Mehmet Kaya'].includes(p.name)).map(p=>p.id));
  s.people=(s.people||[]).filter(p=>!demoIds.has(p.id));
  s.responsibilities=(s.responsibilities||[]).filter(r=>!demoIds.has(r.personId));
  const byName=new Map(s.people.map(p=>[normTR(p.name),p]));
  RESIDENT_HISTORY.forEach((x,i)=>{
    const u=(s.units||[]).find(z=>z.code===x.code); if(!u)return;
    let p=byName.get(normTR(x.name));
    if(!p){p={id:residentPersonId(x.name),name:x.name,email:'',phone:'',kind:x.role};s.people.push(p);byName.set(normTR(x.name),p)}
    const existing=(s.responsibilities||[]).find(r=>r.unitId===u.id&&r.personId===p.id&&r.role===x.role);
    if(existing){ if(existing.source==='resident_history'||existing.startDate==null){existing.active=!!x.active;existing.loginEnabled=!!x.active;existing.source='resident_history'} }
    else s.responsibilities.push({id:`r_hist_${x.code}_${i}`,unitId:u.id,personId:p.id,role:x.role,startDate:null,endDate:null,active:!!x.active,loginEnabled:!!x.active,source:'resident_history'});
  });
  return s;
}

  s.responsibilities.forEach(r=>{ if(r.loginEnabled==null) r.loginEnabled=!!r.active; if(r.primaryResponsible==null) r.primaryResponsible=false; });
  s.people.forEach(p=>{ p.emails=Array.isArray(p.emails)?p.emails.filter(Boolean):[]; if(p.email&&!p.emails.includes(p.email))p.emails.unshift(p.email); p.emails=[...new Set(p.emails.map(x=>String(x).trim()).filter(Boolean))]; p.email=p.emails[0]||p.email||''; });
  s.units.forEach(u=>{ u.notificationEmails=Array.isArray(u.notificationEmails)?[...new Set(u.notificationEmails.map(x=>String(x).trim()).filter(Boolean))]:[]; });
  mergeResidentHistory(s);
  // Bankadan gelen eski ödeme kayıtlarında kişi bağlantısı eksik/yanlışsa, güncel aktif kişi eşleşmesiyle onar.
  (s.payments||[]).forEach(pay=>{
    if(!pay.bankTransactionId||!pay.unitId)return;
    const tx=(s.bankTransactions||[]).find(t=>t.id===pay.bankTransactionId); if(!tx)return;
    const hits=personSuggestedUnitsFromState(s,tx.description||'',pay.unitId);
    if(hits.length===1) pay.personId=hits[0].personId;
  });
  return s;
}

function activeRelations(unitId,role,date=todayISO()){return state.responsibilities.filter(r=>r.unitId===unitId&&(!role||r.role===role)&&relationActiveOn(r,date)).sort((a,b)=>(Number(b.primaryResponsible)-Number(a.primaryResponsible))||String(a.startDate||'').localeCompare(String(b.startDate||'')))}

function allRecipientEmailsForUnit(unitId,date=todayISO()){const u=unit(unitId), rels=activePeopleForUnit(unitId,date);return [...new Set([...unitNotificationEmails(u),...rels.flatMap(x=>personEmails(x.p))])]}

function activeTenant(unitId,date=todayISO()){

function ownerRelations(unitId){return state.responsibilities.filter(r=>r.unitId===unitId&&r.role==='owner').map(r=>({r,p:person(r.personId)})).filter(x=>x.p)}
function ownerRelationAt(unitId,date=todayISO()){
  const rels=ownerRelations(unitId); const dated=rels.filter(x=>(!x.r.startDate||x.r.startDate<=date)&&(!x.r.endDate||x.r.endDate>=date));

}
function ownerOf(unitId,date=todayISO()){const x=ownerRelationAt(unitId,date);return x?x.p:null}

function activateOwnerResponsibility(unitId,startDate,preferredPersonId=''){
  const owners=ownerRelations(unitId); if(!owners.length) return null;

  if(!x) x=owners.find(o=>o.r.active)||owners[owners.length-1]||owners[0];
  owners.forEach(o=>{ if(o!==x&&o.r.active){o.r.active=false;o.r.endDate=startDate;} });

function leaveStatusLabel(s){return ({pending:'Bekliyor',approved:'Onaylandı',rejected:'Reddedildi',revision_requested:'Düzeltme İstendi',cancel_requested:'İptal Talebi',change_requested:'Tarih Değişikliği',early_return_requested:'Erken Dönüş',cancelled:'İptal Edildi'})[s]||s}
function leaveWorkDays(start,end,type){
  if(type==='half_day')return 0.5;
  const configured=state.settings?.caretakerWorkDays||[1,2,3,4,5];
  const a=new Date(start+'T00:00:00'),b=new Date(end+'T00:00:00');let n=0;
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(configured.includes(d.getDay()))n++}
  return n;
}

async function submitLeaveRequest(){
  const type=$('#lvType').value,start=$('#lvStart').value,end=$('#lvEnd').value;
  if(!start||!end){notify('Başlangıç ve bitiş tarihini gir.');return}
  let attachment_path=null,attachment_name=null;
  const file=$('#lvFile')?.files?.[0];
  try{
    if(file){
      const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
      const path=(session.cloudUserId||'')+'/'+Date.now()+'_'+safe;
      const {data:{user}}=await publicSb.auth.getUser();
      const userId=user?.id||'';
      const finalPath=userId+'/'+Date.now()+'_'+safe;
      const {error:upErr}=await publicSb.storage.from('leave-documents').upload(finalPath,file,{upsert:false,contentType:file.type||undefined});
      if(upErr)throw upErr;attachment_path=finalPath;attachment_name=file.name;
    }
    await authCall('leave_create',{building_id:CONFIG.buildingId,leave_type:type,start_date:start,end_date:end,start_time:$('#lvStartTime').value||null,end_time:$('#lvEndTime').value||null,requested_days:leaveWorkDays(start,end,type),explanation:$('#lvExplanation').value||null,attachment_path,attachment_name},true);
    closeModal();notify('İzin talebin yönetici onayına gönderildi.');route='myLeaves';render();
  }catch(e){notify(e.message||'İzin talebi gönderilemedi.')}
}

function pendingBankReviewCount(){
  return (state.bankTransactions||[]).filter(tx=>{
    const amount=Number(tx.amount||0);
    if(amount>0) return txAllocated(tx.id)+0.005<amount;
    return amount<0 && !tx.expenseId;
  }).length;
}
function unitOpenBalance(unitId){
  const ch=(state.charges||[]).filter(c=>c.unitId===unitId).reduce((a,c)=>a+Number(c.amount||0),0);
  const pay=(state.payments||[]).filter(x=>x.unitId===unitId).reduce((a,x)=>a+Number(x.amount||0),0);
  return ch-pay;
}
function overdueUnits(){
  const today=new Date(todayISO()+'T00:00:00');
  return state.units.map(u=>{
    const dueCharges=(state.charges||[]).filter(c=>c.unitId===u.id && c.dueDate && Number(c.amount||0)>0);
    if(!dueCharges.length)return null;
    const oldest=dueCharges.map(c=>c.dueDate).sort()[0];
    const d=new Date(oldest+'T00:00:00');
    const days=Math.floor((today-d)/86400000);
    const balance=unitOpenBalance(u.id);
    return days>0 && balance>0.01?{u,days,balance,dueDate:oldest}:null;
  }).filter(Boolean);
}
function reminderStage(days){
  if(days>=7)return 7;if(days>=3)return 3;if(days>=1)return 1;return 0;
}
function openOverdueReminderManager(){
  const rows=overdueUnits().sort((a,b)=>b.days-a.days);
  openModal(`<h2>Geciken Ödeme Hatırlatmaları</h2><div class="notice"><b>Plan:</b> Son ödeme tarihinden 1 gün sonra, 3. gün ve 7. gün e-posta hatırlatması. Metinde gecikme faizinin uygulanacağı belirtilir. Gerçek otomatik gönderim için kullanıcı e-postaları ve canlı Gmail/Supabase bağlantısı tamamlanmalıdır.</div><div class="list" style="margin-top:10px">${rows.map(r=>`<div class="listitem"><div class="sectionHead"><div><b>${r.u.label}</b><div class="small muted">${r.days} gün gecikme · Son ödeme ${r.dueDate}</div></div><b class="danger">${trMoney(r.balance)}</b></div><div class="small">Sıradaki/aşamadaki bildirim: <b>${reminderStage(r.days)}. gün kuralı</b></div></div>`).join('')||'<div class="notice ok">Gecikmiş açık bakiye bulunmuyor.</div>'}</div>`);
}

function applyManagerDuesExemption(periodId,previousUnitId=null){
  const p=state.periods.find(x=>x.id===periodId);if(!p)return;

  });

function createAssessment(){

    const responsible=scope==='owners'?ownerOf(u.id):scope==='occupants'?occupantOf(u.id,p.month+'-15'):occupantOf(u.id,p.month+'-15');

function periodIdForDate(date){const ym=String(date||'').slice(0,7);return state.periods.find(p=>p.month===ym)?.id||activePeriodId}

function extractSuggestedUnits(desc){

  const u=$('#payUnit').value,pid=$('#payPerson').value||null,amount=Number($('#payAmount').value),date=$('#payDate').value,bankId=$('#payBank').value,bp=BANK_PROFILES[bankId],target=$('#payCharge').value,desc=$('#payDesc').value||'Manuel tahsilat';
  if(!amount||amount<=0){notify('Geçerli bir tutar gir.');return}
  let remain=amount;
  if(target&&target!=='general'){
    const c=state.charges.find(x=>x.id===target);if(c){const a=Math.min(remain,Math.max(0,Number(c.amount||0)-chargePaidAmount(c.id)));state.payments.push({id:uid('pay'),periodId:c.periodId,unitId:u,personId:pid||c.personId,amount:a,date,description:desc,bankId,bankName:bp?.name||'Nakit / Diğer',bankAccount:bp?.short||'',chargeId:c.id,manualEntry:true});remain-=a}
  }else if(target!=='general'){
    const opens=openChargesForUnit(u).filter(c=>!pid||c.personId===pid);for(const c of opens){if(remain<=0.005)break;const a=Math.min(remain,c.remaining);state.payments.push({id:uid('pay'),periodId:c.periodId,unitId:u,personId:pid||c.personId,amount:a,date,description:desc,bankId,bankName:bp?.name||'Nakit / Diğer',bankAccount:bp?.short||'',chargeId:c.id,manualEntry:true});remain-=a}
  }
  if(remain>0.005)state.payments.push({id:uid('pay'),periodId:periodIdForDate(date)||activePeriodId,unitId:u,personId:pid,amount:remain,date,description:desc,bankId,bankName:bp?.name||'Nakit / Diğer',bankAccount:bp?.short||'',chargeId:null,manualEntry:true});
  saveState();syncLateFees(true);logAudit('Manuel tahsilat girildi',`${unit(u).label} · ${person(pid)?.name||'Kişi seçilmedi'} · ${trMoney(amount)}`);closeModal();render();notify('Ödeme cari hesaba işlendi.');
}
function chargePaidAmount(chargeId,excludeTxId=null){return state.payments.filter(p=>p.chargeId===chargeId&&(!excludeTxId||p.bankTransactionId!==excludeTxId)).reduce((a,p)=>a+Number(p.amount||0),0)}
function openChargesForUnit(unitId,excludeTxId=null){return state.charges.filter(c=>c.unitId===unitId).map(c=>({...c,remaining:Math.max(0,Number(c.amount||0)-chargePaidAmount(c.id,excludeTxId))})).filter(c=>c.remaining>0.005).sort((a,b)=>((a.dueDate||period(a.periodId)?.month||'').localeCompare(b.dueDate||period(b.periodId)?.month||'')))}
let allocSeq=0,allocTxId=null;
function openBankAllocation(txId){
  const tx=state.bankTransactions.find(x=>x.id===txId);if(!tx)return;allocTxId=txId;allocSeq=0;const existing=state.payments.filter(p=>p.bankTransactionId===txId);const bp=bankProfile(tx.bankId),suggest=tx.suggestedUnitIds?.[0]||'';
  openModal(`<h2>Ödeme Dağıtımı</h2><div class="notice"><b>${esc(bp.name)} · ${tx.date} · ${trMoney(tx.amount)}</b><br>${esc(tx.description)}</div><div id="allocRows" class="stack" style="margin-top:10px"></div><div class="actions" style="margin-top:10px"><button onclick="addAllocationRow('${suggest}')">+ Dağıtım Satırı</button><button class="primary" onclick="saveBankAllocation()">Dağılımı Kaydet</button></div><div id="allocTotal" class="notice" style="margin-top:10px"></div>`);
  if(existing.length)existing.forEach(p=>addAllocationRow(p.unitId,p.chargeId||'',p.amount)); else addAllocationRow(suggest,'','');updateAllocationTotal();
}
function addAllocationRow(unitId='',chargeId='',amount=''){const id=`al_${++allocSeq}`,wrap=$('#allocRows'),opts=state.units.map(u=>`<option value="${u.id}" ${u.id===unitId?'selected':''}>${u.label} · ${esc(CURRENT_DIRECTORY[u.code]||'')}</option>`).join('');wrap.insertAdjacentHTML('beforeend',`<div class="card" id="${id}"><div class="grid3"><label>Daire / Dükkan<select class="alUnit" onchange="refreshAllocationCharges('${id}')">${opts}</select></label><label>Borç kalemi<select class="alCharge"></select></label><label>Tutar<input class="alAmount" type="number" step="0.01" value="${amount||''}" oninput="updateAllocationTotal()"></label></div><button class="dangerBtn" style="margin-top:8px" onclick="document.getElementById('${id}').remove();updateAllocationTotal()">Satırı Sil</button></div>`);refreshAllocationCharges(id,chargeId)}
function refreshAllocationCharges(rowId,selected=''){const box=document.getElementById(rowId),u=box.querySelector('.alUnit').value,sel=box.querySelector('.alCharge'),open=openChargesForUnit(u,allocTxId);sel.innerHTML=`<option value="">Genel ödeme / avans</option>`+open.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${isoMonthLabel(period(c.periodId)?.month||activePeriodId)} · ${esc(c.label||c.type)} · kalan ${trMoney(c.remaining)}</option>`).join('')}
function updateAllocationTotal(){const tx=state.bankTransactions.find(x=>x.id===allocTxId),sum=$$('#allocRows .alAmount').reduce((a,i)=>a+Number(i.value||0),0),el=$('#allocTotal');if(el&&tx)el.innerHTML=`Dağıtılan <b>${trMoney(sum)}</b> · Banka hareketi <b>${trMoney(tx.amount)}</b> · Kalan <b>${trMoney(Math.max(0,Number(tx.amount)-sum))}</b>`}
function saveBankAllocation(){const tx=state.bankTransactions.find(x=>x.id===allocTxId);if(!tx)return;const rows=$$('#allocRows .card').map(box=>({unitId:box.querySelector('.alUnit').value,chargeId:box.querySelector('.alCharge').value,amount:Number(box.querySelector('.alAmount').value||0)})).filter(x=>x.amount>0);const sum=rows.reduce((a,x)=>a+x.amount,0);if(sum-Number(tx.amount)>0.005){notify('Dağıtım toplamı banka hareketinden büyük olamaz.');return}state.payments=state.payments.filter(p=>p.bankTransactionId!==tx.id);const bp=bankProfile(tx.bankId);rows.forEach(r=>{const c=state.charges.find(x=>x.id===r.chargeId),pid=c?.personId||matchedPersonForTx(tx)||occupantOf(r.unitId,tx.date)?.id||ownerOf(r.unitId)?.id;state.payments.push({id:uid('pay'),periodId:c?.periodId||tx.periodId||activePeriodId,unitId:r.unitId,personId:pid,amount:r.amount,date:tx.date,description:`${bp.name} banka ödemesi · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:r.chargeId||null,reference:tx.reference})});tx.allocatedAmount=sum;saveState();logAudit('Banka ödemesi dağıtıldı',`${bp.name} · ${trMoney(sum)}`);closeModal();render();notify('Banka ödemesi dağıtıldı.')}
function autoAllocateBankTransaction(txId){const tx=state.bankTransactions.find(x=>x.id===txId),u=tx?.suggestedUnitIds?.length===1?tx.suggestedUnitIds[0]:null;if(!tx||!u||Number(tx.amount)<=0){notify('Tek bir daire önerisi yok.');return}state.payments=state.payments.filter(p=>p.bankTransactionId!==tx.id);let remain=Number(tx.amount),bp=bankProfile(tx.bankId),opens=openChargesForUnit(u,tx.id);for(const c of opens){if(remain<=0.005)break;const a=Math.min(remain,c.remaining);state.payments.push({id:uid('pay'),periodId:c.periodId,unitId:u,personId:c.personId||matchedPersonForTx(tx)||occupantOf(u,tx.date)?.id||ownerOf(u)?.id,amount:a,date:tx.date,description:`${bp.name} otomatik eşleşme · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:c.id,reference:tx.reference});remain-=a}if(remain>0.005)state.payments.push({id:uid('pay'),periodId:tx.periodId||activePeriodId,unitId:u,personId:matchedPersonForTx(tx)||occupantOf(u,tx.date)?.id||ownerOf(u)?.id,amount:remain,date:tx.date,description:`${bp.name} genel ödeme / avans · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:null,reference:tx.reference});tx.allocatedAmount=Number(tx.amount);saveState();logAudit('Banka ödemesi otomatik eşleşti',`${unit(u).label} · ${trMoney(tx.amount)}`);render();notify(`${unit(u).label} için ödeme işlendi.`)}

function emailPersonLedger(unitId,personId){
  const u=unit(unitId),pp=person(personId);
  if(!pp){notify('Kişi kaydı bulunamadı.');return}
  const ppEmails=personEmails(pp); if(!ppEmails.length){notify('Bu kişinin kayıtlı e-posta adresi yok.');return}
  const charges=state.charges.filter(c=>c.unitId===unitId&&c.personId===personId);
  const pays=state.payments.filter(x=>x.unitId===unitId&&x.personId===personId);
  const total=charges.reduce((a,c)=>a+Number(c.amount||0),0);
  const paid=pays.reduce((a,x)=>a+Number(x.amount||0),0);
  const balance=total-paid;
  const rows=[
    ...charges.map(c=>({date:(period(c.periodId)?.month||'')+'-01',kind:'Tahakkuk',desc:c.label||c.type||'Tahakkuk',amount:Number(c.amount||0)})),
    ...pays.map(x=>({date:x.date||((period(x.periodId)?.month||'')+'-01'),kind:'Ödeme',desc:`${x.bankName?x.bankName+' · ':''}${x.description||'Tahsilat'}`,amount:-Number(x.amount||0)}))
  ].sort((a,b)=>a.date.localeCompare(b.date));
  const details=rows.length?rows.map(r=>`${r.date||'—'} | ${r.kind} | ${r.desc} | ${r.amount<0?'-':''}${trMoney(Math.abs(r.amount))}`).join('\n'):'Henüz hesap hareketi bulunmuyor.';
  const subject=`${u.label} - ${pp.name} Cari Hesap Özeti`;
  const body=`Sayın ${pp.name},\n\n${u.label} için adınıza kayıtlı tüm hesap hareketleri aşağıdadır.\n\nTOPLAM TAHAKKUK: ${trMoney(total)}\nTOPLAM ÖDEME: ${trMoney(paid)}\nGÜNCEL BAKİYE: ${trMoney(balance)}\n\nHESAP HAREKETLERİ\n${details}\n\nBu döküm sistemde adınıza kayıtlı tüm tahakkuk ve ödemeleri içerir.\n\nIBRA KAT`;
  window.location.href=`mailto:${encodeURIComponent(ppEmails.join(','))}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  state.notifications.push({id:uid('n'),periodId:null,unitId,personId,channel:'email',to:ppEmails.join(','),at:new Date().toISOString(),status:'manual-opened',type:'full-person-ledger'});saveState();
}

function nextISODate(date){const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function lateFeeOverrideFor(c){
  return (state.settings.lateFeeOverrides||[]).find(x=>x.unitId===c.unitId && (x.periodId==='all'||x.periodId===c.periodId));
}
function lateFeeForBaseCharge(c,asOf=todayISO()){
  if(c.type==='late_fee'||!c.dueDate||asOf<=c.dueDate)return 0;
  const ov=lateFeeOverrideFor(c); if(ov?.waivePeriod)return 0;
  const p=state.periods.find(x=>x.id===c.periodId),enabled=p?.lateFeeEnabled??state.settings.lateFeeEnabled,rate=Number((p?.lateFeeRate??state.settings.lateFeeRate)||0),mode=p?.lateFeeMode||state.settings.lateFeeMode||'daily';if(!enabled||rate<=0)return 0;
  const pays=state.payments.filter(x=>x.chargeId===c.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const resetAt=ov?.resetAt||'';
  let remaining=Number(c.amount||0),fee=0;
  // Sıfırlama tarihine kadar yapılan ödemeler önce anaparadan düşer; geçmiş faiz affedilmiş sayılır.
  for(const pay of pays.filter(x=>resetAt && (x.date||'')<=resetAt)){remaining-=Math.min(remaining,Number(pay.amount||0)); if(remaining<=0)return 0;}
  const startDate=(resetAt && resetAt>c.dueDate)?resetAt:c.dueDate;
  const start=new Date(startDate+'T00:00:00');
  const calc=(amt,end)=>{if(!end||end<=startDate||amt<=0)return 0;const days=Math.max(0,Math.round((new Date(end+'T00:00:00')-start)/86400000));if(days<=0)return 0;return mode==='monthly'?amt*(rate/100)*Math.ceil(days/30):amt*(rate/100)*(days/30)};
  for(const pay of pays.filter(x=>!resetAt || (x.date||'')>resetAt)){const a=Math.min(remaining,Number(pay.amount||0));fee+=calc(a,pay.date||asOf);remaining-=a;if(remaining<=0)break}
  if(remaining>0)fee+=calc(remaining,asOf);return roundTL(fee)
}
function syncLateFees(silent=false){

function parseTRNumber(v){
  if(v==null)return null;let x=String(v).replace(/\s/g,'').replace(/TL|₺/gi,'').replace(/[^0-9,.-]/g,'');
  if(!x)return null;
  if(x.includes(',')&&x.includes('.')) x=x.replace(/\./g,'').replace(',','.');
  else if(x.includes(',')) x=x.replace(',','.');
  const n=Number(x);return Number.isFinite(n)?n:null;
}
function ocrFindNumber(lines,labels){
  for(const line of lines){const up=normTR(line);if(labels.some(l=>up.includes(l))){const nums=line.match(/\d{1,3}(?:\.\d{3})*(?:,\d+)?|\d+(?:[.,]\d+)?/g)||[];if(nums.length){const n=parseTRNumber(nums[nums.length-1]);if(n!=null)return n}}}return null;
}
function parseInvoiceOcr(text,type){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const out={};
  out.amount=ocrFindNumber(lines,['ODENECEK TUTAR','TOPLAM TUTAR','FATURA TUTARI','ODENECEK TOPLAM','TOPLAM BORC']);
  if(type==='water'){
    out.invoiceConsumption=ocrFindNumber(lines,['TUKETIM M3','TUKETIM (M3)','SU TUKETIMI','FATURA TUKETIMI','TOPLAM TUKETIM']);
    out.wasteCollection=ocrFindNumber(lines,['KATI ATIK TOPLAMA','EVSEL KATI ATIK TOPLAMA']);
    out.wasteDisposal=ocrFindNumber(lines,['KATI ATIK BERTARAF','EVSEL KATI ATIK BERTARAF']);
  }
  if(type==='gas'){
    out.invoiceConsumption=ocrFindNumber(lines,['HAM TUKETIM','TUKETIM M3','TUKETIM']);
    out.correctedConsumption=ocrFindNumber(lines,['DUZELTILMIS TUKETIM','DUZELTILMIS HACIM']);
  }
  return out;
}
async function runInvoiceOcr(file){
  const st=$('#ocrStatus');
  if(!window.Tesseract){st.className='notice bad';st.textContent='OCR modülü yüklenemedi. Alanları elle doldurabilirsiniz.';return;}
  st.className='notice';st.innerHTML='<b>Fotoğraf okunuyor…</b> %0';
  try{
    const result=await Tesseract.recognize(file,'tur+eng',{logger:m=>{if(m.status==='recognizing text'&&st)st.innerHTML=`<b>Fotoğraf okunuyor…</b> %${Math.round((m.progress||0)*100)}`}});
    lastInvoiceOcrText=result?.data?.text||'';
    const raw=$('#ocrRaw');if(raw)raw.textContent=lastInvoiceOcrText;
    const parsed=parseInvoiceOcr(lastInvoiceOcrText,$('#invType').value);
    let filled=[];
    const set=(id,val,label)=>{if(val!=null&&Number.isFinite(val)){const e=$(id);if(e){e.value=val;filled.push(label);e.style.background='#fff8db';e.style.borderColor='#d89b00'}}};
    set('#invAmount',parsed.amount,'ödenecek toplam');
    if($('#invType').value==='water'){set('#invConsumption',parsed.invoiceConsumption,'tüketim');set('#invWasteCollection',parsed.wasteCollection,'katı atık toplama');set('#invWasteDisposal',parsed.wasteDisposal,'katı atık bertaraf')}

async function uploadStaffDocument(file,folder,recordId,month){
  if(!file||!publicSb||!authSession)return null;
  try{
    const safe=String(file.name||'belge').replace(/[^a-zA-Z0-9._-]+/g,'_');
    const path=`${month}/${folder}/${recordId}_${safe}`;
    const {error}=await publicSb.storage.from('ibra-kat-documents').upload(path,file,{upsert:true,contentType:file.type||undefined});
    if(error)throw error;
    return {path,mimeType:file.type||null};
  }catch(e){console.warn('Belge yüklenemedi',e);return {error:String(e?.message||e)}}
}
async function saveInvoice(approve){
  const reviewed=$('#invReviewed')?.checked;
  if(approve&&!reviewed){notify('Önce faturadaki rakamları kontrol edip onay kutusunu işaretleyin.');return}
  const t=$('#invType').value, amount=Number($('#invAmount').value);
  if(!Number.isFinite(amount)||amount<0){notify('Ödenecek toplam tutarı kontrol edin.');return}
  let rec=editingInvoiceId?state.invoices.find(x=>x.id===editingInvoiceId):null;
  if(!rec){rec={id:uid('inv'),periodId:period().id};state.invoices.push(rec)}
  const file=pendingInvoiceFile;
  Object.assign(rec,{periodId:period().id,type:t,date:$('#invDate').value,amount,status:approve?'approved':'draft',verified:!!approve,reviewedAt:approve?new Date().toISOString():null,reviewedBy:approve?(session?.label||'Kat Görevlisi'):null,fileName:file?.name||rec.fileName||null,ocrText:lastInvoiceOcrText||rec.ocrText||''});
  if(t==='water')Object.assign(rec,{invoiceConsumption:Number($('#invConsumption').value||0),wasteCollection:Number($('#invWasteCollection').value||0),wasteDisposal:Number($('#invWasteDisposal').value||0)});
  if(t==='gas')Object.assign(rec,{invoiceConsumption:Number($('#invRawGas').value||0),correctedConsumption:Number($('#invCorrectedGas').value||0)});
  if(file){
    const up=await uploadStaffDocument(file,'faturalar',rec.id,period().month);
    if(up?.path){rec.storagePath=up.path;rec.mimeType=up.mimeType;rec.driveBackupStatus='pending'}
    else if(up?.error){rec.driveBackupStatus='failed';rec.driveBackupError=up.error}
  }
  syncUtilityInvoiceExpense(rec);
  pendingInvoiceFile=null;editingInvoiceId=null;saveState();
  logAudit(approve?'Fatura kontrol edildi/onaylandı':'Fatura taslak kaydedildi',`${period().month} · ${t} · ${trMoney(rec.amount)}`);
  closeModal();render();notify(approve?'Fatura kaydedildi ve giderlere işlendi.':'Taslak kaydedildi.');
}

function calculatePeriod(periodId){
  const p=state.periods.find(x=>x.id===periodId); const apartments=state.units.filter(u=>u.type==='apartment');
  const waterInv=state.invoices.find(x=>x.periodId===p.id&&x.type==='water'&&x.status==='approved'); const gasInv=state.invoices.find(x=>x.periodId===p.id&&x.type==='gas'&&x.status==='approved'); const electricTotal=state.invoices.filter(x=>x.periodId===p.id&&x.type==='electric'&&x.status==='approved').reduce((a,x)=>a+x.amount,0);
  // Always refresh system-generated lines, preserving special assessments.
  state.charges=state.charges.filter(c=>!(c.periodId===p.id&&['dues','cold_water','hot_water','gas','electric','late_fee'].includes(c.type)));
  // Dues for all active units. The selected manager apartment is exempt only from the fixed dues for this period.
  state.units.filter(u=>u.active).forEach(u=>{const managerExempt=!!p.managerDuesExemptUnitId&&u.id===p.managerDuesExemptUnitId;const raw=managerExempt?0:p.dues*u.duesMultiplier;state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:responsiblePersonForDate(u.id,p.dueDate||p.month+'-15')?.id||ownerOf(u.id,p.dueDate||p.month+'-15')?.id,type:'dues',label:managerExempt?'Sabit Aidat (Yönetici Muaf)':'Sabit Aidat',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate,managerExempt});});
  if(waterInv){
    const coldTotal=apartments.reduce((a,u)=>a+(state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='cold')?.consumption||0),0);
    const hotTotal=apartments.reduce((a,u)=>a+(state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='hot')?.consumption||0),0);
    const measured=coldTotal+hotTotal; const linked=measured/(p.waterLossDivisor||12); const diff=(waterInv.invoiceConsumption||0)-measured; const common=diff-linked;
    const waterUnit=((waterInv.amount||0)-(waterInv.wasteCollection||0)-(waterInv.wasteDisposal||0))/(waterInv.invoiceConsumption||1);
    const wasteTotal=(waterInv.wasteCollection||0)+(waterInv.wasteDisposal||0);
    let hotGasUnit=0; let v40=0;
    if(gasInv&&hotTotal>0&&gasInv.amount>0){v40=(((1.2*hotTotal)*(p.boilerTemp-10))/8.25)*((gasInv.correctedConsumption||0)/gasInv.amount);hotGasUnit=v40/hotTotal;}
    apartments.forEach(u=>{
      const cold=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='cold')?.consumption||0; const hot=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='hot')?.consumption||0; const total=cold+hot;
      const linkedShare=measured>0?(total/measured)*linked:0; const commonShare=(u.sqm/TOTAL_APT_SQM)*common; const wasteShare=(u.sqm/TOTAL_APT_SQM)*wasteTotal;
      const coldRaw=(cold+linkedShare+commonShare)*waterUnit+wasteShare; const hotRaw=hot*(waterUnit+hotGasUnit);
      const pid=occupantOf(u.id,p.month+'-15')?.id||ownerOf(u.id)?.id;
      state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:pid,type:'cold_water',label:'Soğuk Su',rawAmount:coldRaw,amount:roundTL(coldRaw),dueDate:p.dueDate});
      state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:pid,type:'hot_water',label:'Sıcak Su',rawAmount:hotRaw,amount:roundTL(hotRaw),dueDate:p.dueDate});
    });
    if(gasInv){
      const pool70=gasInv.amount*(p.gasConsumptionPct/100)-v40, pool30=gasInv.amount*(p.gasSqmPct/100); const gasTotal=apartments.reduce((a,u)=>a+(state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='gas')?.consumption||0),0);
      apartments.forEach(u=>{const gc=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='gas')?.consumption||0; const consumptionShare=p.boilerActive?(gasTotal>0?pool70*(gc/gasTotal):0):pool70/apartments.length; const sqmShare=pool30*(u.sqm/TOTAL_APT_SQM); const raw=consumptionShare+sqmShare;state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:responsiblePersonForDate(u.id,p.dueDate||p.month+'-15')?.id||ownerOf(u.id,p.dueDate||p.month+'-15')?.id,type:'gas',label:'Doğalgaz',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate});});
    }
    if(electricTotal){const raw=electricTotal/apartments.length;apartments.forEach(u=>state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:responsiblePersonForDate(u.id,p.dueDate||p.month+'-15')?.id||ownerOf(u.id,p.dueDate||p.month+'-15')?.id,type:'electric',label:'Elektrik',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate}));}
  } else if(electricTotal){const raw=electricTotal/apartments.length;apartments.forEach(u=>state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:responsiblePersonForDate(u.id,p.dueDate||p.month+'-15')?.id||ownerOf(u.id,p.dueDate||p.month+'-15')?.id,type:'electric',label:'Elektrik',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate}));}
  saveState();logAudit('Dönem hesaplandı',p.month);notify('Hesaplama tamamlandı. Borçlar tam TL olarak oluşturuldu.');render();
}

function applyLateFeeForPayment(charge, paymentDate){
  const p=state.periods.find(x=>x.id===charge.periodId); if(!p?.lateFeeEnabled||!p.lateFeeRate||!charge.dueDate||paymentDate<=charge.dueDate)return 0;
  const days=Math.ceil((new Date(paymentDate)-new Date(charge.dueDate))/86400000); if(days<=0)return 0;
  if(p.lateFeeMode==='monthly') return roundTL(charge.amount*(p.lateFeeRate/100)*Math.ceil(days/30));
  return roundTL(charge.amount*(p.lateFeeRate/100)*(days/30));
}

function meterDoneCount(type){
  const p=period();
  return state.meterReadings.filter(x=>x.periodId===p.id&&x.type===type).length;
}
function meterFirstMissingIndex(type){
  const p=period(),units=meterUnits();
  const idx=units.findIndex(u=>!state.meterReadings.some(r=>r.periodId===p.id&&r.unitId===u.id&&r.type===type));
  return idx>=0?idx:0;
}
function prepareMeterFastEntry(force=false){
  const p=period();
  if(meterContext.type==='gas'&&!p.boilerActive)meterContext.type='cold';
  if(force||meterContext.periodId!==p.id){
    meterContext.periodId=p.id;
    meterContext.type=(meterContext.type==='hot'||(meterContext.type==='gas'&&p.boilerActive))?meterContext.type:'cold';
    meterContext.index=meterFirstMissingIndex(meterContext.type);
  }
}
function meterSetType(type){
  const p=period();
  if(type==='gas'&&!p.boilerActive){notify('Kombi kapalı; gaz sayaç girişi gerekmiyor.');return}
  meterContext.type=type;
  meterContext.periodId=p.id;
  meterContext.index=meterFirstMissingIndex(type);
}
function meterJumpToIndex(idx){
  idx=Number(idx);const units=meterUnits();
  if(!Number.isInteger(idx)||idx<0||idx>=units.length)return;
  meterContext.index=idx;render();meterFocusInput();
}
function meterJumpToCode(code){const units=meterUnits(),idx=units.findIndex(u=>u.code===code);if(idx>=0)meterJumpToIndex(idx)}
function meterJumpNextMissing(){
  const p=period(),units=meterUnits(),type=meterContext.type;
  for(let step=1;step<=units.length;step++){
    const idx=(meterContext.index+step)%units.length,u=units[idx];
    if(!state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type===type)){
      meterContext.index=idx;render();meterFocusInput();return;
    }
  }
  notify('Bu sayaç türünde eksik daire kalmadı.');
}

function meterResultText(curr,prev,type){

function saveMeterNext(prev){
  if(!saveMeter(prev,true))return;
  const p=period(),units=meterUnits(),type=meterContext.type;
  if(meterContext.index<units.length-1){
    meterContext.index++;
    render();meterFocusInput();return;
  }
  const nextType=type==='cold'?'hot':(type==='hot'&&p.boilerActive?'gas':null);
  if(nextType){
    meterContext.type=nextType;
    meterContext.index=meterFirstMissingIndex(nextType);
    notify((type==='cold'?'Soğuk su':'Sıcak su')+' tamamlandı. '+(nextType==='hot'?'Sıcak suya':'Gaza')+' geçildi.');
    render();meterFocusInput();return;

  route='meters';render();

function meterPrev(){
  if(meterContext.index>0){meterContext.index--;render();meterFocusInput()}

function saveMeter(prev,advance){
  const raw=String($('#meterNew')?.value??'').trim().replace(',','.');
  const value=Number(raw);
  if(!raw||!Number.isFinite(value)||value<prev){
    notify(!raw?'Yeni endeksi gir.':'Yeni değer önceki endeksten düşük olamaz.');
    meterFocusInput();return false;
  }
  const units=meterUnits(),u=units[meterContext.index],p=period(),type=meterContext.type;
  let r=state.meterReadings.find(x=>x.periodId===p.id&&x.unitId===u.id&&x.type===type);
  if(!r){r={id:uid('m'),periodId:p.id,unitId:u.id,type};state.meterReadings.push(r)}
  Object.assign(r,{previous:prev,current:value,consumption:(value-prev)/1000,verified:true});
  saveState();logAudit('Sayaç kaydedildi',`${p.month} · ${u.label} · ${type}`);
  return true;
}

function expenseBankTx(exp){return exp?.bankTransactionId?state.bankTransactions.find(t=>t.id===exp.bankTransactionId):null}
function outgoingBankTxs(){return state.bankTransactions.filter(t=>Number(t.amount)<0)}
function uniqueExpenseBankCandidate(exp){
  if(!exp||exp.bankTransactionId)return null;
  const d=new Date(exp.date+'T12:00:00');
  const c=outgoingBankTxs().filter(t=>!t.expenseId&&Math.abs(Math.abs(Number(t.amount))-Number(exp.amount))<0.01&&Math.abs((new Date(t.date+'T12:00:00')-d)/86400000)<=7);
  return c.length===1?c[0]:null;
}
function reconcileExpenseBankLinks(auto=true){
  let linked=0;
  if(auto){state.expenses.forEach(e=>{if(e.bankTransactionId)return;const tx=uniqueExpenseBankCandidate(e);if(tx){e.bankTransactionId=tx.id;e.paid=true;e.paymentMethod='Banka';tx.expenseId=e.id;linked++;}});if(linked)saveState()}
  return linked;
}
function expenseDocumentStatus(e){return e.fileName?'Faturalı / Belgeli':'Belge eksik'}
function bankExpenseStatus(tx){return tx.expenseId?'Gider kaydıyla eşleşti':'Gider/fatura eşleşmesi bekliyor'}
function matchExpenseToBank(expId,txId){
  const e=state.expenses.find(x=>x.id===expId),tx=state.bankTransactions.find(x=>x.id===txId);if(!e||!tx)return;
  if(e.bankTransactionId&&e.bankTransactionId!==txId){const old=state.bankTransactions.find(x=>x.id===e.bankTransactionId);if(old)old.expenseId=null}
  if(tx.expenseId&&tx.expenseId!==expId){notify('Bu banka hareketi başka bir giderle eşleşmiş. Önce o eşleşmeyi kaldırın.');return}
  e.bankTransactionId=tx.id;e.paid=true;e.paymentMethod='Banka';tx.expenseId=e.id;saveState();logAudit('Gider banka çıkışıyla eşleştirildi',`${e.description} · ${trMoney(e.amount)} · ${bankProfile(tx.bankId).name}`);render();notify('Fatura/gider ile banka çıkışı eşleştirildi.');
}

function openExpenseBankMatcher(expId){
  const e=state.expenses.find(x=>x.id===expId);if(!e)return;const d=new Date(e.date+'T12:00:00');
  const rows=outgoingBankTxs().filter(t=>!t.expenseId||t.id===e.bankTransactionId).map(t=>{const dd=Math.round(Math.abs((new Date(t.date+'T12:00:00')-d)/86400000)),same=Math.abs(Math.abs(Number(t.amount))-Number(e.amount))<0.01;return {t,dd,same}}).filter(x=>x.dd<=30).sort((a,b)=>(b.same-a.same)||a.dd-b.dd).slice(0,30);

, tutar ve açıklamayı kontrol ettim</label><button class="primary">Kaydet</button></form>`)

function parseExpenseOcr(text){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let amount=ocrFindNumber(lines,['ODENECEK TUTAR','GENEL TOPLAM','TOPLAM TUTAR','FATURA TUTARI','TOPLAM']);
  let date=null;for(const line of lines){const m=line.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})\b/);if(m){date=`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;break}}
  return {amount,date};
}
async function runExpenseOcr(file){const st=$('#exOcrStatus');if(!window.Tesseract){st.className='notice bad';st.textContent='OCR modülü yüklenemedi; alanları elle doldurun.';return}st.className='notice';st.innerHTML='<b>Belge okunuyor…</b> %0';try{const r=await Tesseract.recognize(file,'tur+eng',{logger:m=>{if(m.status==='recognizing text'&&st)st.innerHTML=`<b>Belge okunuyor…</b> %${Math.round((m.progress||0)*100)}`}});pendingExpenseOcrText=r?.data?.text||'';const p=parseExpenseOcr(pendingExpenseOcrText);let f=[];if(p.date){$('#exDate').value=p.date;f.push('tarih')}if(p.amount!=null){$('#exAmount').value=p.amount;f.push('tutar')}st.className='notice warn';st.innerHTML=f.length?`<b>Otomatik okuma tamamlandı.</b> ${f.join(' ve ')} dolduruldu. Belgeye bakarak kontrol edin.`:'OCR tamamlandı; alanlar güvenle ayrılamadı. Elle girip kontrol edin.';$('#exReviewed').checked=false}catch(err){st.className='notice bad';st.textContent='Belge okunamadı. Alanları elle doldurabilirsiniz.'}}
function captureExpenseDoc(){const i=$('#docInput');i.value='';i.onchange=async e=>{pendingExpenseFile=e.target.files?.[0]||null;$('#exFileName').textContent=pendingExpenseFile?.name||'Belge seçilmedi.';if(!pendingExpenseFile)return;if(pendingExpenseFile.type==='application/pdf'||/\.pdf$/i.test(pendingExpenseFile.name)){$('#exOcrStatus').className='notice warn';$('#exOcrStatus').textContent='PDF alındı. Bu test sürümünde otomatik okuma fotoğrafta çalışır; alanları elle kontrol edin.';return}await runExpenseOcr(pendingExpenseFile)};i.click()}
function saveExpense(editId=''){
  if(!$('#exReviewed')?.checked){notify('Belgedeki bilgileri kontrol ettiğinizi işaretleyin.');return}
  const txId=$('#exBankTxId')?.value||null;let e=editId?state.expenses.find(x=>x.id===editId):null;if(!e){e={id:uid('exp')};state.expenses.push(e)}
  Object.assign(e,{periodId:periodIdForDate($('#exDate').value),date:$('#exDate').value,category:$('#exCat').value,description:$('#exDesc').value,amount:Math.abs(Number($('#exAmount').value)),paid:$('#exPaid').value==='1',paymentMethod:$('#exMethod').value,documentNo:$('#exDocNo').value.trim()||null,fileName:pendingExpenseFile?.name||e.fileName||null,ocrText:pendingExpenseOcrText||e.ocrText||'',reviewed:true,reviewedAt:new Date().toISOString(),reviewedBy:session?.label||'Kat Görevlisi',bankTransactionId:txId||e.bankTransactionId||null});
  if(e.bankTransactionId){const tx=state.bankTransactions.find(x=>x.id===e.bankTransactionId);if(tx)tx.expenseId=e.id}else{const tx=uniqueExpenseBankCandidate(e);if(tx){e.bankTransactionId=tx.id;e.paid=true;e.paymentMethod='Banka';tx.expenseId=e.id}}
  pendingExpenseFile=null;pendingExpenseOcrText='';saveState();logAudit('Gider/fatura kaydedildi',`${e.category} · ${e.description} · ${trMoney(e.amount)}`);closeModal();render();notify(e.bankTransactionId?'Gider kaydedildi ve banka çıkışıyla eşleşti.':'Gider kaydedildi; banka eşleşmesi kontrol edilebilir.');
}
function caretakerExpenses(){
  reconcileExpenseBankLinks(true);const p=period(),items=state.expenses.filter(x=>x.periodId===p.id),out=outgoingBankTxs().filter(t=>periodIdForDate(t.date)===p.id);const matched=items.filter(e=>e.bankTransactionId).length,docs=items.filter(e=>e.fileName).length,bankMissing=out.filter(t=>!t.expenseId).length,docMissing=items.filter(e=>!e.fileName).length;
  const expenseRows=items.map(e=>{const tx=expenseBankTx(e),cand=!tx?uniqueExpenseBankCandidate(e):null;return `<div class="listitem matchRow ${tx?'matched':e.fileName?'unpaid':'missing'}"><div class="sectionHead"><div><b>${esc(e.description)}</b><div class="small muted">${e.date} · ${esc(e.category)} · ${expenseDocumentStatus(e)}</div></div><div style="text-align:right"><b>${trMoney(e.amount)}</b><div class="small ${tx?'ok':'warn'}">${tx?'✓ '+bankProfile(tx.bankId).name+' çıkışı eşleşti':'⚠ Banka çıkışı eşleşmedi'}</div></div></div>${tx?`<div class="notice ok" style="margin-top:7px">Banka: ${bankProfile(tx.bankId).name} · ${tx.date} · ${trMoney(Math.abs(tx.amount))}</div>`:cand?`<div class="notice warn" style="margin-top:7px">Olası eşleşme: ${bankProfile(cand.bankId).name} · ${cand.date} · ${trMoney(Math.abs(cand.amount))}</div>`:''}<div class="actions" style="margin-top:7px"><button onclick="openExpenseForm({id:'${e.id}'})">Düzelt / Belge</button>${tx?`<button onclick="unlinkExpenseBank('${e.id}')">Eşleşmeyi Kaldır</button>`:`<button class="${cand?'primary':''}" onclick="openExpenseBankMatcher('${e.id}')">Banka Çıkışını Bul</button>`}</div></div>`}).join('')||'<div class="card muted">Gider yok.</div>';
  const bankRows=out.filter(t=>!t.expenseId).slice(0,30).map(t=>`<div class="listitem matchRow missing"><div class="sectionHead"><div><b>${t.date} · ${bankProfile(t.bankId).name}</b><div class="small muted">${esc(t.description||'')}</div></div><div style="text-align:right"><b>${trMoney(Math.abs(t.amount))}</b><div class="small warn">⚠ Belge/gider eşleşmesi yok</div></div></div><button class="full" style="margin-top:7px" onclick="openBankExpense('${t.id}')">Gider/Fatura Kaydı Oluştur</button></div>`).join('')||'<div class="card muted">Eşleşmemiş banka çıkışı yok.</div>';
  return shell(`${periodSelect()}<div class="sectionHead" style="margin-top:10px"><div><h2>Gider ve Fatura Mutabakatı</h2><div class="muted small">Her gider belgesinin banka çıkışı; her banka çıkışının da gider/fatura kaydı görülebilir.</div></div><button class="primary" onclick="openExpenseForm()">+ Gider / Fatura</button></div><div class="reconGrid" style="margin-top:10px"><div class="reconCard okbg"><div class="small">Banka ile eşleşmiş</div><b>${matched}</b></div><div class="reconCard warnbg"><div class="small">Belgesiz gider kaydı</div><b>${docMissing}</b></div><div class="reconCard badbg"><div class="small">Gider kaydı olmayan banka çıkışı</div><b>${bankMissing}</b></div></div><div class="card" style="margin-top:10px"><b>Faturalı / belgeli gider: ${docs}/${items.length}</b><div class="small muted">Aynı tutar ve ±7 gün içinde tek banka çıkışı bulunursa sistem otomatik eşleştirir; belirsiz eşleşmeler Kat Görevlisi kontrolüne kalır.</div></div><h3 style="margin-top:14px">Gider / Fatura Kayıtları</h3><div class="list" style="margin-top:8px">${expenseRows}</div><h3 style="margin-top:16px">Banka Çıkışı Var, Gider/Fatura Kaydı Yok</h3><div class="list" style="margin-top:8px">${bankRows}</div>`,caretakerMainNav());
}
