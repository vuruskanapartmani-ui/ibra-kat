function detectBankProfile(headers,aoa){const h=headers.map(normTR).join('|'),all=normTR(aoa.slice(0,16).flat().join(' '));if(h.includes('FIS NO')||all.includes('ZIRAAT BANKASI')||all.includes('YENI GIRNE/IZMIR'))return BANK_PROFILES.ziraat;if(h.includes('TARIH/SAAT')||h.includes('REFERANS')||all.includes('NERGIS/IZMIR')||all.includes('IS BANKASI')||all.includes('ISCEP'))return BANK_PROFILES.isbank;return null}
function importBankWorkbook(wb,fileName,{balanceOnly=false,expectedBank=null,persist=true}={}){
  const statements=[];
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true});
    const hi=aoa.findIndex(row=>row.some(v=>normTR(v).includes('ISLEM TUTARI'))&&row.some(v=>normTR(v).includes('ACIKLAMA')));
    if(hi<0)continue;
    const headers=aoa[hi].map(v=>String(v??'').trim()),profile=detectBankProfile(headers,[[name],...aoa]);
    if(!profile)continue;
    const idx=(...names)=>headers.findIndex(h=>names.some(n=>normTR(h).includes(normTR(n))));
    const date=idx('İşlem Tarihi','Tarih/Saat','Tarih'),time=headers.findIndex(h=>normTR(h)==='SAAT');
    const amount=idx('İşlem Tutarı'),description=idx('Açıklama'),reference=idx('Referans','Fiş No'),balance=bankAmountColumn(headers);
    if(date<0)throw new Error('İşlem tarihi sütunu bulunamadı.');
    const rows=aoa.slice(hi+1).map(cells=>({
      key:spreadsheetDateKey(cells[date],cells[time]),amount:spreadsheetAmount(cells[amount]),balance:spreadsheetAmount(cells[balance]),
      description:String(cells[description]??'').trim(),reference:String(cells[reference]??'').trim(),
    })).filter(row=>row.key);
    statements.push({profile,rows});
  }
  if(!statements.length)throw new Error('Tanımlı banka ve işlem başlıkları bulunamadı.');
  const chosen=expectedBank?statements.filter(item=>item.profile.id===expectedBank):statements;
  if(!chosen.length)throw new Error('Seçilen banka ile Excel dosyasının bankası farklı.');
  const bp=chosen[0].profile;
  if(chosen.some(item=>item.profile.id!==bp.id))throw new Error('Dosyada birden fazla banka var. Bakiye için ilgili bankayı seçin veya hareketleri ayrı dosyalardan yükleyin.');
  const rows=chosen.flatMap(item=>item.rows);
  const closing=latestBankBalance(rows);
  if(balanceOnly&&!closing)throw new Error('İşlem tarihine bağlı geçerli bakiye bulunamadı.');
  const current=state.settings.bankBalances?.[bp.id];
  const currentKey=current?.statementKey||current?.asOf||'';
  const lastBalance=closing?.balance??null,lastBalanceDate=closing?.key.slice(0,10)||'';
  const balanceUpdated=!!closing&&closing.key>=(current?.statementKey?currentKey:current?.source==='Manuel'?'':currentKey);
  let added=0,skipped=0,autoHints=0;
  for(const row of balanceOnly?[]:rows){
    const {amount,description,reference}=row,date=row.key.slice(0,10);
    if(!amount||!description)continue;
    const dedupe=`${bp.id}|${reference||''}|${date}|${amount}|${description}`; if(state.bankTransactions.some(x=>x.dedupeKey===dedupe)){skipped++;continue}
    const match=bankMatchFor(description+' '+reference,date),suggested=match.suggested,confidence=match.confidence,matchReason=match.reason;
    if(suggested.length)autoHints++;
    const tx={id:uid('bt'),periodId:periodIdForDate(date),bankId:bp.id,bankName:bp.name,bankAccount:bp.short,date,amount,description,reference,dedupeKey:dedupe,direction:amount>0?'income':'expense',suggestedUnitIds:suggested,matchConfidence:confidence,matchReason,sourceFile:fileName,statementBalance:row.balance,statementKey:row.key};
    state.bankTransactions.push(tx);added++;
    if(amount>0 && confidence==='high' && suggested.length===1){ if(bulkAutoAllocateIncome(tx)) tx.autoProcessed=true; }
  }
  if(balanceUpdated){
    state.settings.bankBalances ||= {};
    state.settings.bankBalances[bp.id]={balance:lastBalance,asOf:lastBalanceDate,source:fileName,statementKey:closing.key};
  }
  if(persist&&(added||balanceUpdated))saveState();
  return {bp,added,skipped,autoHints,lastBalance,lastBalanceDate,balanceUpdated};
}
function handleBankFile(ev,options){

async function savePayment(){
  const u=$('#payUnit')?.value,pid=$('#payPerson')?.value||null,amount=Number($('#payAmount')?.value),
    date=$('#payDate')?.value,bankId=$('#payBank')?.value,bp=BANK_PROFILES[bankId],
    target=$('#payCharge')?.value,desc=$('#payDesc')?.value||'Manuel tahsilat';
  if(!pid||!person(pid))return notify('Ödemenin ait olduğu kişiyi seçmelisiniz.');
  if(!amount||amount<=0||!date)return notify('Tutar ve ödeme tarihi zorunlu.');
  const rel=state.responsibilities.find(r=>r.unitId===u&&r.personId===pid&&(!r.startDate||r.startDate<=date)&&(!r.endDate||date<=r.endDate));
  if(!rel)return notify('Ödeme tarihi seçilen kişinin sorumluluk tarihleri dışında.');
  const button=document.querySelector('#modalBack form button.primary');if(button)button.disabled=true;
  try{
    const res=await commitSpreadsheetChange(()=>{
      let remain=amount,added=0;
      const selected=target&&target!=='general'?state.charges.find(c=>c.id===target):null;
      if(selected&&(selected.unitId!==u||chargeAccountPersonId(selected)!==pid))
        throw new Error('Seçilen borç başka kişiye ait. Ödeme devri engellendi.');
      const candidates=selected?[selected]:target==='general'?[]:openChargesForUnit(u).filter(c=>chargeAccountPersonId(c)===pid);
      for(const charge of candidates){
        if(remain<=0.005)break;
        const due=Math.max(0,Number(charge.amount||0)-chargePaidAmount(charge.id));
        const paid=Math.min(remain,due);
        if(paid<=0.005)continue;
        state.payments.push({id:uid('pay'),periodId:charge.periodId,unitId:u,personId:pid,amount:paid,date,description:desc,
          bankId,bankName:bp?.name||'Nakit / Diğer',bankAccount:bp?.short||'',chargeId:charge.id,manualEntry:true});
        remain-=paid;added++;
      }
      if(remain>0.005){
        state.payments.push({id:uid('pay'),periodId:periodIdForDate(date)||activePeriodId,unitId:u,personId:pid,
          amount:remain,date,description:desc,bankId,bankName:bp?.name||'Nakit / Diğer',bankAccount:bp?.short||'',chargeId:null,manualEntry:true});
        added++;
      }
      return {changed:added>0,added};
    },'Manuel tahsilat girildi',x=>unit(u).label+' · '+person(pid).name+' · '+trMoney(amount));
    closeModal();render();notify(trMoney(amount)+' tahsilat kişi carisine işlendi ve sunucuda doğrulandı.');
  }catch(e){notify('Ödeme kaydedilemedi: '+e.message)}
  finally{if(button&&button.isConnected)button.disabled=false}
}
function chargePaidAmount(chargeId,excludeTxId=null){return state.payments.filter(p=>p.chargeId===chargeId&&(!excludeTxId||p.bankTransactionId!==excludeTxId)).reduce((a,p)=>a+Number(p.amount||0),0)}
function openChargesForUnit(unitId,excludeTxId=null){return state.charges.filter(c=>c.unitId===unitId).map(c=>({...c,remaining:Math.max(0,Number(c.amount||0)-chargePaidAmount(c.id,excludeTxId))})).filter(c=>c.remaining>0.005).sort((a,b)=>((a.dueDate||period(a.periodId)?.month||'').localeCompare(b.dueDate||period(b.periodId)?.month||'')))}
let allocSeq=0,allocTxId=null;
function openBankAllocation(txId){
  const tx=state.bankTransactions.find(x=>x.id===txId);if(!tx)return;allocTxId=txId;allocSeq=0;const existing=state.payments.filter(p=>p.bankTransactionId===txId);const bp=bankProfile(tx.bankId),suggest=effectiveBankMatch(tx).suggested?.[0]||'';
  openModal(`<h2>Ödeme Dağıtımı</h2><div class="notice"><b>${esc(bp.name)} · ${tx.date} · ${trMoney(tx.amount)}</b><br>${esc(tx.description)}</div><div id="allocRows" class="stack" style="margin-top:10px"></div><div class="actions" style="margin-top:10px"><button onclick="addAllocationRow('${suggest}')">+ Dağıtım Satırı</button><button class="primary" onclick="saveBankAllocation()">Dağılımı Kaydet</button></div><div id="allocTotal" class="notice" style="margin-top:10px"></div>`);

}

function saveBankAllocation(){const tx=state.bankTransactions.find(x=>x.id===allocTxId);if(!tx)return;const rows=$$('#allocRows .card').map(box=>({unitId:box.querySelector('.alUnit').value,chargeId:box.querySelector('.alCharge').value,amount:Number(box.querySelector('.alAmount').value||0)})).filter(x=>x.amount>0);const sum=rows.reduce((a,x)=>a+x.amount,0);if(sum-Number(tx.amount)>0.005){notify('Dağıtım toplamı banka hareketinden büyük olamaz.');return}state.payments=state.payments.filter(p=>p.bankTransactionId!==tx.id);const bp=bankProfile(tx.bankId);rows.forEach(r=>{const c=state.charges.find(x=>x.id===r.chargeId),matched=effectiveBankMatch(tx),pid=c?.personId||(matched.suggested.length===1&&matched.suggested[0]===r.unitId?matched.personId:null);state.payments.push({id:uid('pay'),periodId:c?.periodId||tx.periodId||activePeriodId,unitId:r.unitId,personId:pid,amount:r.amount,date:tx.date,description:`${bp.name} banka ödemesi · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:r.chargeId||null,reference:tx.reference})});tx.allocatedAmount=sum;saveState();logAudit('Banka ödemesi dağıtıldı',`${bp.name} · ${trMoney(sum)}`);closeModal();render();notify('Banka ödemesi dağıtıldı.')}
function autoAllocateBankTransaction(txId){const tx=state.bankTransactions.find(x=>x.id===txId),match=tx?effectiveBankMatch(tx):null,u=match?.suggested?.length===1?match.suggested[0]:null;if(!tx||!u||match.confidence!=='high'||Number(tx.amount)<=0||txAllocated(tx.id)>0){notify('Tek ve kesin daire önerisi gerekli; kısmi dağıtılmış hareketi yeniden otomatik işleme.');return}state.payments=state.payments.filter(p=>p.bankTransactionId!==tx.id);let remain=Number(tx.amount),bp=bankProfile(tx.bankId),matched=matchedPersonForTx(tx),opens=matched?openChargesForUnit(u,tx.id).filter(c=>chargeAccountPersonId(c)===matched):[];for(const c of opens){if(remain<=0.005)break;const a=Math.min(remain,c.remaining);state.payments.push({id:uid('pay'),periodId:c.periodId,unitId:u,personId:matched,amount:a,date:tx.date,description:`${bp.name} otomatik eşleşme · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:c.id,reference:tx.reference});remain-=a}if(remain>0.005)state.payments.push({id:uid('pay'),periodId:tx.periodId||activePeriodId,unitId:u,personId:matched,amount:remain,date:tx.date,description:`${bp.name} genel ödeme / avans · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:null,reference:tx.reference});tx.allocatedAmount=Number(tx.amount);saveState();logAudit('Banka ödemesi otomatik eşleşti',`${unit(u).label} · ${trMoney(tx.amount)}`);render();notify(`${unit(u).label} için ödeme işlendi.`)}

  const ppEmails=personEmails(pp); if(!ppEmails.length){notify('Bu kişinin kayıtlı e-posta adresi yok.');return}

  const charges=entries.charges;
  const pays=entries.payments;
  const total=charges.reduce((a,c)=>a+Number(c.amount||0),0);
  const paid=pays.reduce((a,x)=>a+Number(x.amount||0),0);
  const balance=total-paid;
  const rows=[
    ...charges.map(c=>({date:(period(c.periodId)?.month||'')+'-01',kind:'Tahakkuk',desc:c.label||c.type||'Tahakkuk',amount:Number(c.amount||0)})),

  window.location.href=`mailto:${encodeURIComponent(ppEmails.join(','))}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

const HISTORICAL_DEBT_TYPES={
  dues:'Aidat',gas:'Doğalgaz',water:'Su (toplam)',cold_water:'Soğuk su',
  hot_water:'Sıcak su',electric:'Elektrik',legacy_debt:'Diğer borç',rounding_adjustment:'PDF toplam yuvarlama farkı',
};
function sheetKey(value){return normTR(value).replace(/[^A-Z0-9]+/g,' ').trim()}
function historicalDebtType(value){
  const key=sheetKey(value).replace(/ (TL|TRY|BORCU|BORC|TUTARI|BEDELI)$/g,'').replace(/ (BORCU|BORC|TUTARI|BEDELI)$/,'');
  return ({
    AIDAT:'dues','SABIT AIDAT':'dues',GAZ:'gas',DOGALGAZ:'gas','DOGAL GAZ':'gas',
    SU:'water','TOPLAM SU':'water','SU TOPLAM':'water','SOGUK SU':'cold_water',
    'SICAK SU':'hot_water',ELEKTRIK:'electric',DIGER:'legacy_debt','EK GIDER':'legacy_debt',
    'PDF TOPLAM YUVARLAMA FARKI':'rounding_adjustment',
  })[key];
}
function debtUnit(value){
  const text=sheetKey(value);
  const match=text.match(/^(?:(?:DAIRE(?: NO)?|D) ?)?0*(\d{1,2})$/);
  const code=match?'D'+match[1].padStart(2,'0'):text.replace(/\s/g,'');
  return state.units.find(entry=>entry.code===code);
}
function monthFromCell(value){
  const text=String(value??'').trim();
  const months=['OCAK','SUBAT','MART','NISAN','MAYIS','HAZIRAN','TEMMUZ','AGUSTOS','EYLUL','EKIM','KASIM','ARALIK'];
  const words=sheetKey(text).split(' ');
  if(words.length===2){
    const year=words.find(word=>/^\d{4}$/.test(word)), month=months.findIndex(name=>words.includes(name));
    if(year&&month>=0)return year+'-'+String(month+1).padStart(2,'0');
  }
  const direct=text.match(/^(\d{4})[-/.](0?[1-9]|1[0-2])$/);
  if(direct)return direct[1]+'-'+direct[2].padStart(2,'0');
  const tr=text.match(/^(0?[1-9]|1[0-2])[-/.](\d{4})$/);
  if(tr)return tr[2]+'-'+tr[1].padStart(2,'0');
  return spreadsheetDateKey(value).slice(0,7);
}
function debtPersonForMonth(unitId,month){
  // A due date or a current active tenant does NOT determine who owed a past month.
  // An occupant starting during the month needs an explicit allocation.
  const date=month+'-01';
  const rels=unitRelationships(unitId);
  const possible=rels.filter(({r})=>['tenant','owner'].includes(r.role)&&r.startDate&&r.startDate<=date&&(!r.endDate||r.endDate>=date));
  const tenants=possible.filter(({r})=>r.role==='tenant');
  const unresolvedTenant=rels.some(({r})=>r.role==='tenant'&&!r.startDate&&(r.endDate==null||r.endDate>=date));
  if(unresolvedTenant)return null;
  if(tenants.length)return tenants.length===1?tenants[0].p.id:null;
  const owners=possible.filter(({r})=>r.role==='owner');
  const unresolvedOwner=rels.some(({r})=>r.role==='owner'&&!r.startDate&&(r.endDate==null||r.endDate>=date));
  return !unresolvedOwner&&owners.length===1?owners[0].p.id:null;
}
function monthEnd(month){
  return new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5)),0)).toISOString().slice(0,10);
}
function debtCategoriesOverlap(a,b){
  return a===b||(a==='water'&&['cold_water','hot_water'].includes(b))||(b==='water'&&['cold_water','hot_water'].includes(a));
}
function prepareHistoricalDebts(entries){
  const accepted=[],errors=[];
  let repeated=0;
  for(const e of entries){
    const existingPeriod=state.periods.find(p=>p.month===e.month);
    const where=e.label||e.unit.code;
    if(!unit(e.unit.id)){errors.push(where+' · daire artık kayıtlı değil.');continue;}
    const existing=state.charges.filter(c=>c.periodId===existingPeriod?.id&&c.unitId===e.unit.id&&debtCategoriesOverlap(c.type,e.type));
    const inFile=accepted.filter(c=>c.month===e.month&&c.unit.id===e.unit.id&&debtCategoriesOverlap(c.type,e.type));
    const sameRecord=(type,amount,recordDue,personId)=>type===e.type&&amount===e.amount&&recordDue===e.due&&
      (!e.explicitPerson||(personId||null)===e.personId);
    const same=existing.some(c=>c.source==='legacy_manual'&&sameRecord(c.type,c.amount,c.dueDate,c.personId))||
      inFile.some(c=>sameRecord(c.type,c.amount,c.due,c.personId));
    if(same){repeated++;continue;}
    if(existing.length||inFile.length){
      errors.push(where+' · '+e.month+' · '+HISTORICAL_DEBT_TYPES[e.type]+' için çakışan kayıt var.');
      continue;
    }
    accepted.push(e);
  }
  return {accepted,errors,repeated};
}
function applyHistoricalDebts(entries){
  const plan=prepareHistoricalDebts(entries);
  if(plan.errors.length)throw new Error(plan.errors[0]);
  for(const e of plan.accepted){
    let p=state.periods.find(item=>item.month===e.month);
    if(!p){
      p={id:uid('p'),month:e.month,dueDate:e.due,status:'locked',legacyOnly:true,boilerActive:false,dues:0};
      state.periods.push(p);
    }
    state.charges.push({
      id:uid('c'),periodId:p.id,unitId:e.unit.id,personId:e.personId,type:e.type,
      label:HISTORICAL_DEBT_TYPES[e.type],rawAmount:e.amount,amount:e.amount,
      dueDate:e.due,source:'legacy_manual',note:e.note||'',
    });
  }
  return plan.accepted.length;
}

async function saveLegacyDebt(form,unitId){
  if(session?.role!=='manager')return;
  const u=unit(unitId),fields=new FormData(form),month=String(fields.get('month')),due=String(fields.get('due')),pid=String(fields.get('person')||'');
  const message=form.querySelector('[data-import-error]');

  try{
    if(!u||!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||excelDateToISO(due)!==due)throw new Error('Dönemi ve son ödeme tarihini kontrol edin.');
    if(pid&&!unitRelationships(unitId).some(x=>x.p.id===pid))throw new Error('Sorumlu kişi bu daireye bağlı değil.');
    const entries=Object.keys(HISTORICAL_DEBT_TYPES).filter(type=>Number(fields.get(type))>0).map(type=>({
      unit:u,month,due,type,amount:Math.round(Number(fields.get(type))*100)/100,
      personId:pid||debtPersonForMonth(u.id,month),explicitPerson:!!pid,note:String(fields.get('note')||''),
    }));
    if(!entries.length)throw new Error('En az bir borç kalemine tutar girin.');
    const result=await commitSpreadsheetChange(()=>{
      if(pid&&!unitRelationships(unitId).some(x=>x.p.id===pid))throw new Error('Sorumlu kişi bu daireye bağlı değil.');
      const added=applyHistoricalDebts(entries.map(e=>({...e,personId:pid||debtPersonForMonth(u.id,month)})));
      return {added,changed:added>0};
    },'Geçmiş borç kaydı',record=>u.label+' · '+month+' · '+record.added+' kalem');
    closeModal();render();notify(result.added?result.added+' borç kalemi eklendi.':'Aynı borçlar zaten kayıtlı.');
  }catch(error){message.textContent=error.message;}
}

function parseHistoricalDebtSheet(sheets,fallbackMonth,fallbackDue){
  const unitNames=['DAIRE','DAIRE NO','DAIRE NUMARASI','BOLUM','BOLUM KODU','DAIRE KODU'];
  const entries=[],errors=[];
  let found=false;
  for(const rows of sheets){
    const hi=rows.findIndex(row=>row.some(v=>unitNames.includes(sheetKey(v)))&&row.some(v=>historicalDebtType(v)||['KALEM','BORC KALEMI','TUR','BORC TURU'].includes(sheetKey(v))));
    if(hi<0)continue;
    found=true;
    const headers=rows[hi].map(sheetKey);
    const column=(...names)=>headers.findIndex(h=>names.includes(h));
    const ui=column(...unitNames),mi=column('DONEM','AY','BORC DONEMI'),di=column('VADE','VADE TARIHI','SON ODEME','SON ODEME TARIHI');
    const ti=column('KALEM','BORC KALEMI','TUR','BORC TURU'),ai=column('TUTAR','TUTAR TL','BORC TUTARI','BORC TUTARI TL'),ni=column('NOT','ACIKLAMA');
    if(ti>=0&&ai<0){errors.push('Tutar sütunu bulunamadı.');continue;}
    rows.slice(hi+1).forEach((row,index)=>{
      if(!row.some(value=>String(value??'').trim()))return;
      if(/^(GENEL )?TOPLAM$/.test(sheetKey(row[ui])))return;
      const label='Satır '+(hi+index+2),u=debtUnit(row[ui]);
      const month=String(row[mi]??'').trim()?monthFromCell(row[mi]):fallbackMonth;
      const due=String(row[di]??'').trim()?excelDateToISO(row[di]):fallbackDue||state.periods.find(p=>p.month===month)?.dueDate||(month?monthEnd(month):'');
      if(!u||!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!due){
        errors.push(label+' · daire, dönem veya son ödeme tarihi geçersiz.');return;
      }
      const amounts=ti>=0?[[historicalDebtType(row[ti]),row[ai]]]:rows[hi].map((name,i)=>[historicalDebtType(name),row[i]]).filter(([type])=>type);
      for(const [type,value] of amounts){
        if(!String(value??'').trim())continue;
        const number=spreadsheetAmount(value);
        if(!type||number===null||(number<0&&type!=='rounding_adjustment')){errors.push(label+' · borç kalemi veya tutar geçersiz.');continue;}
        if(number===0)continue;
        entries.push({unit:u,month,due,type,amount:Math.round(number*100)/100,personId:debtPersonForMonth(u.id,month),label,note:String(row[ni]??'')});
      }
    });
  }
  if(!found)errors.push('Daire ve borç kalemi sütunları bulunamadı.');
  return {entries,errors};
}
const archiveColumns={
  debt:['Daire No','Soğuk Su','Sıcak Su','Doğalgaz','Elektrik','Aidat'],
  meter:['Daire No','Önceki Soğuk Su','Yeni Soğuk Su','Önceki Sıcak Su','Yeni Sıcak Su','Önceki Gaz','Yeni Gaz','Gaz Tüketimi'],
};
function pdfGridLines(canvas,vertical){
  const {width,height}=canvas, pixels=canvas.getContext('2d').getImageData(0,0,width,height).data;
  const length=vertical?width:height, cross=vertical?height:width, peaks=[];
  for(let i=0;i<length;i++){
    let dark=0;
    for(let j=0;j<cross;j++){
      const p=4*(vertical?j*width+i:i*width+j);
      if(pixels[p]+pixels[p+1]+pixels[p+2]<360)dark++;
    }
    if(dark/cross>(vertical?.47:.55)){
      if(peaks.length&&i-peaks.at(-1).at(-1)<=2)peaks.at(-1).push(i);
      else peaks.push([i]);
    }
  }
  return peaks.map(group=>group[Math.floor(group.length/2)]);
}

/* V1.32 - PDF with embedded selectable text: preserve decimal commas and exact index digits. */
function nativeArchivePageRows(page,textContent,mode,xs,ys,viewport){
  const cells=Array.from({length:ys.length-1},()=>Array.from({length:xs.length-1},()=>[]));
  const scalex=viewport.width/(page.view[2]-page.view[0]);
  const scaley=viewport.height/(page.view[3]-page.view[1]);
  for(const item of textContent.items||[]){
    const str=String(item.str||'').trim();
    if(!str)continue;
    // PDF.js transform coordinates use a bottom-left baseline, while canvas y is top-down.
    const pt=viewport.convertToViewportPoint(item.transform[4],item.transform[5]);
    const x=pt[0]+Math.max(0,item.width||0)*scalex*0.45;
    const y=pt[1]-Math.max(0,Math.abs(item.transform[3]||0))*scaley*0.4;
    const col=xs.findIndex((edge,i)=>i<xs.length-1&&x>=edge&&x<xs[i+1]);
    const row=ys.findIndex((edge,i)=>i<ys.length-1&&y>=edge&&y<ys[i+1]);
    if(row<0||col<0)continue;
    cells[row][col].push({x,str});
  }
  const mapping=mode==='debt'?[0,1,2,3,4,6,7]:[0,7,8,4,5,1,2,3];
  const rows=[];
  for(const row of cells){
    const entry=col=>row[col].sort((a,b)=>a.x-b.x).map(v=>v.str).join(' ').trim();
    const label=entry(0);
    const match=sheetKey(label).match(/(?:DAIRE|D)\s*0*(\d{1,2})(?:\s|$)/);
    if(!match||Number(match[1])<1||Number(match[1])>33)continue;
    const values=mapping.map((col,j)=>j===0?'D'+match[1].padStart(2,'0'):entry(col));
    if(values.slice(1).filter(Boolean).length<mapping.length-2)continue;
    rows.push(values);
  }
  return rows;
}

function archiveNormalizeOcrCell(value,mode,column){
  let str=String(value??'').trim().replace(/[₺\s]/g,'').replace(/[−–]/g,'-');
  str=str.replace(/^[^\d-]+|[^\d.,]+$/g,'');
  if(!str)return '';
  // These particular monthly templates print fixed decimals in the source.
  // Recover an omitted comma only where the source column has a fixed scale.
  if(mode==='debt'&&/^\d+$/.test(str)){
    const places=column===1||column===4?2:column===2?1:0;
    if(places&&str.length>places){
      str=str.slice(0,-places)+','+str.slice(-places);
    }
  }
  return str;
}

async function pdfArchiveTables(file,mode,progress){
  const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/';
  const pdfjs=await import(base+'pdf.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc=base+'pdf.worker.mjs';
  const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let worker;
  try{
    if(pdf.numPages>24)throw new Error('Bu dosyayı en fazla 24 sayfalık parçalar halinde yükleyin.');
    const result=[];
    const auto=mode==='auto';
    let metadata=null;
    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      const page=await pdf.getPage(pageNo);
      const viewport=page.getViewport({scale:2600/page.getViewport({scale:1}).height});
      const pageImage=document.createElement('canvas');
      pageImage.width=Math.ceil(viewport.width);pageImage.height=Math.ceil(viewport.height);
      const pageCtx=pageImage.getContext('2d',{willReadFrequently:true});
      await page.render({canvasContext:pageCtx,viewport}).promise;
      const ys=pdfGridLines(pageImage,false), xs=pdfGridLines(pageImage,true);
      const pageMode=xs.length===9?'debt':xs.length===11?'meter':'';
      if(auto&&pageNo===1&&pageMode)mode=pageMode;
      const expected=mode==='debt'?9:11;
      if(xs.length!==expected||ys.length<5)throw new Error('Sayfa '+pageNo+' örnek aylık rapor düzeniyle eşleşmedi.');
      // Digitally generated PDFs contain precise text. Prefer it over OCR, which drops commas.
      const nativeText=await page.getTextContent();
      const nativeRows=nativeArchivePageRows(page,nativeText,mode,xs,ys,viewport);
      if(nativeRows.length>=Math.min(20,Math.max(1,ys.length-5))){
        const raw=nativeText.items.map(t=>t.str).join(' ');
        if(auto){
          const info=pdfArchiveMetadata(raw,raw);
          if(!metadata)metadata=info;
          else if(!info.month||metadata.month!==info.month||metadata.due!==info.due)
            throw new Error('Dosyanın sayfalarında dönem veya vade farklı.');
        }
        result.push(...nativeRows);
        progress('PDF metin katmanından '+nativeRows.length+' daire doğru rakamlarla okundu.');
        continue;
      }
      if(!window.Tesseract)throw new Error('Taranmış PDF için görüntü okuyucusu yüklenemedi.');
      worker ||= await Tesseract.createWorker('eng');
      if(auto){
        const info=await readPdfArchiveMetadata(worker,pageImage,xs,ys);
        if(!metadata)metadata=info;
        else if(!info.month||metadata.month!==info.month||metadata.due!==info.due)
          throw new Error('Dosyanın sayfalarında dönem veya vade farklı. Aylara göre ayrı PDF yükleyin.');
      }
      await worker.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:'0123456789.,'});
      const rows=ys.slice(1,-1).map((y,i)=>[ys[i+1],ys[i+2]]).filter(([a,b])=>b-a>=18);
      const mapping=mode==='debt'?[0,1,2,3,4,6,7]:[0,7,8,4,5,1,2,3];
      const columns=[];
      for(const [index,col] of mapping.entries()){
        progress('PDF sayfa '+pageNo+'/'+pdf.numPages+' · sütun '+(index+1)+'/'+mapping.length);
        const strip=document.createElement('canvas'), stride=72;
        strip.width=xs[col+1]-xs[col]+22;strip.height=rows.length*stride;
        const ctx=strip.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,strip.width,strip.height);
        for(const [i,[top,bottom]] of rows.entries()){
          // Keep the full value: the previous currency-symbol trimming could remove
          // the hundreds digit (e.g. 430,02 became 30,02).
          const left=xs[col]+7;
          const right=xs[col+1]-7,height=bottom-top-12;
          ctx.drawImage(pageImage,left,top+6,right-left,height,10,i*stride+12,right-left,48);
          if(mode==='debt'&&col!==0){
            // Monetary cells begin with a printed ₺ sign. Tesseract may turn this
            // into 4/1/7 (₺430,02 -> 4430,02). Mask ONLY its glyph in pixels,
            // before OCR. The sign is 17px in normal face, 24px in bold totals
            // at this renderer's 2600px page height. Never remove a numeral
            // from the OCR text based on its value.
            const ink=ctx.getImageData(10,i*stride+12,right-left,48);
            let glyphX=-1;
            for(let x=0;x<ink.width;x++){
              let n=0;
              for(let y=0;y<ink.height;y++){
                const k=4*(y*ink.width+x);
                if(ink.data[k]+ink.data[k+1]+ink.data[k+2]<405)n++;
              }
              if(n>=2){glyphX=x;break;}
            }
            if(glyphX>=0){
              ctx.fillStyle='#fff';
              ctx.fillRect(10+glyphX,i*stride+12,(col===7?24:17),48);
            }
          }
        }
        const {data}=await worker.recognize(strip);
        const parts=Array.from({length:rows.length},()=>[]);
        for(const w of data.words||[]){
          const i=Math.floor((w.bbox.y0+w.bbox.y1)/2/stride);
          if(parts[i])parts[i].push(w);
        }
        columns.push(parts.map(group=>group.sort((a,b)=>a.bbox.x0-b.bbox.x0).map(w=>w.text).join('').replace(/^[.,]+|[.,]+$/g,'')));
      }
      // The first band is the report header. The last band is the payment-date footer.
      const headerBands=mode==='debt'?0:1;
      const extracted=rows.slice(headerBands,-1).map((_,i)=>columns.map(column=>column[i+headerBands]));
      if(extracted.every(row=>!row.slice(1).some(Boolean)))throw new Error('PDF sayfa '+pageNo+' okunamadı.');
      result.push(...extracted.map(row=>[row[0]?('D'+row[0].padStart(2,'0')):'',
        ...row.slice(1).map((cell,i)=>archiveNormalizeOcrCell(cell,mode,i+1))]));
    }
    return auto?{mode,...metadata,rows:result}:result;
  }finally{
    if(worker)await worker.terminate();
    await pdf.destroy();
  }
}
function pdfArchiveMetadata(header,footer){
  const months=['OCAK','SUBAT','MART','NISAN','MAYIS','HAZIRAN','TEMMUZ','AGUSTOS','EYLUL','EKIM','KASIM','ARALIK'];
  const text=sheetKey(header).replace(/\s+/g,' ');
  const named=new RegExp('\\b('+months.join('|')+')\\s+(20\\d{2})\\b').exec(text);
  const numeric=/\b(20\d{2})\s+(0?[1-9]|1[0-2])\b/.exec(text);
  const month=named?named[2]+'-'+String(months.indexOf(named[1])+1).padStart(2,'0'):
    numeric?numeric[1]+'-'+numeric[2].padStart(2,'0'):'';
  const date=[...String(footer).matchAll(/\b\d{1,2}\s*[./-]\s*\d{1,2}\s*[./-]\s*20\d{2}\b/g)]
    .map(match=>excelDateToISO(match[0].replace(/\s+/g,''))).filter(Boolean);
  return {month,due:[...new Set(date)].length===1?date[0]:''};
}
async function readPdfArchiveMetadata(worker,pageImage,xs,ys){
  await worker.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:''});
  const recognize=async (x,y,w,h)=>{
    const canvas=document.createElement('canvas');
    canvas.width=w+24;canvas.height=h+24;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(pageImage,x,y,w,h,12,12,w,h);
    return (await worker.recognize(canvas)).data.text;
  };
  const top=ys[0]+5, bottom=xs.length===9?ys[1]-5:ys[2]-5;
  const header=await recognize(xs[0]+5,top,xs[1]-xs[0]-10,bottom-top);
  const footer=await recognize(xs[0]+5,ys.at(-2)+5,xs.at(-1)-xs[0]-10,ys.at(-1)-ys.at(-2)-10);
  return pdfArchiveMetadata(header,footer);
}
function automaticPdfRecord(document,filename){
  const {mode,month,due}=document;
  if(!month||month<'2024-01'||month>todayISO().slice(0,7))throw new Error('PDF başlığında geçerli bir dönem okunamadı.');
  if(mode==='debt'&&!due)throw new Error('PDF’de son ödeme tarihi okunamadı.');
  if(due&&due<month+'-01')throw new Error('PDF’de son ödeme tarihi dönem başlangıcından önce.');
  const rows=document.rows.map(r=>[...r]), warnings=[];
  // The building manager confirmed this one mislabeled row in the August 2026 meter report.
  const augustOrder=mode==='meter'&&month==='2026-08'&&rows.length===33&&
    rows.every((r,i)=>debtUnit(r[0])?.code==='D'+String(i===24?30:i+1).padStart(2,'0'));
  if(augustOrder){rows[24][0]='D25';warnings.push('Ağustos 2026’daki teyitli Daire 25 etiketi düzeltildi.');}
  const seen=new Set();
  if(!rows.length)throw new Error('PDF’de daire satırı bulunamadı.');
  for(const [i,row] of rows.entries()){
    const room=debtUnit(row[0]);
    if(!room||seen.has(room.id))throw new Error((i+1)+'. veri satırı · '+(row[0]||'Daire numarası boş')+
      (room?' tekrarlanıyor.':' sisteme kayıtlı bir daireyle eşleşmiyor.'));
    seen.add(room.id);
  }
  const hasNumber=value=>{const amount=spreadsheetAmount(value);return amount!==null&&amount>=0;};
  const columns=[...archiveColumns[mode]];
  if(mode==='debt'){
    let rounding=0;
    for(const row of rows){
      if(row.length!==7||!row.slice(1).every(hasNumber))throw new Error(row[0]+' · Bir borç tutarı okunamadı.');
      const calculated=row.slice(1,6).reduce((sum,v)=>sum+debtCents(spreadsheetAmount(v)),0);
      const shown=debtCents(spreadsheetAmount(row[6]));
      if(Math.abs(shown-calculated)>=100)throw new Error(row[0]+' · Kalemler '+trMoney2(calculated/100)+', PDF toplamı '+trMoney2(shown/100)+'.');
      if(shown!==calculated)rounding++;
    }
    if(rounding)warnings.push(rounding+' dairede PDF toplamı ile kuruşlu kalemler arasında 1 TL’den az yuvarlama farkı var. Önizlemede ayrı kalem olarak gösterilecek.');
  }else{
    let skippedGas=0;
    for(const row of rows){
      if(row.length!==8||!row.slice(1,5).every(v=>meterCell(v,1)!==null))
        throw new Error(row[0]+' · Bir su endeksi okunamadı.');
      const previous=meterCell(row[5],1),current=meterCell(row[6],1),reported=spreadsheetAmount(row[7]);
      if(previous===null||current===null||current<previous){
        if(row.slice(5).some(Boolean))skippedGas++;
        row[5]='';row[6]='';row[7]='';
      }else{
        const calculated=(current-previous)/1000;
        if(reported===null||Math.abs(reported-calculated)>0.005)skippedGas++;
        row[7]=calculated.toFixed(3).replace('.',',');
      }
    }
    if(skippedGas)warnings.push(skippedGas+' gaz satırında PDF’nin tüketim sütunu endekslerle uyuşmuyor. Endeks farkından hesaplanan değerler önizlemede gösterilir.');
  }
  return {context:{mode,month,due,scale:1,filename},sheets:[[columns,...rows]],warnings};
}
function applyArchiveReadings(readings){
  for(const e of readings){
    let p=state.periods.find(p=>p.month===e.p.month);
    if(!p){p=e.p;state.periods.push(p);}
    upsertMeterReading(e.unit,p,e.type,e.previous,e.current,{source:'historical_import',sourceFile:e.filename,readAt:null});
  }
  return readings.length;
}

function planAutomaticPdfs(records){
  const groups=new Map(),ready=[],held=new Map();
  for(const record of [...records].sort((a,b)=>a.context.month.localeCompare(b.context.month))){
    const key=record.context.month+'|'+record.context.mode;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(record);
  }
  for(const group of groups.values()){
    const candidate=collectArchiveBatch([...ready,...group]);
    if(candidate.errors.length)group.forEach(record=>held.set(record,candidate.errors));
    else ready.push(...group);
  }
  return {plan:collectArchiveBatch(ready),ready,held};
}
async function readArchivePdfs(files,progress){
  const entries=[];
  for(const [i,file] of files.entries()){
    const status=label=>progress((i+1)+'/'+files.length+' · '+file.name+' · '+label);
    const entry={file};
    entries.push(entry);
    try{
      status('Okunuyor…');
      entry.doc=await pdfArchiveTables(file,'auto',status);
      entry.record=automaticPdfRecord(entry.doc,file.name);
    }catch(error){entry.error=error.message;
      if(entry.doc&&!entry.record)entry.error+=' · PDF okundu. “Belgeyi düzelt” ile daire satırını düzeltip aktarabilirsiniz.';
    }
  }
  return entries;
}

function debtResponsibilityOptions(unitId,month){
  const start=month+'-01', end=monthEnd(month);
  const all=unitRelationships(unitId);
  const overlaps=({r})=>(r.startDate||r.endDate)&&(!r.startDate||r.startDate<=end)&&(!r.endDate||r.endDate>=start);
  return [...all].sort((a,b)=>Number(!!overlaps(b))-Number(!!overlaps(a))).map(({r,p})=>({id:p.id,
    label:p.name+' · '+relRoleLabel(r.role)+' · '+(r.startDate||'Başlangıç yok')+' – '+(r.endDate||'Bitiş yok'),
    relevant:!!overlaps({r})}));
}
function defaultDebtPerson(e){
  const relevant=unitRelationships(e.unit.id).filter(({r})=>(r.startDate||r.endDate)&&
    (!r.startDate||r.startDate<=monthEnd(e.month))&&(!r.endDate||r.endDate>=e.month+'-01'));
  const tenants=relevant.filter(({r})=>['tenant','occupant'].includes(r.role));
  const people=[...new Set((tenants.length?tenants:relevant).map(({p})=>p.id))];
  const wholeMonth=(tenants.length?tenants:relevant).some(({r})=>r.startDate&&r.startDate<=e.month+'-01'&&(!r.endDate||r.endDate>=monthEnd(e.month)));
  return people.length===1&&wholeMonth?people[0]:'';
}
function debtAllocationKey(e){return [e.month,e.unit.id,e.type].join('|')}
function debtCents(amount){return Math.round(Number(amount)*100)}
function debtSplitRow(e,personId='',amount=''){
  const options=debtResponsibilityOptions(e.unit.id,e.month);
  const seen=new Set();
  const dropdown=options.filter(o=>!seen.has(o.id)&&seen.add(o.id)).map(o=>'<option value="'+esc(o.id)+'"'+(o.id===personId?' selected':'')+'>'+esc((o.relevant?'':'Diğer dönem · ')+o.label)+'</option>').join('');
  return '<div class="actions" data-split><label>Sorumlu<select data-person><option value="">Daire hesabı</option>'+dropdown+'</select></label>'+
    '<label>Tutar (TL)<input data-amount type="number" min="'+(e.type==='rounding_adjustment'?'-0.99':'0.01')+'" step="0.01" value="'+esc(amount)+'"></label>'+
    '<button type="button" data-remove>Payı kaldır</button></div>';
}
function bindDebtSplits(root,entries){
  root.querySelectorAll('[data-allocation]').forEach((el,i)=>{
    const e=entries[i], parts=el.querySelector('[data-parts]');
    const old=e.existingAllocation||[];
    const originalTotal=old.reduce((n,p)=>n+debtCents(p.amount),0);
    const desired=debtCents(e.amount);
    let soFar=0;
    const distributed=old.map((p,i)=>{
      const cents=i===old.length-1?desired-soFar:originalTotal?Math.round(desired*debtCents(p.amount)/originalTotal):0;
      soFar+=cents;return {...p,amount:cents/100};
    });
    parts.innerHTML=old.length?distributed.map(p=>debtSplitRow(e,p.personId||'',p.amount)).join(''):debtSplitRow(e,defaultDebtPerson(e),e.amount);
    el.querySelector('[data-add]').addEventListener('click',()=>{
      const assigned=[...parts.querySelectorAll('[data-amount]')].reduce((n,input)=>n+debtCents(input.value),0);
      const remainder=debtCents(e.amount)-assigned;
      parts.insertAdjacentHTML('beforeend',debtSplitRow(e,'',remainder!==0?(remainder/100).toFixed(2):''));
    });
    parts.addEventListener('click',event=>{
      const remove=event.target.closest('[data-remove]');
      if(remove&&parts.children.length>1)remove.closest('[data-split]').remove();
    });
  });
}
function readDebtSplits(root,entries){
  const selections=new Map();
  root.querySelectorAll('[data-allocation]').forEach((el,i)=>{
    const e=entries[i], shares=[...el.querySelectorAll('[data-split]')].map(part=>({
      personId:part.querySelector('[data-person]').value||null,
      amount:Number(part.querySelector('[data-amount]').value),
    }));
    const allowed=new Set(debtResponsibilityOptions(e.unit.id,e.month).map(o=>o.id));
    if(shares.some(p=>!Number.isFinite(p.amount)||(e.type==='rounding_adjustment'?p.amount===0:p.amount<=0)||Math.abs(p.amount*100-debtCents(p.amount))>1e-6||(p.personId&&!allowed.has(p.personId)))||
       new Set(shares.map(p=>p.personId)).size!==shares.length||shares.reduce((sum,p)=>sum+debtCents(p.amount),0)!==debtCents(e.amount)){
      el.open=true;el.closest('[data-debt-allocation-list]')?.setAttribute('open','');el.scrollIntoView({block:'center'});
      throw new Error(e.unit.label+' · '+e.month+' · '+HISTORICAL_DEBT_TYPES[e.type]+': kişi başına tek pay girin. Paylar '+trMoney2(e.amount)+' etmeli.');
    }
    selections.set(debtAllocationKey(e),shares);
  });
  return selections;
}
function archiveDebtPlan(entries){
  const accepted=[],errors=[],seen=new Map();let repeated=0,corrected=0;
  for(const e of entries){
    const key=debtAllocationKey(e),p=state.periods.find(p=>p.month===e.month);
    const duplicate=seen.get(key);
    if(duplicate){
      if(duplicate.due===e.due&&debtCents(duplicate.amount)===debtCents(e.amount))repeated++;
      else errors.push(e.unit.label+' · '+e.month+' · '+HISTORICAL_DEBT_TYPES[e.type]+' PDF dosyaları kendi aralarında farklı.');
      continue;
    }
    if([...seen.values()].some(other=>other.unit.id===e.unit.id&&other.month===e.month&&debtCategoriesOverlap(other.type,e.type))){
      errors.push(e.unit.label+' · '+e.month+' · toplam su ve ayrı su kalemleri çakışıyor.');continue;
    }
    seen.set(key,e);
    if(!unit(e.unit.id)){errors.push(e.unit.label+' sisteme kayıtlı değil.');continue;}
    const matched=state.charges.filter(c=>c.periodId===p?.id&&c.unitId===e.unit.id&&debtCategoriesOverlap(c.type,e.type));
    if(!matched.length){accepted.push(e);continue;}
    const total=matched.reduce((sum,c)=>sum+debtCents(c.amount),0);
    const exact=matched.every(c=>c.type===e.type&&c.dueDate===e.due&&c.source==='legacy_manual')&&total===debtCents(e.amount);
    // Never alter a paid charge, an auto-calculated charge or a different debt type.
    const paid=state.payments.some(pay=>matched.some(c=>c.id===pay.chargeId||'late_'+c.id===pay.chargeId));
    if(!matched.every(c=>c.source==='legacy_manual'&&c.type===e.type)){
      errors.push(e.unit.label+' · '+HISTORICAL_DEBT_TYPES[e.type]+' mevcut kaydı PDF aktarımı dışında oluşturulmuş. Güvenli otomatik düzeltme yapılamaz.');continue;
    }
    if(paid){
      if(exact){repeated++;continue;}
      errors.push(e.unit.label+' · '+HISTORICAL_DEBT_TYPES[e.type]+' için ödeme bağlantısı var; kayıt otomatik değiştirilemez. Önce hareketi kontrol edin.');continue;
    }
    if(exact){repeated++;continue;}
    corrected++;
    accepted.push({...e,needsCorrection:true,previousAmount:total/100,
      existingAllocation:matched.map(c=>({id:c.id,personId:c.personId,amount:c.amount,dueDate:c.dueDate}))});
  }
  return {accepted,errors,repeated,corrected};
}
function applyArchiveDebtSplits(entries,selections,preview){
  const plan=archiveDebtPlan(entries);
  if(plan.errors.length)throw new Error(plan.errors[0]);
  let added=0;
  for(const e of plan.accepted){
    const shares=selections.get(debtAllocationKey(e));
    const before=preview?.find(p=>debtAllocationKey(p)===debtAllocationKey(e));
    if(!shares||(preview&&(!before||JSON.stringify(before.existingAllocation||[])!==JSON.stringify(e.existingAllocation||[])))) {
      throw new Error('Borç önizlemesi değişti. Dosyaları tekrar kontrol edin.');
    }
    const allowed=new Set(debtResponsibilityOptions(e.unit.id,e.month).map(o=>o.id));
    if(shares.some(p=>p.personId&&!allowed.has(p.personId)))throw new Error('Kişi ilişkileri değişti. Önizlemeyi yenileyin.');
    let p=state.periods.find(p=>p.month===e.month);
    if(!p){
      p={id:uid('p'),month:e.month,dueDate:e.due,status:'locked',legacyOnly:true,boilerActive:false,dues:0};
      state.periods.push(p);
    }
    const existing=e.existingAllocation||[];
    if(existing.length===shares.length&&shares.every(s=>existing.some(c=>(c.personId||null)===s.personId&&debtCents(c.amount)===debtCents(s.amount)&&c.dueDate===e.due)))continue;
    // Keep unchanged shares and their record IDs. Any charge linked to a payment was excluded above.
    const keep=new Set();
    for(const share of shares){
      const old=existing.find(c=>(c.personId||null)===share.personId&&!keep.has(c.id));
      if(old){
        keep.add(old.id);
        const charge=state.charges.find(c=>c.id===old.id);
        charge.amount=share.amount;charge.rawAmount=share.amount;charge.dueDate=e.due;
      }else {
        state.charges.push({id:uid('c'),periodId:p.id,unitId:e.unit.id,personId:share.personId,type:e.type,
          label:HISTORICAL_DEBT_TYPES[e.type],rawAmount:share.amount,amount:share.amount,dueDate:e.due,source:'legacy_manual',note:e.note||''});
      }
    }
    const removed=new Set(existing.filter(c=>!keep.has(c.id)).map(c=>c.id));
    state.charges=state.charges.filter(c=>!removed.has(c.id));
    added++;
  }
  if(preview&&plan.accepted.length!==preview.length)throw new Error('Bir borç ödemeyle eşleşti veya değişti. Önizlemeyi yenileyin.');
  return added;
}

function collectArchiveBatch(records){
  const debtEntries=[],meterGroups=new Map(),errors=[];
  let otherPeriods=0;
  for(const {context,sheets} of records){
    if(context.mode==='debt'){
      const part=parseHistoricalDebtSheet(sheets,context.month,context.due);
      const chosen=part.entries;
      otherPeriods+=chosen.filter(e=>e.month!==context.month).length;
      chosen.forEach(e=>debtEntries.push({...e,note:e.note||context.filename}));
      errors.push(...part.errors.map(e=>context.filename+' · '+e));
      continue;
    }
    const p=state.periods.find(p=>p.month===context.month)||{id:'archive_'+context.month,month:context.month,legacyOnly:true,
      status:'locked',dueDate:context.due||monthEnd(context.month),dues:0,boilerActive:false};
    const data=context.omitGas?sheets.map(sheet=>{
      const header=sheet.find(row=>row.some(c=>formMeterType(c)))||[];
      return sheet.map(row=>row.map((cell,index)=>formMeterType(header[index])==='gas'?'':cell));
    }):sheets;
    const part=readFormMeters(data,p,context.scale,{historical:true});
    if(!meterGroups.has(p.month))meterGroups.set(p.month,{p,entries:[]});
    meterGroups.get(p.month).entries.push(...part.entries.map(e=>({...e,filename:context.filename,time:''})));
    errors.push(...part.errors.map(e=>context.filename+' · '+e));
  }
  const debt=archiveDebtPlan(debtEntries);
  errors.push(...debt.errors);
  const readings=[],savedPeriods=state.periods,savedReadings=state.meterReadings;
  let repeated=debt.repeated;
  try{
    state.periods=[...savedPeriods];state.meterReadings=[...savedReadings];
    for(const {p,entries} of [...meterGroups.values()].sort((a,b)=>a.p.month.localeCompare(b.p.month))){
      const current=prepareFormMeters(p,entries,{historical:true});
      errors.push(...current.errors.map(e=>p.month+' · '+e));repeated+=current.repeated;
      if(!state.periods.some(x=>x.month===p.month))state.periods.push(p);
      current.accepted.forEach(e=>{
        readings.push({p,...e});
        state.meterReadings.push({periodId:p.id,unitId:e.unit.id,type:e.type,current:e.current});
      });
    }
  }finally{state.periods=savedPeriods;state.meterReadings=savedReadings;}
  return {debtEntries,debt:debt.accepted,readings,repeated,errors,otherPeriods,corrected:debt.corrected};
}

const FORM_METER_LABELS={cold:'Soğuk su',hot:'Sıcak su',gas:'Doğalgaz'};
function formMeterType(value){
  const key=sheetKey(value);
  if(/\bSOGUK\b/.test(key)&&/\bSU\b/.test(key))return 'cold';
  if(/\bSICAK\b/.test(key)&&/\bSU\b/.test(key))return 'hot';
  if(/\b(?:GAZ|DOGALGAZ|KALORIMETRE|ISI SAYACI)\b/.test(key))return 'gas';
}
function meterCell(value,scale){
  const text=String(value??'').trim().replace(/\s/g,'').replace(',','.');
  if(!/^\d+(?:\.\d{1,3})?$/.test(text))return null;
  const number=Number(text)*scale;

}
function readFormMeters(sheets,p,scale,{historical=false,requirePeriod=false}={}){
  const entries=[],errors=[];
  let found=false;
  const unitLabels=['DAIRE','DAIRE NO','DAIRE NUMARASI','DAIRE KODU','DAIRE SECINIZ','BOLUM','BOLUM KODU'];
  const oldReading=header=>/\b(ONCEKI|ILK|BASLANGIC|ESKI)\b/.test(sheetKey(header));
  for(const rows of sheets){
    const hi=rows.findIndex(row=>row.some(v=>unitLabels.includes(sheetKey(v))||/\b(?:DAIRE|D) ?\d{1,2}\b/.test(sheetKey(v)))&&row.some(v=>formMeterType(v)));
    if(hi<0)continue;
    found=true;
    const header=rows[hi].map(sheetKey);
    const column=(...names)=>header.findIndex(key=>names.includes(key));
    const ui=column(...unitLabels),periodIndex=column('DONEM','OKUMA DONEMI','SAYAC DONEMI','AY','HANGI AYIN DEGERLERI GIRILIYOR');
    if(requirePeriod&&periodIndex<0){errors.push('Dönem sütunu bulunamadı.');continue;}
    const timeIndex=column('ZAMAN DAMGASI','TIMESTAMP','OKUMA TARIHI','TARIH','GONDERIM TARIHI');
    const reportedGas=historical?column('GAZ TUKETIMI','DOGALGAZ TUKETIMI'):-1;
    const cols=header.map((name,index)=>{
      const code=name.match(/\b(?:DAIRE(?: NO)?|D) ?(\d{1,2})\b/);
      return {index,type:!historical&&/\b(FATURA|BEDEL|TUTAR|ODEME)\b/.test(name)?null:formMeterType(name),unit:ui<0&&code?debtUnit(code[1]):null,previous:oldReading(name)};
    }).filter(c=>c.type&&c.index!==reportedGas&&(ui>=0||c.unit));
    rows.slice(hi+1).forEach((row,index)=>{
      if(!row.some(v=>String(v??'').trim()))return;
      const label='Satır '+(hi+index+2),time=spreadsheetDateKey(row[timeIndex]);
      if(requirePeriod&&!String(row[periodIndex]??'').trim()){errors.push(label+' · dönem boş.');return;}
      if(periodIndex>=0&&String(row[periodIndex]??'').trim()){
        const rowMonth=monthFromCell(row[periodIndex]);
        if(!rowMonth){errors.push(label+' · dönem geçersiz.');return;}
        if(rowMonth!==p.month)return;
      }
      const u=ui>=0?debtUnit(row[ui]):null;
      if(ui>=0&&u?.type!=='apartment'){errors.push(label+' · daire tanınmadı.');return;}
      for(const c of cols.filter(item=>!item.previous)){
        const value=row[c.index];
        if(!String(value??'').trim())continue;
        const target=u||c.unit,current=meterCell(value,scale);
        const previousColumn=cols.find(x=>x.previous&&x.type===c.type&&x.unit===c.unit);
        const previousText=previousColumn?row[previousColumn.index]:'';
        const previous=String(previousText??'').trim()?meterCell(previousText,scale):null;
        if(current===null||(String(previousText??'').trim()&&previous===null)){
          errors.push(label+' · '+target.label+' '+FORM_METER_LABELS[c.type]+' endeksi geçersiz.');continue;
        }
        if(!historical&&c.type==='gas'&&reportedGas>=0&&String(row[reportedGas]??'').trim()){
          const printed=spreadsheetAmount(row[reportedGas]);
          if(printed===null||previous===null||Math.abs(printed-(current-previous)/1000)>0.005){
            errors.push(label+' · '+target.label+' gaz tüketimi endeks farkıyla uyuşmuyor. Gazı hariç bırakabilir veya kaynağı kontrol edebilirsiniz.');continue;
          }
        }
        entries.push({unit:target,type:c.type,current,previous,time,label});
      }
    });
  }
  if(!found)errors.push('Dosyada daire ve soğuk su, sıcak su veya doğalgaz sayaç başlıkları bulunamadı.');
  return {entries,errors};
}
function lastKnownMeterReading(p,entry,adjacentOnly=false){
  const [year,month]=p.month.split('-').map(Number);
  const previousMonth=new Date(Date.UTC(year,month-2,1)).toISOString().slice(0,7);
  const older=new Map(state.periods.filter(x=>adjacentOnly?x.month===previousMonth:x.month<p.month).map(x=>[x.id,x.month]));
  return state.meterReadings.filter(r=>r.unitId===entry.unit.id&&r.type===entry.type&&older.has(r.periodId)&&Number.isFinite(r.current))
    .sort((a,b)=>older.get(b.periodId).localeCompare(older.get(a.periodId)))[0]?.current??null;
}
function prepareFormMeters(p,entries,{historical=false}={}){
  const errors=[],accepted=[],latest=new Map(),conflicts=new Set();
  let repeated=0;
  for(const e of entries){
    const key=e.unit.id+'|'+e.type;
    const previous=latest.get(key);
    if(!previous||e.time>previous.time){
      latest.set(key,e);conflicts.delete(key);continue;
    }
    if(e.time===previous.time&&(e.current!==previous.current||e.previous!==previous.previous))conflicts.add(key);
  }
  for(const [key,e] of latest){
    const label=e.unit.label+' · '+FORM_METER_LABELS[e.type];
    if(unit(e.unit.id)?.type!=='apartment'){errors.push(label+' için daire kaydı bulunamadı.');continue;}
    if(conflicts.has(key)){errors.push(label+' için aynı zamanda farklı yanıtlar var.');continue;}
    const existing=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===e.unit.id&&r.type===e.type);
    if(existing&&existing.current===e.current&&(e.previous===null||e.previous===existing.previous)){repeated++;continue;}
    if(existing){errors.push(label+' için IBRAKAT’ta farklı bir endeks kayıtlı. PDF '+(e.previous??'—')+' → '+e.current+', kayıtlı '+(existing.previous??'—')+' → '+existing.current+'.');continue;}
    const known=lastKnownMeterReading(p,e,historical&&e.previous!==null);
    if(known!==null&&e.previous!==null&&known!==e.previous){errors.push(label+' önceki endeksle uyuşmuyor. PDF '+e.previous+', kayıtlı '+known+'.');continue;}
    const previous=e.previous??known;
    if(previous===null){errors.push(label+' için önceki gerçek endeks gerekli.');continue;}
    if(e.current<previous){errors.push(label+' yeni endeks önceki değerden düşük.');continue;}
    accepted.push({...e,previous});
  }
  return {accepted,errors,repeated};
}

function collectGoogleMeterPlans(sheets){
  const plan={items:[],repeated:0,errors:[]};
  for(const p of state.periods.filter(x=>x.status==='draft'&&!x.legacyOnly)){
    const parsed=readFormMeters(sheets,p,1,{requirePeriod:true});
    const result=prepareFormMeters(p,parsed.entries);
    plan.items.push(...result.accepted.map(e=>({period:p,...e})));

async function syncGoogleMeterRows(silent=false){

    if(!publicSb||!authSession)throw new Error('Bulut oturumu gerekli.');

function nextISODate(date){const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}

function lateFeeForBaseCharge(c,asOf=todayISO()){

  for(const pay of pays.filter(x=>resetAt && (x.date||'')<=resetAt)){remaining-=Math.min(remaining,Number(pay.amount||0)); if(remaining<=0)return 0;}
  const startDate=(resetAt && resetAt>c.dueDate)?resetAt:c.dueDate;

  const calc=(amt,end)=>{if(!end||end<=startDate||amt<=0)return 0;const days=Math.max(0,Math.round((new Date(end+'T00:00:00')-start)/86400000));if(days<=0)return 0;return mode==='monthly'?amt*(rate/100)*Math.ceil(days/30):amt*(rate/100)*(days/30)};

}

function parseTRNumber(v){
  if(v==null)return null;let x=String(v).replace(/\s/g,'').replace(/TL|₺/gi,'').replace(/[^0-9,.-]/g,'');
  if(!x)return null;
  if(x.includes(',')&&x.includes('.')) x=x.replace(/\./g,'').replace(',','.');
  else if(x.includes(',')) x=x.replace(',','.');
  const n=Number(x);return Number.isFinite(n)?n:null;
}
function ocrFindNumber(lines,labels){
  for(const line of lines){const up=normTR(line);if(labels.some(l=>up.includes(l))){const nums=line.match(/\d{1,3}(?:\.\d{3})*(?:,\d+)?|\d+(?:[.,]\d+)?/g)||[];if(nums.length){const n=parseTRNumber(nums[nums.length-1]);if(n!=null)return n}}}return null;
}
function parseInvoiceOcr(text,type){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const out={};
  out.amount=ocrFindNumber(lines,['ODENECEK TUTAR','TOPLAM TUTAR','FATURA TUTARI','ODENECEK TOPLAM','TOPLAM BORC']);
  if(type==='water'){
    out.invoiceConsumption=ocrFindNumber(lines,['TUKETIM M3','TUKETIM (M3)','SU TUKETIMI','FATURA TUKETIMI','TOPLAM TUKETIM']);
    out.wasteCollection=ocrFindNumber(lines,['KATI ATIK TOPLAMA','EVSEL KATI ATIK TOPLAMA']);
    out.wasteDisposal=ocrFindNumber(lines,['KATI ATIK BERTARAF','EVSEL KATI ATIK BERTARAF']);
  }
  if(type==='gas'){
    out.invoiceConsumption=ocrFindNumber(lines,['HAM TUKETIM','TUKETIM M3','TUKETIM']);
    out.correctedConsumption=ocrFindNumber(lines,['DUZELTILMIS TUKETIM','DUZELTILMIS HACIM']);
  }
  return out;
}
async function runInvoiceOcr(file){
  const st=$('#ocrStatus');
  if(!window.Tesseract){st.className='notice bad';st.textContent='OCR modülü yüklenemedi. Alanları elle doldurabilirsiniz.';return;}
  st.className='notice';st.innerHTML='<b>Fotoğraf okunuyor…</b> %0';
  try{
    const result=await Tesseract.recognize(file,'tur+eng',{logger:m=>{if(m.status==='recognizing text'&&st)st.innerHTML=`<b>Fotoğraf okunuyor…</b> %${Math.round((m.progress||0)*100)}`}});
    lastInvoiceOcrText=result?.data?.text||'';
    const raw=$('#ocrRaw');if(raw)raw.textContent=lastInvoiceOcrText;
    const parsed=parseInvoiceOcr(lastInvoiceOcrText,$('#invType').value);
    let filled=[];
    const set=(id,val,label)=>{if(val!=null&&Number.isFinite(val)){const e=$(id);if(e){e.value=val;filled.push(label);e.style.background='#fff8db';e.style.borderColor='#d89b00'}}};
    set('#invAmount',parsed.amount,'ödenecek toplam');
    if($('#invType').value==='water'){set('#invConsumption',parsed.invoiceConsumption,'tüketim');set('#invWasteCollection',parsed.wasteCollection,'katı atık toplama');set('#invWasteDisposal',parsed.wasteDisposal,'katı atık bertaraf')}
    if($('#invType').value==='gas'){set('#invRawGas',parsed.invoiceConsumption,'ham tüketim');set('#invCorrectedGas',parsed.correctedConsumption,'düzeltilmiş tüketim')}
    st.className='notice warn';
    st.innerHTML=filled.length?`<b>Otomatik okuma tamamlandı.</b> Doldurulan alanlar sarı işaretlendi: ${filled.join(', ')}. Lütfen faturaya bakarak tek tek kontrol edin.`:'<b>OCR tamamlandı ancak alanlar güvenle ayrılamadı.</b> Rakamları elle girin ve faturayla kontrol edin.';
    const chk=$('#invReviewed');if(chk)chk.checked=false;
  }catch(e){console.warn(e);st.className='notice bad';st.innerHTML='<b>Fotoğraf okunamadı.</b> Alanları elle doldurabilirsiniz; kayıt yine kontrol/onay adımından geçecektir.';}
}

async function uploadStaffDocument(file,folder,recordId,month){
  if(!file||!publicSb||!authSession)return null;
  try{
    const safe=String(file.name||'belge').replace(/[^a-zA-Z0-9._-]+/g,'_');
    const path=`${month}/${folder}/${recordId}_${safe}`;
    const {error}=await publicSb.storage.from('ibra-kat-documents').upload(path,file,{upsert:true,contentType:file.type||undefined});
    if(error)throw error;
    const kind=folder==='faturalar'?'invoice':'expense';
    try{
      await authCall('staff_enqueue_drive_backup',{
        building_id:CONFIG.buildingId,storage_path:path,period_month:month,
        backup_kind:kind,record_id:recordId,original_filename:file.name||safe,mime_type:file.type||null
      },true);
    }catch(qe){console.warn('Drive yedek kuyruğu oluşturulamadı',qe)}
    return {path,mimeType:file.type||null};
  }catch(e){console.warn('Belge yüklenemedi',e);return {error:String(e?.message||e)}}
}
async function saveInvoice(approve){
  const reviewed=$('#invReviewed')?.checked;
  if(approve&&!reviewed){notify('Önce faturadaki rakamları kontrol edip onay kutusunu işaretleyin.');return}
  const t=$('#invType').value, amount=Number($('#invAmount').value);
  if(!Number.isFinite(amount)||amount<0){notify('Ödenecek toplam tutarı kontrol edin.');return}
  let rec=editingInvoiceId?state.invoices.find(x=>x.id===editingInvoiceId):null;
  if(!rec){rec={id:uid('inv'),periodId:period().id};state.invoices.push(rec)}
  const file=pendingInvoiceFile;
  Object.assign(rec,{periodId:period().id,type:t,date:$('#invDate').value,amount,status:approve?'approved':'draft',verified:!!approve,reviewedAt:approve?new Date().toISOString():null,reviewedBy:approve?(session?.label||'Kat Görevlisi'):null,fileName:file?.name||rec.fileName||null,ocrText:lastInvoiceOcrText||rec.ocrText||''});
  if(t==='water')Object.assign(rec,{invoiceConsumption:Number($('#invConsumption').value||0),wasteCollection:Number($('#invWasteCollection').value||0),wasteDisposal:Number($('#invWasteDisposal').value||0)});
  if(t==='gas')Object.assign(rec,{invoiceConsumption:Number($('#invRawGas').value||0),correctedConsumption:Number($('#invCorrectedGas').value||0)});
  if(file){
    const up=await uploadStaffDocument(file,'faturalar',rec.id,period().month);
    if(up?.path){rec.storagePath=up.path;rec.mimeType=up.mimeType;rec.driveBackupStatus='pending'}
    else if(up?.error){rec.driveBackupStatus='failed';rec.driveBackupError=up.error}
  }
  syncUtilityInvoiceExpense(rec);
  pendingInvoiceFile=null;editingInvoiceId=null;saveState();
  logAudit(approve?'Fatura kontrol edildi/onaylandı':'Fatura taslak kaydedildi',`${period().month} · ${t} · ${trMoney(rec.amount)}`);
  closeModal();render();notify(approve?'Fatura kaydedildi ve giderlere işlendi.':'Taslak kaydedildi.');
}

function bulkAutoAllocateIncome(tx){
  const match=effectiveBankMatch(tx),u=match.suggested.length===1?match.suggested[0]:null;
  if(!tx||!u||!['high','manual'].includes(match.confidence)||Number(tx.amount)<=0||txAllocated(tx.id)>0)return false;
  let remain=Number(tx.amount),bp=bankProfile(tx.bankId),matched=matchedPersonForTx(tx),opens=matched?openChargesForUnit(u,tx.id).filter(c=>chargeAccountPersonId(c)===matched):[];
  for(const c of opens){if(remain<=0.005)break;const a=Math.min(remain,c.remaining);state.payments.push({id:uid('pay'),periodId:c.periodId,unitId:u,personId:matched,amount:a,date:tx.date,description:`${bp.name} toplu otomatik eşleşme · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:c.id,reference:tx.reference});remain-=a}
  if(remain>0.005)state.payments.push({id:uid('pay'),periodId:tx.periodId||activePeriodId,unitId:u,personId:matched,amount:remain,date:tx.date,description:`${bp.name} genel ödeme / avans · ${tx.description}`,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:null,reference:tx.reference});
  tx.allocatedAmount=Number(tx.amount);return true;
}
function bulkCreateExpense(tx){
  if(!tx||Number(tx.amount)>=0||tx.expenseId)return false;
  const sel=document.getElementById(`bankCat_${tx.id}`),category=sel?.value||suggestExpenseCategory(tx.description);
  const e={id:uid('exp'),periodId:periodIdForDate(tx.date),date:tx.date,category,description:tx.description,amount:Math.abs(Number(tx.amount)),paid:true,paymentMethod:'Banka',fileName:null,bankTransactionId:tx.id,bankId:tx.bankId,bankName:bankProfile(tx.bankId).name};
  state.expenses.push(e);tx.expenseId=e.id;return true;
}
function processSelectedBankTransactions(){
  syncBankSelectionFromDOM();const ids=$('.bank-bulk-check:checked').map(x=>x.dataset.tx);if(!ids.length){notify('Önce işlenecek hareketleri seç.');return}
  let incomeCount=0,expenseCount=0,skipped=0;
  ids.forEach(id=>{const tx=state.bankTransactions.find(x=>x.id===id);if(!tx){skipped++;return}if(Number(tx.amount)>0){if(bulkAutoAllocateIncome(tx))incomeCount++;else skipped++;}else{if(bulkCreateExpense(tx))expenseCount++;else skipped++;}});
  bankSelectedIds.clear();saveState();logAudit('Toplu banka işlemi',`Tahsilat ${incomeCount} · Gider ${expenseCount} · Atlanan ${skipped}`);render();notify(`${incomeCount} tahsilat ve ${expenseCount} gider işlendi${skipped?` · ${skipped} hareket atlandı`:''}.`);
}

async function confirmBulkUnitAssignment(){
  const unitId=$('#bulkAssignUnit')?.value,personId=$('#bulkAssignPerson')?.value||null;
  if(!unitId||!unit(unitId))return notify('Hedef daire seçin.');
  const ids=bulkAssignSelectedIds.filter(id=>{
    const tx=state.bankTransactions.find(x=>x.id===id);
    return tx&&Number(tx.amount)>0&&txAllocated(id)+0.005<Number(tx.amount);
  });
  if(!ids.length)return notify('Dağıtılmamış ödeme kalmadı.');
  const sum=ids.reduce((a,id)=>{const t=state.bankTransactions.find(x=>x.id===id);return a+Math.max(0,Number(t.amount)-txAllocated(id))},0);
  if(personId&&ids.some(id=>{const t=state.bankTransactions.find(x=>x.id===id);return !state.responsibilities.some(r=>r.unitId===unitId&&r.personId===personId&&(!r.startDate||r.startDate<=t.date)&&(!r.endDate||t.date<=r.endDate))}))return notify('Bu ödemelerden bazılarının tarihi seçilen kişinin sorumluluk dönemi dışında. Kişiyi boş bırakın veya ayrı dağıtın.');
  if(!confirm(ids.length+' banka hareketinin kalan '+trMoney(sum)+' tutarı '+unit(unitId).label+' için kaydedilsin mi?'))return;
  try{
    const result=await commitSpreadsheetChange(()=>{
      if(!unit(unitId)||personId&&!state.responsibilities.some(r=>r.unitId===unitId&&r.personId===personId))throw Error('Kişi/daire bağlantısı değişmiş.');
      if(personId&&ids.some(id=>{const tx=state.bankTransactions.find(t=>t.id===id);return !tx||!state.responsibilities.some(r=>r.unitId===unitId&&r.personId===personId&&(!r.startDate||r.startDate<=tx.date)&&(!r.endDate||tx.date<=r.endDate))}))throw Error('Ödeme tarihi kişinin sorumluluk dönemi dışında.');
      let count=0,amount=0;
      for(const id of ids){
        const tx=state.bankTransactions.find(x=>x.id===id);if(!tx||Number(tx.amount)<=0)continue;
        const cents=Math.round((Number(tx.amount)-txAllocated(id))*100);if(cents<=0)continue;
        const bp=bankProfile(tx.bankId);
        state.payments.push({id:uid('pay'),periodId:periodIdForDate(tx.date)||tx.periodId||activePeriodId,unitId,personId,amount:cents/100,date:tx.date,
          description:bp.name+' · toplu daire eşleştirmesi · '+tx.description,bankId:tx.bankId,bankName:bp.name,bankAccount:bp.short,bankTransactionId:tx.id,chargeId:null,reference:tx.reference});
        tx.manualUnitId=unitId;tx.manualPersonId=personId;tx.allocatedAmount=txAllocated(id);
        count++;amount+=cents/100;
      }
      return {changed:count>0,count,amount};
    },'Banka hareketleri topluca daireye eşleştirildi',x=>unit(unitId).label+' · '+x.count+' ödeme · '+trMoney(x.amount));
    bankSelectedIds.clear();bulkAssignSelectedIds=[];closeModal();render();notify(result.count+' ödeme doğrulandı, tutar '+trMoney(result.amount));
  }catch(e){notify('Toplu eşleştirme tamamlanamadı: '+e.message)}
}

function calculatePeriod(periodId,{quiet=false}={}){
  const p=state.periods.find(x=>x.id===periodId);
  if(!p)return false;
  if(state.charges.some(c=>c.periodId===periodId&&c.splitBatchId)){
    notify('Bu dönemde kişilere paylaştırılmış borçlar var. Yeniden hesaplama onları değiştirebilir; işlem durduruldu.');return false;
  }
  if(state.meterReadings.some(r=>r.periodId===p.id&&r.source==='google_form')){
    if(!formCalculationReady(p))return false;
    if(!quiet)closeModal();
  }
  if(state.charges.some(c=>c.periodId===periodId&&['dues','cold_water','hot_water','gas','electric','late_fee'].includes(c.type)&&state.payments.some(payment=>payment.chargeId===c.id))){
    notify('Bu dönemde ödemeyle eşleşen borçlar var. Mevcut borçlar korundu.');return false;
  }
  if(p.legacyOnly||state.charges.some(c=>c.periodId===periodId&&c.source==='legacy_manual'&&c.type!=='legacy_debt')){
    notify('Bu dönemde manuel borçlar var. Çift borç oluşturmamak için otomatik hesaplama yapılmadı.');return false;
  } const apartments=state.units.filter(u=>u.type==='apartment');
  const waterInv=state.invoices.find(x=>x.periodId===p.id&&x.type==='water'&&x.status==='approved'); const gasInv=state.invoices.find(x=>x.periodId===p.id&&x.type==='gas'&&x.status==='approved'); const electricTotal=state.invoices.filter(x=>x.periodId===p.id&&x.type==='electric'&&x.status==='approved').reduce((a,x)=>a+x.amount,0);
  // Always refresh system-generated lines, preserving special assessments.
  state.charges=state.charges.filter(c=>!(c.periodId===p.id&&['dues','cold_water','hot_water','gas','electric','late_fee'].includes(c.type)));
  // Dues for all active units. The selected manager apartment is exempt only from the fixed dues for this period.
  state.units.filter(u=>u.active).forEach(u=>{const managerExempt=!!p.managerDuesExemptUnitId&&u.id===p.managerDuesExemptUnitId;const raw=managerExempt?0:p.dues*u.duesMultiplier;state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:chargeAccountPersonId({unitId:u.id,periodId:p.id,personId:null}),type:'dues',label:managerExempt?'Sabit Aidat (Yönetici Muaf)':'Sabit Aidat',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate,managerExempt});});
  if(waterInv){
    const coldTotal=apartments.reduce((a,u)=>a+(state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='cold')?.consumption||0),0);
    const hotTotal=apartments.reduce((a,u)=>a+(state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='hot')?.consumption||0),0);
    const measured=coldTotal+hotTotal; const linked=measured/(p.waterLossDivisor||12); const diff=(waterInv.invoiceConsumption||0)-measured; const common=diff-linked;
    const waterUnit=((waterInv.amount||0)-(waterInv.wasteCollection||0)-(waterInv.wasteDisposal||0))/(waterInv.invoiceConsumption||1);
    const wasteTotal=(waterInv.wasteCollection||0)+(waterInv.wasteDisposal||0);
    let hotGasUnit=0; let v40=0;
    if(gasInv&&hotTotal>0&&gasInv.amount>0){v40=(((1.2*hotTotal)*(p.boilerTemp-10))/8.25)*((gasInv.correctedConsumption||0)/gasInv.amount);hotGasUnit=v40/hotTotal;}
    apartments.forEach(u=>{
      const cold=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='cold')?.consumption||0; const hot=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='hot')?.consumption||0; const total=cold+hot;
      const linkedShare=measured>0?(total/measured)*linked:0; const commonShare=(u.sqm/TOTAL_APT_SQM)*common; const wasteShare=(u.sqm/TOTAL_APT_SQM)*wasteTotal;
      const coldRaw=(cold+linkedShare+commonShare)*waterUnit+wasteShare; const hotRaw=hot*(waterUnit+hotGasUnit);
      const pid=chargeAccountPersonId({unitId:u.id,periodId:p.id,personId:null});
      state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:pid,type:'cold_water',label:'Soğuk Su',rawAmount:coldRaw,amount:roundTL(coldRaw),dueDate:p.dueDate});
      state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:pid,type:'hot_water',label:'Sıcak Su',rawAmount:hotRaw,amount:roundTL(hotRaw),dueDate:p.dueDate});
    });
    if(gasInv){
      const pool70=gasInv.amount*(p.gasConsumptionPct/100)-v40, pool30=gasInv.amount*(p.gasSqmPct/100); const gasTotal=apartments.reduce((a,u)=>a+(state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='gas')?.consumption||0),0);
      apartments.forEach(u=>{const gc=state.meterReadings.find(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='gas')?.consumption||0; const consumptionShare=p.boilerActive?(gasTotal>0?pool70*(gc/gasTotal):0):pool70/apartments.length; const sqmShare=pool30*(u.sqm/TOTAL_APT_SQM); const raw=consumptionShare+sqmShare;state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:chargeAccountPersonId({unitId:u.id,periodId:p.id,personId:null}),type:'gas',label:'Doğalgaz',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate});});
    }
    if(electricTotal){const raw=electricTotal/apartments.length;apartments.forEach(u=>state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:chargeAccountPersonId({unitId:u.id,periodId:p.id,personId:null}),type:'electric',label:'Elektrik',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate}));}
  } else if(electricTotal){const raw=electricTotal/apartments.length;apartments.forEach(u=>state.charges.push({id:uid('c'),periodId:p.id,unitId:u.id,personId:chargeAccountPersonId({unitId:u.id,periodId:p.id,personId:null}),type:'electric',label:'Elektrik',rawAmount:raw,amount:roundTL(raw),dueDate:p.dueDate}));}
  if(!quiet){saveState();logAudit('Dönem hesaplandı',p.month);notify('Hesaplama tamamlandı. Borçlar tam TL olarak oluşturuldu.');render();}
  return true;
}

function applyLateFeeForPayment(charge, paymentDate){
  const p=state.periods.find(x=>x.id===charge.periodId); if(!p?.lateFeeEnabled||!p.lateFeeRate||!charge.dueDate||paymentDate<=charge.dueDate)return 0;
  const days=Math.ceil((new Date(paymentDate)-new Date(charge.dueDate))/86400000); if(days<=0)return 0;
  if(p.lateFeeMode==='monthly') return roundTL(charge.amount*(p.lateFeeRate/100)*Math.ceil(days/30));
  return roundTL(charge.amount*(p.lateFeeRate/100)*(days/30));
}

function meterUnitComplete(u,mode,p=period()){
  if(mode==='water'){
    const cold=state.meterReadings.some(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='cold');
    const hot=state.meterReadings.some(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='hot');
    return cold&&hot;
  }
  return state.meterReadings.some(r=>r.periodId===p.id&&r.unitId===u.id&&r.type==='gas');
}
function meterDoneCount(mode){
  const p=period(),units=meterUnits();
  return units.filter(u=>meterUnitComplete(u,mode,p)).length;
}
function meterFirstMissingIndex(mode){
  const p=period(),units=meterUnits();
  for(let i=units.length-1;i>=0;i--){
    if(!meterUnitComplete(units[i],mode,p))return i;
  }
  return units.length-1;
}

function parseMeterOcrValue(text,prev){
  const cleaned=String(text||'').toUpperCase().replace(/O/g,'0').replace(/[IL|]/g,'1');
  const groups=cleaned.match(/\d[\d\s.,]{2,12}/g)||[];
  const nums=[];
  for(const g of groups){
    const digits=g.replace(/\D/g,'');
    if(digits.length<3||digits.length>9)continue;
    const n=Number(digits);
    if(Number.isFinite(n))nums.push(n);
  }
  const unique=[...new Set(nums)];
  const prevN=Number(prev),prevLen=Math.trunc(prevN).toString().length;
  const plausible=unique.filter(n=>n>=prevN && n-prevN<=80000);
  plausible.sort((a,b)=>{
    const sa=Math.abs(Math.trunc(a).toString().length-prevLen)*50000+(a-prevN);
    const sb=Math.abs(Math.trunc(b).toString().length-prevLen)*50000+(b-prevN);
    return sa-sb;
  });
  return plausible[0]??null;
}
async function archiveMeterPhoto(file,type,u,p){

  const code=u.code||u.label||u.id;
  const path=`${p.month}/sayaclar/${code}/${type}/${Date.now()}_${safe}`;
  const {error}=await publicSb.storage.from('ibra-kat-documents').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});
  if(error)throw error;
  try{
    await authCall('staff_enqueue_drive_backup',{
      building_id:CONFIG.buildingId,storage_path:path,period_month:p.month,
      backup_kind:'meter',record_id:`${p.id}:${u.id}:${type}:${Date.now()}`,
      original_filename:file.name||safe,mime_type:file.type||'image/jpeg'
    },true);
  }catch(e){console.warn('Sayaç fotoğrafı Drive kuyruğuna alınamadı',e)}
  return path;
}
async function captureMeterPhoto(type,prev){
  const i=$('#cameraInput');i.value='';
  i.onchange=async()=>{
    const file=i.files?.[0];if(!file)return;
    const p=period(),u=meterUnits()[meterContext.index],status=meterPhotoStatusEl(type);
    if(status){status.className='small muted';status.textContent='Fotoğraf arşivleniyor…'}
    let photoPath='';
    try{
      photoPath=await archiveMeterPhoto(file,type,u,p);
      if(status){status.className='small ok';status.textContent='✓ Fotoğraf arşivlendi · sayaç okunuyor…'}
    }catch(e){
      if(status){status.className='small danger';status.textContent='Fotoğraf arşivlenemedi: '+(e.message||e)}
      notify('Fotoğraf arşivlenemedi; sayaç otomatik kaydedilmedi.');
      return;
    }
    if(!window.Tesseract){
      if(status){status.className='small warn';status.textContent='✓ Fotoğraf arşivlendi · OCR modülü yüklenemedi, değeri elle gir.'}
      return;
    }
    try{
      const result=await Tesseract.recognize(file,'eng',{logger:m=>{
        if(m.status==='recognizing text'&&status)status.textContent=`✓ Arşivlendi · sayaç okunuyor %${Math.round((m.progress||0)*100)}`;
      }});
      const text=result?.data?.text||'';
      const value=parseMeterOcrValue(text,prev);
      if(value==null){
        if(status){status.className='small warn';status.textContent='✓ Fotoğraf arşivlendi · endeks güvenle okunamadı, elle kontrol et.'}
        return;
      }
      const el=meterInputEl(type);if(el)el.value=value;
      if(type==='gas')validateMeterInput(prev);else validateWaterInput(type,prev);
      upsertMeterReading(u,p,type,prev,value,{
        photoPath,photoFileName:file.name||null,photoMimeType:file.type||'image/jpeg',
        ocrText:text,ocrConfidence:Number(result?.data?.confidence||0),source:'photo_ocr',capturedAt:new Date().toISOString()
      });
      saveState();
      logAudit('Sayaç fotoğraftan otomatik işlendi',`${p.month} · ${u.label} · ${type} · ${value}`);
      if(status){status.className='small ok';status.innerHTML=`✓ Fotoğraf arşivlendi · <b>${value}</b> otomatik okundu ve sisteme kaydedildi.`}
    }catch(e){
      console.warn(e);
      if(status){status.className='small warn';status.textContent='✓ Fotoğraf arşivlendi · OCR başarısız, değeri elle gir.'}
    }
  };
  i.click();
}
function upsertMeterReading(u,p,type,prev,value,meta={}){

function expenseBankTx(exp){return exp?.bankTransactionId?state.bankTransactions.find(t=>t.id===exp.bankTransactionId):null}
function outgoingBankTxs(){return state.bankTransactions.filter(t=>Number(t.amount)<0)}
function uniqueExpenseBankCandidate(exp){
  if(!exp||exp.bankTransactionId)return null;
  const d=new Date(exp.date+'T12:00:00');
  const c=outgoingBankTxs().filter(t=>!t.expenseId&&Math.abs(Math.abs(Number(t.amount))-Number(exp.amount))<0.01&&Math.abs((new Date(t.date+'T12:00:00')-d)/86400000)<=7);
  return c.length===1?c[0]:null;
}
function reconcileExpenseBankLinks(auto=true){
  let linked=0;
  if(auto){state.expenses.forEach(e=>{if(e.bankTransactionId)return;const tx=uniqueExpenseBankCandidate(e);if(tx){e.bankTransactionId=tx.id;e.paid=true;e.paymentMethod='Banka';tx.expenseId=e.id;linked++;}});if(linked)saveState()}
  return linked;
}
function expenseDocumentStatus(e){return e.fileName?'Faturalı / Belgeli':'Belge eksik'}
function bankExpenseStatus(tx){return tx.expenseId?'Gider kaydıyla eşleşti':'Gider/fatura eşleşmesi bekliyor'}
function matchExpenseToBank(expId,txId){
  const e=state.expenses.find(x=>x.id===expId),tx=state.bankTransactions.find(x=>x.id===txId);if(!e||!tx)return;
  if(e.bankTransactionId&&e.bankTransactionId!==txId){const old=state.bankTransactions.find(x=>x.id===e.bankTransactionId);if(old)old.expenseId=null}
  if(tx.expenseId&&tx.expenseId!==expId){notify('Bu banka hareketi başka bir giderle eşleşmiş. Önce o eşleşmeyi kaldırın.');return}
  e.bankTransactionId=tx.id;e.paid=true;e.paymentMethod='Banka';tx.expenseId=e.id;saveState();logAudit('Gider banka çıkışıyla eşleştirildi',`${e.description} · ${trMoney(e.amount)} · ${bankProfile(tx.bankId).name}`);render();notify('Fatura/gider ile banka çıkışı eşleştirildi.');
}
function unlinkExpenseBank(expId){const e=state.expenses.find(x=>x.id===expId);if(!e?.bankTransactionId)return;const tx=state.bankTransactions.find(x=>x.id===e.bankTransactionId);if(tx)tx.expenseId=null;e.bankTransactionId=null;saveState();render();notify('Banka eşleşmesi kaldırıldı.')}
function openExpenseBankMatcher(expId){
  const e=state.expenses.find(x=>x.id===expId);if(!e)return;const d=new Date(e.date+'T12:00:00');
  const rows=outgoingBankTxs().filter(t=>!t.expenseId||t.id===e.bankTransactionId).map(t=>{const dd=Math.round(Math.abs((new Date(t.date+'T12:00:00')-d)/86400000)),same=Math.abs(Math.abs(Number(t.amount))-Number(e.amount))<0.01;return {t,dd,same}}).filter(x=>x.dd<=30).sort((a,b)=>(b.same-a.same)||a.dd-b.dd).slice(0,30);

function parseExpenseOcr(text){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let amount=ocrFindNumber(lines,['ODENECEK TUTAR','GENEL TOPLAM','TOPLAM TUTAR','FATURA TUTARI','TOPLAM']);
  let date=null;for(const line of lines){const m=line.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})\b/);if(m){date=`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;break}}
  return {amount,date};
}
async function runExpenseOcr(file){const st=$('#exOcrStatus');if(!window.Tesseract){st.className='notice bad';st.textContent='OCR modülü yüklenemedi; alanları elle doldurun.';return}st.className='notice';st.innerHTML='<b>Belge okunuyor…</b> %0';try{const r=await Tesseract.recognize(file,'tur+eng',{logger:m=>{if(m.status==='recognizing text'&&st)st.innerHTML=`<b>Belge okunuyor…</b> %${Math.round((m.progress||0)*100)}`}});pendingExpenseOcrText=r?.data?.text||'';const p=parseExpenseOcr(pendingExpenseOcrText);let f=[];if(p.date){$('#exDate').value=p.date;f.push('tarih')}if(p.amount!=null){$('#exAmount').value=p.amount;f.push('tutar')}st.className='notice warn';st.innerHTML=f.length?`<b>Otomatik okuma tamamlandı.</b> ${f.join(' ve ')} dolduruldu. Belgeye bakarak kontrol edin.`:'OCR tamamlandı; alanlar güvenle ayrılamadı. Elle girip kontrol edin.';$('#exReviewed').checked=false}catch(err){st.className='notice bad';st.textContent='Belge okunamadı. Alanları elle doldurabilirsiniz.'}}
function captureExpenseDoc(){const i=$('#docInput');i.value='';i.onchange=async e=>{pendingExpenseFile=e.target.files?.[0]||null;$('#exFileName').textContent=pendingExpenseFile?.name||'Belge seçilmedi.';if(!pendingExpenseFile)return;if(pendingExpenseFile.type==='application/pdf'||/\.pdf$/i.test(pendingExpenseFile.name)){$('#exOcrStatus').className='notice warn';$('#exOcrStatus').textContent='PDF alındı. Bu test sürümünde otomatik okuma fotoğrafta çalışır; alanları elle kontrol edin.';return}await runExpenseOcr(pendingExpenseFile)};i.click()}
function saveExpense(editId=''){
  if(!$('#exReviewed')?.checked){notify('Belgedeki bilgileri kontrol ettiğinizi işaretleyin.');return}
  const txId=$('#exBankTxId')?.value||null;let e=editId?state.expenses.find(x=>x.id===editId):null;if(!e){e={id:uid('exp')};state.expenses.push(e)}

  pendingExpenseFile=null;pendingExpenseOcrText='';saveState();logAudit('Gider/fatura kaydedildi',`${e.category} · ${e.description} · ${trMoney(e.amount)}`);closeModal();render();notify(e.bankTransactionId?'Gider kaydedildi ve banka çıkışıyla eşleşti.':'Gider kaydedildi; banka eşleşmesi kontrol edilebilir.');

async function resumeAndRender(){
  if(session && ['owner','tenant'].includes(session.role)){
    try{
      if(!authSession||!publicSb)throw new Error('Sakin oturumu bulunamadı');
      await publicSb.auth.setSession({access_token:authSession.access_token,refresh_token:authSession.refresh_token});
      const {data:residentState,error}=await publicSb.rpc('resident_portal_state');
      if(error)throw error;
      state=normalizeResidentPortalState(residentState);
      localStorage.setItem(STORE_KEY,JSON.stringify(state));
    }catch(e){
      console.warn('Sakin oturumu doğrulanamadı',e);
      session=null;authSession=null;
      localStorage.removeItem(SESSION_KEY);localStorage.removeItem(AUTH_SESSION_KEY);
      try{await publicSb?.auth?.signOut()}catch(_e){}
    }
  }
  if(session&&['manager','caretaker'].includes(session.role)&&authSession){await cloudLoadState();startOtherDeviceUpdates();}
  render();
}
